• Azyklisch, elementar: Aktionsschnelligkeit
• Azyklisch, komplex: Kraftschnelligkeit und Kraft-Schnelligkeitsausdauer
• Übergreifend: einfache Reaktionsschnelligkeit (geht beiden Bewegungsarten voraus)

Merke
• Kraftschnelligkeit (= Schnellkraft) und Sprintschnelligkeitsausdauer gehören sowohl zu den konditionellen als auch zu den koordinativen Fähigkeiten
• Schnelligkeit als Hauptbeanspruchungsform lässt sich deshalb beiden Bereichen zuordnen – sie ist eine „Zwischenfähigkeit“

Fallstricke
• Frequenz- und Aktionsschnelligkeit nicht verwechseln: zyklisch = Wiederholung, azyklisch = einmalige Bewegung
• „Elementar“ heißt: kein nennenswerter Widerstand und keine Ermüdung – sobald Kraft oder Ausdauer dazukommen, ist es komplexe Schnelligkeit`, k:[
{q:"Ordne folgende Leistungen einer Erscheinungsform der motorischen Schnelligkeit zu und begründe: a) Schrittfrequenz im 100-m-Lauf, b) Smash im Badminton, c) Absprung beim Volleyball-Block, d) 400-m-Lauf.", a:"a) Frequenzschnelligkeit: zyklisch, elementar – gleiche Bewegung mit höchster Frequenz.\nb) Aktionsschnelligkeit: azyklisch, elementar – einmalige Bewegung mit geringem Widerstand.\nc) Kraftschnelligkeit: azyklisch, komplex – der eigene Körper muss als Widerstand schnell beschleunigt werden.\nd) Sprintschnelligkeitsausdauer: zyklisch, komplex – hohe Geschwindigkeit unter Ermüdung."},
{q:"Erkläre, warum Schnelligkeit sowohl den konditionellen als auch den koordinativen Fähigkeiten zugeordnet werden kann.", a:"Schnelle Bewegungen hängen einerseits von körperlichen Voraussetzungen wie Kraft, Muskelfasertyp und Energiebereitstellung ab (konditionell), andererseits von der Steuerung durch das Nervensystem, also wie schnell und genau Muskeln angesteuert werden (koordinativ). Kraftschnelligkeit und Sprintschnelligkeitsausdauer zeigen diese Doppelnatur besonders deutlich."},
{q:"Begründe an einem Beispiel, dass Frequenz- und Aktionsschnelligkeit voneinander unabhängig sind.", a:"Ein Weltklassesprinter hat eine sehr hohe Schrittfrequenz, kann aber nicht unbedingt so schnell schlagen wie ein Boxer. Umgekehrt hat ein Boxer eine hohe Aktionsschnelligkeit im Schlag, ohne deshalb sprinterisch schnell zu sein. Beide Formen beruhen auf unterschiedlichen Bewegungsprogrammen."}]},

{t:"Kognitive Schnelligkeit, Handlung und Reaktion", i:["Im Fußball gewinnt oft nicht der Schnellste, sondern wer die Situation am schnellsten erkennt und richtig entscheidet. Diese „Schnelligkeit im Kopf“ heißt kognitive Schnelligkeit – zusammen mit der Bewegung ergibt sie die Handlungsschnelligkeit.","Gerade in Spiel- und Kampfsportarten ist das entscheidend und im Abi ein beliebtes Thema. Unten lernst du die kognitiven Formen und den Unterschied zwischen einfacher und komplexer Reaktion."], s:`Kognitive Schnelligkeit
• Wahrnehmungsschnelligkeit: eine Handlung schnell in sich aufnehmen, um effektiv handeln zu können
• Antizipationsschnelligkeit: auf Grundlage von Erfahrungswissen das Verhalten von Gegner und Mitspielern schnell voraussehen
• Entscheidungsschnelligkeit: in kürzester Zeit die richtige Handlungsmöglichkeit auswählen und überraschende Bewegungen ausführen
• Besonders wichtig in komplexen Spiel- und Kampfsportarten

Ziel der kognitiven Schnelligkeit
• Gedankliches Vorausnehmen zukünftiger Ereignisse durch Erfahrung
• Dadurch werden Reaktionszeiten verkürzt und Bewegungen früher erkannt
• Beispiel: Ein erfahrener Torwart liest am Anlauf ab, in welche Ecke geschossen wird

Handlungsschnelligkeit
• Komplexe Kombination aus motorischer und kognitiver Schnelligkeit
• Technisch-taktische Entscheidungen und Bewegungen müssen in situativ kurzer Zeit umgesetzt werden
• Formel: Handlungsschnelligkeit = Wahrnehmungs-, Antizipations- und Entscheidungsschnelligkeit + Reaktionsschnelligkeit + Bewegungsschnelligkeit (mit oder ohne Ball)

Einfache und komplexe Reaktion
• Einfache Reaktion: Auf ein vorgegebenes Signal folgt eine vorgegebene Aktion – z.B. Start beim 100-m-Sprint auf den Startschuss
• Komplexe Reaktion (Auswahlreaktion): Mehrere Handlungsmöglichkeiten stehen zur Verfügung; die passende muss möglichst schnell ausgewählt und ausgeführt werden – z.B. im Fußball je nach Spielsituation und Position des Mitspielers ein Steilpass in den Lauf
• Komplexe Reaktionen dauern länger, weil zusätzlich entschieden werden muss

Beispiel
• Basketball-Spielaufbau: Der Aufbauspieler nimmt die Verteidigung wahr (Wahrnehmung), erkennt, dass ein Mitspieler sich gleich freiläuft (Antizipation), wählt den Pass statt des Wurfs (Entscheidung) und spielt den Ball schnell und präzise (Reaktions- und Bewegungsschnelligkeit).

Fallstricke
• Antizipation ist nicht Raten, sondern beruht auf Erfahrung und erlernten Mustern
• Einfache Reaktion = ein Signal, eine Antwort; sobald gewählt werden muss, ist sie komplex`, k:[
{q:"Erkläre am Beispiel eines Handballtorwarts beim Siebenmeter alle Bestandteile der Handlungsschnelligkeit.", a:"Wahrnehmung: Er nimmt Anlauf, Körperhaltung und Wurfarm des Schützen auf. Antizipation: Aus Erfahrung erkennt er typische Bewegungsmuster und sagt die Wurfecke voraus. Entscheidung: Er wählt die Abwehrbewegung (z.B. Bein nach links unten). Reaktions- und Bewegungsschnelligkeit: Er setzt die Bewegung im richtigen Moment möglichst schnell um."},
{q:"Unterscheide einfache und komplexe Reaktion und begründe, warum eine komplexe Reaktion länger dauert.", a:"Bei der einfachen Reaktion ist Signal und Antwort festgelegt (Startschuss → Start). Bei der komplexen Reaktion muss aus mehreren Möglichkeiten die passende ausgewählt werden. Die zusätzliche Informationsverarbeitung und Entscheidung kostet Zeit, deshalb ist die Reaktionszeit länger."},
{q:"Begründe, warum ältere, erfahrene Spieler in Spielsportarten trotz geringerer Sprintgeschwindigkeit oft „schneller“ wirken.", a:"Sie verfügen über mehr Erfahrungswissen und erkennen Spielsituationen früher (Antizipation). Dadurch beginnen sie ihre Handlung eher und entscheiden schneller. Die höhere kognitive Schnelligkeit gleicht die geringere motorische Schnelligkeit teilweise aus."}]},

{t:"Einflussgrößen, Trainierbarkeit und Ziele", i:["Warum ist der eine Mensch von Natur aus schneller als der andere? Das hängt von vielen Faktoren ab: von den Nerven, den Muskelfasern, dem Kopf und auch von Alter und Talent. Manche davon kann man trainieren, andere kaum.","Einflussgrößen und Trainierbarkeit musst du im Abi erklären und auf Beispiele anwenden können. Unten lernst du die vier Gruppen von Einflussgrößen, die Trainierbarkeit und die Ziele des Schnelligkeitstrainings."], s:`Neuronale Größen
• Rekrutierung und Frequenzierung motorischer Einheiten: wie viele Einheiten aktiviert werden und wie schnell sie feuern
• Muskuläre Innervation: zeitlich genau abgestimmte Ansteuerung (Zeitprogramme)
• Neurobiochemie: Botenstoffe an den Synapsen
• Reflexinnervation: Nutzung von Dehnreflexen
• Reizleitungsgeschwindigkeit der Nerven

Muskel- und sehnenspezifische Größen
• Muskelfasertypenverteilung: Anteil schneller FT-Fasern (Typ II)
• Querschnittsfläche der FT-Fasern
• Kontraktionsgeschwindigkeit des Muskels
• Dehnbarkeit und Muskeltemperatur (Aufwärmen!)
• Energiebereitstellung: v.a. schnell verfügbares Kreatinphosphat

Sensorisch-kognitive und psychische Größen
• Konzentration (selektive Aufmerksamkeit)
• Informationsaufnahme und -verarbeitung
• Motivation, Willenskraft, Selbststeuerung
• Wissen, Erfahrung, Taktik

Anlage-, entwicklungs- und lernbedingte Größen
• Alter, Geschlecht, Konstitution (Körperbau)
• Anthropometrie (Körpermaße) und Talent
• Qualität der sportlichen Technik
• Sozialisation (z.B. frühe Bewegungserfahrungen)

Trainierbarkeit
• Elementare Schnelligkeitsformen sind schon im Kindes- und Jugendalter gut trainierbar, weil Nerven- und Muskelsystem dafür bereits angelegt sind
• Komplexe Formen werden erst später voll ausgeprägt – mit zunehmender Kraft, Ausdauer und Koordination
• Sensible Phase im Kindesalter: Das Zusammenspiel von Nerven- und Muskelsystem festigt sich früh, deshalb sollte (Handlungs-)Schnelligkeit so früh wie möglich trainiert werden
• Der genetisch bestimmte Fasertypanteil begrenzt die Trainierbarkeit im Erwachsenenalter

Weitere Einflüsse
• Geschlecht: Die maximale Laufgeschwindigkeit von Frauen liegt etwa 10–15 % unter der von Männern
• Alter: Mit zunehmendem Alter nehmen Kraft und Schnelligkeit physisch bedingt ab
• Ermüdung: Vor allem zentrale Ermüdung verschlechtert die Schnelligkeitsleistung deutlich – deshalb nur ausgeruht trainieren

Zielsetzungen im Schnelligkeitstraining
• Motorische Grobziele: Verbesserung der 400-m-Zeit, der „Sekunden“-Zeit (Sprint), der Reaktionszeit und der Lauftechnik
• Kognitive Grobziele: Verbesserung von Entscheidungsschnelligkeit, Antizipationsfähigkeit und Spielverständnis
• Affektiv-emotionale Grobziele: Aufmerksamkeitsschulung, Erlernen von Entspannungstechniken

Fallstricke
• Schnelligkeit ist stark anlagebedingt, aber nicht nur – Technik, Kraft und Kognition sind gut trainierbar
• Muskeltemperatur ist ein oft vergessener Faktor: kalte Muskeln kontrahieren langsamer`, k:[
{q:"Erläutere je eine neuronale und eine muskuläre Einflussgröße der Schnelligkeit.", a:"Neuronal: Rekrutierung und Frequenzierung – je mehr motorische Einheiten gleichzeitig und je schneller sie aktiviert werden, desto schneller und kraftvoller die Kontraktion. Muskulär: Fasertypenverteilung – schnelle FT-Fasern kontrahieren schneller als ST-Fasern; ein hoher FT-Anteil begünstigt Schnelligkeit."},
{q:"Begründe, warum Schnelligkeitstraining schon im Kindesalter wichtig ist.", a:"Das Zusammenspiel von zentralem Nervensystem und Muskulatur entwickelt und festigt sich früh. Elementare Schnelligkeitsformen sind in dieser sensiblen Phase besonders gut trainierbar. Später sind die neuronalen Muster stabiler und schwerer zu verändern."},
{q:"Formuliere für eine Fußballspielerin je ein motorisches, kognitives und affektiv-emotionales Ziel des Schnelligkeitstrainings.", a:"Motorisch: Verbesserung der Antrittsschnelligkeit auf den ersten 10 m. Kognitiv: Verbesserung der Antizipation von Pässen des Gegners. Affektiv-emotional: Aufmerksamkeit über 90 Minuten hochhalten bzw. Entspannungstechniken vor Standardsituationen erlernen."}]},

{t:"Methoden und Inhalte des Schnelligkeitstrainings", i:["Schnelligkeit trainiert man nicht mit vielen langen Läufen, sondern mit wenigen, kurzen, maximal schnellen Belastungen und langen Pausen. Wer müde sprintet, wird nicht schneller – nur müder.","Die Methoden mit ihren Belastungsnormativen sind Kernstoff fürs Abi. Unten lernst du Wiederholungs-, Kontrast- und intensive Intervallmethode sowie passende Übungen am Beispiel des 100-m-Laufs."], s:`Grundsatz
• Für die zyklische motorische Schnelligkeit steht die Wiederholungsmethode im Mittelpunkt
• Die Kontrastmethode ergänzt sie gezielt
• Für die Schnelligkeitsausdauer kommt ergänzend die intensive Intervallmethode hinzu

Wiederholungsmethode
• Reizintensität: maximal
• Reizdauer: gering, z.B. 30–50 m
• Reizumfang: gering, abhängig von Trainingszustand und Ziel
• Wiederholungen: 3–5 je Serie
• Pause: vollständige Erholung zwischen den Wiederholungen – Faustregel: 1 Minute Pause pro 10 m Laufstrecke

Kontrastmethode
• Ziel: Bewegungsmuster verändern und aufbrechen (gegen die Geschwindigkeitsbarriere)
• Gezielter Wechsel zwischen erschwerten Bedingungen (Anspannung) und erleichterten Bedingungen (Entspannung)
• Erschwert: Zugschlitten bzw. Zugmaschinen, Bergaufläufe, erhöhte Reibung (z.B. Sand)
• Erleichtert: Bergabläufe (leichtes Gefälle), Anschieben, Zuggeräte (Ziehen durch Partner oder Gummiseil)

Intensive Intervallmethode
• Ergänzende Methode zum Training der Schnelligkeitsausdauer
• Reizintensität: submaximal bis hoch, ca. 80–95 % der Maximalgeschwindigkeit
• Reizdauer: ca. 15–80 Sekunden (z.B. 100–400 m)
• Reizumfang: mehrere Wiederholungen in 2–4 Serien
• Pause: unvollständige Erholung („lohnende Pause“), oft herzfrequenzgesteuert
• Prinzip: Die kumulative Ermüdung über die Serie ist der Trainingsreiz
• Ziel: größere Glykogenspeicher und höhere laktazide Kapazität – länger hohe Geschwindigkeit halten
• Einsatz: Sprintdisziplinen 100–400 m, Spielsportarten mit wiederholten Sprints (Fußball, Handball)
• Nur ergänzend: Die unvollständige Erholung widerspricht dem Grundprinzip des reinen Schnelligkeitstrainings

Trainingsinhalte am Beispiel des 100-m-Laufs
• Vier Phasen mit eigenen Trainingsinhalten
• 1. Startreaktion: Reaktion auf akustische/optische Signale, Starts aus verschiedenen Ausgangspositionen
• 2. Beschleunigung: plyometrisches Training, Sprünge, Antritte gegen Zugwiderstand
• 3. Frequenzschnelligkeit (Maximalgeschwindigkeit): Skippings, Sprunglauf, Steigerungsläufe, Lauf-ABC (Kniehebe-, Anfersen-, Überkreuzlauf)
• 4. Schnelligkeitsausdauer: Overdistance-Läufe (10–20 % über Wettkampfstrecke), Tempowechselläufe, Bergaufläufe

Übungen für Reaktion und Start
• Starts aus verschiedenen Ausgangspositionen (Sitzen, Bauch- und Rückenlage)
• Starts nach Nieder- oder Seitwärtssprüngen bzw. aus dem Rückwärtslaufen
• Starts auf verschiedenen Böden (Hartplatz, Sand, Rasen)
• Starts nach verschiedenen Signalen (akustisch, optisch, taktil)

Übungen für Beschleunigung
• Kurze horizontale und vertikale Sprünge, Mehrfachsprünge
• Plyometrisches Training (Niedersprünge, Sprungläufe)
• Antritte unter erschwerten Bedingungen (Zugwiderstand)
• Bergauf- und Treppauflaufen

• „Dribbling“ am Ort und in der Vorwärtsbewegung (schnelle, kurze Schritte)
• „Skippings“ (Kniehebelauf), Lauf mit Zugseil
• Läufe mit fliegendem Start, Läufe über die „Zauberschnur“ bzw. Koordinationsleiter

{t:"Schnelligkeit: Planung, Risiken und Tests", i:["Maximal schnelle Bewegungen sind für den Körper eine Extremsituation – ohne gute Vorbereitung droht eine Verletzung. Deshalb gibt es klare Regeln für das Training und einfache Tests, mit denen man Fortschritte messen kann.","Im Abi sollst du Trainingseinheiten planen und Tests auswerten. Unten lernst du Risiken, Grundsätze, drei Testverfahren mit Berechnung und wie man eine Einheit plant."], s:`Risiken
• Maximales Schnelligkeitstraining belastet den Bewegungsapparat sehr stark
• Erhöhtes Verletzungsrisiko (z.B. Muskelfaserrisse), besonders bei unzureichender Vorbereitung und fehlendem Aufwärmen

Kontraindikation
• Bei Personen mit entsprechenden Vorerkrankungen sind maximale Geschwindigkeitsbelastungen etwa ab dem 30. Lebensjahr kritisch zu sehen
• Mögliche Gefahren: Herzrhythmusstörungen, Blutdruckspitzen

Grundsätze
• Variable, abwechslungsreiche Übungen nutzen, um eine Geschwindigkeitsbarriere (Stagnation durch eingeschliffene Muster) zu vermeiden
• Immer mit maximal schneller Bewegungsausführung üben
• Nur im vollständig ausgeruhten Zustand trainieren
• Höchste Leistungsbereitschaft und Motivation sind nötig
• Gründlich aufwärmen und Schnelligkeitsübungen früh in die Einheit legen
• Höchstens 3-mal pro Woche, 2–3 Tage Pause bis zum nächsten Schnelligkeitstraining

Hand-Tapping-Test
• Überprüft die zyklische Schnelligkeit der Arme (Frequenzschnelligkeit)
• Möglichst viele Taps zwischen zwei Kreisen in 5 Sekunden
• Messwert: Anzahl Taps pro 5 Sekunden

Stabfall- bzw. Lineal-Test
• Überprüft die einfache Reaktionsschnelligkeit
• Ablauf: Daumen und Zeigefinger auf Höhe der 0-cm-Marke öffnen, Partner hält das Lineal senkrecht und lässt es ohne Vorwarnung fallen, so schnell wie möglich zugreifen, Fallstrecke h ablesen; 5 Durchgänge, Mittelwert bilden
• Berechnung: t = √(2 · h / g) mit h in Metern und g = 9,81 m/s²
• Vergleichswert 15-Jährige: Mittelwert ca. 0,23 s
• Variante komplexe Reaktion: Partner ruft vor dem Loslassen zufällig „Fangen!“ oder ein anderes Wort – nur bei „Fangen!“ greifen

20-m-Sprint aus dem Stand
• Überprüft Beschleunigungs- und Sprintschnelligkeit
• Messwert: Zeit vom Startsignal bis zur Ziellinie
• Referenzwerte 15-Jährige: Jungen ca. 3,71 s, Mädchen ca. 3,87 s (normierte Tabellen, u.a. Weineck)

Trainingseinheit planen
• Schnelligkeitsform bestimmen (einfache Reaktion, Aktion, Frequenz, Kraftschnelligkeit, Schnelligkeitsausdauer, kognitive Handlungsschnelligkeit)
• 3–4 passende Übungen auswählen
• Methode wählen und begründen
• Belastungsnormative festlegen: Intensität, Dauer, Umfang, Pausen, Häufigkeit
• Aufbau: Aufwärmen → Schnelligkeitsteil zu Beginn → ggf. weitere Inhalte → Cool-down

    const data = key==="settings"?settings:plans[key.slice(5)];

    if(db&&uid){try{await db.collection("data/users/"+uid).doc(key).set(JSON.parse(JSON.stringify(data)))}catch(e){}}

function st(sid){

  p.done=p.done||{}; p.notes=p.notes||{}; p.extra=p.extra||{};

      if(sid!=="ma"){ if(it.summary) p.notes[it.title]=it.summary; if(it.tasks&&it.tasks.length) p.extra[it.title]=it.tasks.map(({q,a})=>({q,a})); }});

function binom(n,k){let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r}

function chainSVG(sp){
  const n=sp.nodes.length,bh=36,gap=14,W=360,H=n*bh+(n-1)*gap+16;let g=MK;
  sp.nodes.forEach((t,i)=>{const y=8+i*(bh+gap);g+=`<rect class="node2${i===n-1&&sp.hiLast?" root":""}" x="70" y="${y}" width="220" height="${bh}" rx="10"/>`+tl(180,y+bh/2+4,t,"lbl2");
    if(i<n-1) g+=`<line class="ar-g" x1="180" y1="${y+bh+1}" x2="180" y2="${y+bh+gap-2}" marker-end="url(#mG)"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.cap||"")}">${g}</svg>`;
}
function hbarsSVG(sp){
  const n=sp.items.length,rh=34,W=360,H=n*rh+20;let g="";
  sp.items.forEach(([l,v,cls,r],i)=>{const y=10+i*rh,len=Math.max(4,v/sp.max*150);g+=tl(8,y+18,l,"lbl2","start",11)+`<rect class="${cls||"hb"}" x="150" y="${y+5}" width="${len}" height="20" rx="5"/>`+`<text class="tick" x="${150+len+6}" y="${y+19}">${esc(r||v)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.cap||"")}">${g}</svg>`;
}
function klimaSVG(sp){
  const W=360,H=240,x0=40,x1=320,yb=200,yt=20,T=sp.t,N=sp.n,tmin=Math.min(0,Math.floor(Math.min(...T)/10)*10),tmax=50;
  const Y=t=>yb-(t-tmin)/(tmax-tmin)*(yb-yt), bw=(x1-x0)/12;let g="";
  for(let t=tmin;t<=tmax;t+=10){g+=`<line class="grid" x1="${x0}" x2="${x1}" y1="${Y(t)}" y2="${Y(t)}"/><text class="tick" x="${x0-4}" y="${Y(t)+3}" text-anchor="end">${t}</text>`;if(t>=0)g+=`<text class="tick" x="${x1+4}" y="${Y(t)+3}">${t*2}</text>`}
  N.forEach((n,i)=>{const h=Y(0)-Y(Math.min(n/2,tmax));g+=`<rect class="kb${n/2<T[i]?" arid":""}" x="${x0+i*bw+2}" y="${Y(0)-h}" width="${bw-4}" height="${h}" rx="2"/><text class="tick" x="${x0+i*bw+bw/2}" y="${yb+14}" text-anchor="middle">${"JFMAMJJASOND"[i]}</text>`});
  g+=`<polyline class="kt" points="${T.map((t,i)=>`${(x0+i*bw+bw/2).toFixed(1)},${Y(t).toFixed(1)}`).join(" ")}"/>`;
  g+=`<text class="tick" x="${x0-4}" y="12" text-anchor="end">°C</text><text class="tick" x="${x1+4}" y="12">mm</text>`;
  g+=`<text class="lbl2" x="${x0+4}" y="${H-6}">Balken orange = arid (Niederschlag/2 < Temperatur)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.cap||"")}">${g}</svg>`;
}
const _sketchOld = sketch;
sketch = function(sp){ try{
  if(sp.type==="svg") return `<svg viewBox="${sp.vb||"0 0 360 240"}" role="img" aria-label="${esc(sp.cap||"")}">${MK}${sp.svg}</svg>`;
  if(sp.type==="cycle") return cycleSVG(sp);
  if(sp.type==="tree2") return treeSVG2(sp);
  if(sp.type==="chain") return chainSVG(sp);
  if(sp.type==="hbars") return hbarsSVG(sp);
  if(sp.type==="klima") return klimaSVG(sp);
}catch(e){} return _sketchOld(sp); };

/* ---------- Seiten ---------- */
function nav(){
  const ready=authed&&settings.abi.length===5&&settings.lk&&view.page!=="setup";
  const cur=["plan","cal","noten","profile"].includes(view.page)?view.page:"home";
  const tab=(id,l)=>`<button class="ntab" data-go="${id}" ${cur===id?'aria-current="page"':""}>${l}</button>`;
  return `<header class="nav"><button class="brand" data-go="${settings.abi.length===5?"home":"setup"}"><span class="logo" aria-hidden="true">S</span><span><b>SmartStud</b><small>Abi-Lernplan</small></span></button>
  ${ready?`<nav class="ntabs" aria-label="Hauptmenü">${tab("home","Dashboard")}${tab("plan","Planung")}${tab("cal","Kalender")}${tab("noten","Noten")}${tab("profile","Profil")}</nav>`:""}
  <time class="date" id="today">${todayStr()}</time></header>`;
}
function render(){
  AIREF={};AIN=0;
  const _f=document.getElementById("chatFab");if(_f){_f.hidden=!authed;if(!authed){const _p=document.getElementById("chatPanel");if(_p)_p.hidden=true}}
  const app=$("#app");
  if(view.page==="loading"){app.innerHTML=nav()+`<p class="muted">Lädt …</p>`;return}
  const html = !authed?renderLogin():view.page==="setup"?renderSetup():view.page==="home"?renderHome():view.page==="plan"?renderPlan():view.page==="cal"?renderCal():view.page==="noten"?renderNoten():view.page==="profile"?renderProfile():view.page==="subject"?renderSubject():renderTopic();
  app.innerHTML = nav()+html+`<p class="foot">SmartStud · Abi-Lernplan</p>`+(authed&&view.modal?modalHTML():"");
  if(view.modal&&!view.modal.focused){view.modal.focused=true;setTimeout(()=>{const d=$("#mDate");if(d)d.focus()},30)}
}
function renderLogin(){
  return `<section class="glass login"><span class="logo" aria-hidden="true">S</span><h1 class="gold-t">Willkommen bei SmartStud</h1>
  <p class="muted">Melde dich an, um deinen Abi-Lernplan zu öffnen.</p>
  <form id="loginForm" novalidate>
    <label>Anmeldename<input id="lname" autocomplete="username" maxlength="30" value="${esc(settings.name||"")}" placeholder="Dein Name"></label>
    <label>Passwort<input id="lpass" type="password" autocomplete="current-password" placeholder="Passwort"></label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn gold" type="submit">Anmelden</button>
  </form></section>`;
}

  <p class="lead">Tippe alle Fächer an, die du belegt hast. Danach wählst du daraus deine fünf Abifächer und deinen Leistungskurs. Auf dem Dashboard erscheinen nur die Abifächer, bei den Noten alle Fächer.</p>
  <div class="pick-grid">${SUBJECTS.map(s=>{const on=draftSubs.includes(s.id);return `<button class="pick" data-sub="${s.id}" aria-pressed="${on}"><span>${esc(s.name)}</span><span class="slot">${on?"✓":""}</span></button>`}).join("")}</div>
  ${draftSubs.length?`<h2>Deine fünf Abifächer</h2><p class="muted" style="margin:6px 0 12px">Die Reihenfolge, in der du tippst, wird zur Reihenfolge auf deinem Dashboard.</p>
  <div class="pick-grid" style="margin-top:0">${draftSubs.map(id=>{const i=draftPick.indexOf(id);return `<button class="pick" data-pick="${id}" aria-pressed="${i>=0}"><span>${esc(byId[id].name)}</span><span class="slot">${i>=0?i+1:""}</span></button>`}).join("")}</div>`:""}
  ${draftPick.length?`<h2>Dein Leistungskurs</h2><p class="muted" style="margin:6px 0 12px">Wähle eines deiner Abifächer als Leistungskurs.</p>
  <div class="chips lk-pick">${draftPick.map(id=>`<button class="chip" data-lk="${id}" aria-pressed="${draftLk===id}">${esc(byId[id].name)}</button>`).join("")}</div>`:""}
  <div style="height:110px"></div>
  <div class="setup-bar"><strong>${draftSubs.length} Fächer · ${draftPick.length} von 5 Abifächern${draftLk&&draftPick.includes(draftLk)?" · LK: "+esc(byId[draftLk].name):""}</strong>
    <label class="row" style="gap:8px">Bundesland <select id="land">${LAENDER.map(l=>`<option ${l===settings.land?"selected":""}>${l}</option>`).join("")}</select></label>
    <span style="flex:1"></span><button class="btn gold" id="saveSetup" ${ok?"":"disabled"}>Fächer speichern</button></div>`;
}
function mySubs(){const s=settings.subs&&settings.subs.length?settings.subs:settings.abi;return SUBJECTS.map(x=>x.id).filter(id=>s.includes(id)||settings.abi.includes(id))}
function nextOpen(){
  for(const sid of settings.abi){const s=byId[sid],p=st(sid),all=topicsOf(s);const i=all.findIndex(x=>!p.done[x.t]);if(i>=0) return {sid,i,t:all[i].t,name:s.name}}
  return null;
}
function renderHome(){
  let tot=0,done=0,tasks=0;
  settings.abi.forEach(sid=>{const pr=progress(sid);tot+=pr.n;done+=pr.d;const p=st(sid);topicsOf(byId[sid]).forEach(i=>{tasks+=(CARDEX[i.t]||[]).flat().length+(EXAM[i.t]?EXAM[i.t].p.length:0)+((p.extra[i.t]||[]).length)})});
  const nx=nextOpen(), others=SUBJECTS.filter(s=>!settings.abi.includes(s.id));
  return `<section class="hero">
    <div><p class="hello">Hallo, ${esc(settings.name||"")}!</p><h1 class="gold-t">Alles fürs Abi.<br>Ein klarer Plan.</h1>
      <p class="lead">SmartStud ist dein Begleiter bis zum Abitur. Wähle unten eines deiner Fächer und arbeite den Lehrplan Thema für Thema durch: Jede Seite startet mit einer einfachen Einführung, erklärt alles Wichtige mit Skizzen und Beispielen und hat Übungen mit Lösungen. Unter „Planung“ trägst du Prüfungen und Hausaufgaben ein – hier im Dashboard siehst du, wie viele Tage dir bleiben, und planst deine Lernzeit.</p>
</div>
    <div class="glass subj-card"><div class="ph"><h3>Deine Abifächer</h3><span class="badge">${esc(settings.land)}</span></div>
      ${settings.abi.map(sid=>{const s=byId[sid],pr=progress(sid);return `<button class="srow" data-subj="${sid}"><b>${esc(s.name)}${settings.lk===sid?' <span class="badge">LK</span>':""}</b><span class="srow-go" aria-hidden="true">›</span></button>`}).join("")}
    </div></section>
  <div class="duo">${soonHTML()}${avgHTML()}</div>
  ${countdownHTML()}
  ${hwHome()}
  <section class="stats"><div class="glass stat"><strong>${tot}</strong><span>Themen</span></div><div class="glass stat"><strong>${done}</strong><span>erledigt</span></div><div class="glass stat"><strong>${tasks}</strong><span>Aufgaben</span></div></section>
  <div class="row" style="margin-top:30px"><button class="btn" data-go="setup">Fächer ändern</button></div>`;
}
function renderSubject(){
  const s=byId[view.subj],p=st(s.id),pr=progress(s.id);let idx=0;
  return `<button class="backbtn" data-go="home"><span class="bb-ic" aria-hidden="true">←</span>Zur Startseite</button>
  <div class="subj-head"><div><h1 class="gold-t">${esc(s.name)}</h1><p class="muted" style="margin:6px 0 0">Lehrplan mit allen prüfungsrelevanten Themen</p></div>
    <div><strong>${pr.d} von ${pr.n} erledigt</strong><div class="bar"><i style="width:${pr.pct}%"></i></div></div></div>
  ${s.chapters.map(c=>`<section class="glass chap">${c.ch?`<h2>${esc(c.ch)}</h2>`:""}<ol class="lp">${c.items.map(it=>{const i=idx++,d=!!p.done[it.t];
    return `<li><button class="lp-row ${d?"done":""}" data-topic="${i}"><span class="n">${d?"✓":i+1}</span><span class="t">${esc(it.t)}</span><span class="st">${d?"erledigt":"→"}</span></button></li>`}).join("")}</ol></section>`).join("")}`;
}
function renderTopic(){
  const s=byId[view.subj],all=topicsOf(s),it=all[view.topic],p=st(s.id),d=!!p.done[it.t];
  const tasks=[...(it.k||[]),...(p.extra[it.t]||[])];
  const exam=s.id==="ma"?EXAM[it.t]:null, examBE=exam?exam.p.reduce((a,x)=>a+x[1],0):0;
  const prev=all[view.topic-1],next=all[view.topic+1];
  let body;
  if(view.tab==="learn"){
    if(it.s) body=learnHTML(it.s, EXTRA[it.t], CARDEX[it.t], INTRO[it.t]);
    else if(p.notes[it.t]) body=learnHTML(p.notes[it.t])+(sample?`<div class="row" style="margin-top:14px"><button class="btn small" id="genLearn">Lerninhalt neu erstellen</button></div>`:"");
    else body=`<div class="glass empty"><h3>Lerninhalt für dieses Thema</h3><p class="muted">${sample?"Claude erstellt dir Einleitung, Erklärung, Beispiel und typische Fehler – abgestimmt auf das Abitur in "+esc(settings.land)+".":"Lerninhalte können nur in der Claude-App erstellt werden."}</p>${sample?`<button class="btn gold" id="genLearn">Lerninhalt erstellen</button>`:""}<div class="gen-out" id="genOut"></div></div>`;
    body+= exam
      ? `<div class="glass card go-ex" style="margin-top:14px"><span><b>Bereit für die Prüfung?</b><br><span class="muted">Prüfungsaufgabe im Abi-Stil · ${examBE} BE</span></span><button class="btn gold" data-tab="ex">Zu den Prüfungsaufgaben</button></div>`
      : `<div class="glass card go-ex" style="margin-top:14px"><span><b>Bereit zum Üben?</b><br><span class="muted">${tasks.length} Aufgaben mit separaten Lösungen</span></span><button class="btn gold" data-tab="ex">Zu den Übungen</button></div>`;
  } else if(exam){
    body=examHTML(exam, examBE);
  } else {
    const anyOpen=tasks.some((_,i)=>view.open.has(i));
    body=`<div class="ex-top"><span class="muted">Erst selbst rechnen, dann vergleichen.</span>${tasks.length?`<button class="btn small" id="allSol">${anyOpen?"Alle Lösungen ausblenden":"Alle Lösungen anzeigen"}</button>`:""}</div>
    ${tasks.length?tasks.map((t,i)=>`<article class="glass task"><div class="num">Aufgabe ${i+1}</div><p class="q">${esc(t.q)}</p>
      <button class="btn small" data-sol="${i}">${view.open.has(i)?"Lösung ausblenden":"Lösung anzeigen"}</button>

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidays(y,land){
  const E=easter(y), c=LCODE[land]||"BY", rel=(n,t)=>{const x=new Date(E);x.setDate(x.getDate()+n);return [ymd(x),t]};
  const L=[[y+"-01-01","Neujahr"],rel(-2,"Karfreitag"),rel(1,"Ostermontag"),[y+"-05-01","Tag der Arbeit"],rel(39,"Christi Himmelfahrt"),rel(50,"Pfingstmontag"),[y+"-10-03","Tag der Deutschen Einheit"],[y+"-12-25","1. Weihnachtstag"],[y+"-12-26","2. Weihnachtstag"]];
  if(["BW","BY","ST"].includes(c)) L.push([y+"-01-06","Heilige Drei Könige"]);
  if(["BW","BY","HE","NW","RP","SL"].includes(c)) L.push(rel(60,"Fronleichnam"));

  if(["BW","BY","NW","RP","SL"].includes(c)) L.push([y+"-11-01","Allerheiligen"]);

  const bb=new Date(y,10,22); while(bb.getDay()!==3) bb.setDate(bb.getDate()-1);
  if(c==="SN") L.push([ymd(bb),"Buß- und Bettag"]); else if(c==="BY") L.push([ymd(bb),"Buß- und Bettag (schulfrei)"]);

function gAvg(sid){const L=grades(sid);if(!L.length)return null;const big=L.filter(g=>g.type==="kl"),small=L.filter(g=>g.type!=="kl");const m=a=>a.reduce((s,g)=>s+g.p,0)/a.length;

function gChart(sid){

/* ---------- Planung ---------- */
const noteFor = sum => { const n=17/3-sum/15; return Math.min(4,Math.max(1,Math.floor(n*10+1e-9)/10)); };
function planEval(){
  const pts=settings.pts||{}, ids=settings.abi, vals=ids.map(id=>pts[id]??8);
  const sum=vals.reduce((a,b)=>a+b,0), block=sum*4, why=[];
  if(block<100) why.push(`Weniger als 100 Punkte im Prüfungsblock (${block} von mindestens 100).`);
  ids.forEach((id,i)=>{ if(vals[i]===0) why.push(`0 Punkte in ${byId[id].name}.`) });
  const core=[...new Set(["de","ma",settings.lk].filter(id=>ids.includes(id)))];
  const low=core.filter(id=>(pts[id]??8)<5);
  if(low.length>1) why.push(`Unter 5 Punkte in mehr als einem der Fächer Deutsch, Mathematik und Leistungskurs (${low.map(id=>byId[id].name).join(", ")}).`);
  return {vals,sum,block,why,ok:!why.length,note:noteFor(sum),core};
}
function calcMini(){const r=planEval();return `${r.block} / 300 Punkte · ${r.ok?"Schnitt "+r.note.toFixed(1).replace(".",",")+" · bestanden":"nicht bestanden"}`}
function planResult(){
  const r=planEval(), tgt=settings.target??2.0;
  let need=null; for(let s=0;s<=75;s++){ if(noteFor(s)<=tgt+1e-9){need=s;break} }
  const diff=need==null?null:need-r.sum;
  return `<div class="pr-top"><div><span class="muted">Prüfungsblock</span><strong>${r.block}<small> / 300</small></strong></div>
    <div><span class="muted">Abi-Schnitt (Hochrechnung)</span><strong>${r.ok?r.note.toFixed(1).replace(".",","):"–"}</strong></div></div>
    <div class="verdict ${r.ok?"ok":"no"}">${r.ok?"✓ Bestanden":"✕ Nicht bestanden"}</div>
    ${r.why.length?`<ul class="why">${r.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`:""}
    <div class="target"><label>Wunschschnitt <select id="tgt">${Array.from({length:31},(_,i)=>(1+i/10)).map(v=>`<option value="${v.toFixed(1)}" ${Math.abs(v-tgt)<1e-9?"selected":""}>${v.toFixed(1).replace(".",",")}</option>`).join("")}</select></label>
    <p>${need==null?"":`Dafür brauchst du insgesamt mindestens <b>${need} Punkte</b> in deinen fünf Fächern, also im Schnitt <b>${(need/5).toFixed(1).replace(".",",")} Punkte</b> pro Fach. `+(diff<=0?`<span class="okc">Mit deinen Eingaben erreichst du das.</span>`:`Dir fehlen noch <b>${diff} Punkte</b>.`)}</p></div>`;
}

      else if(tp.size===1){const sc=document.getElementById("shScroll");SH.ts={id:e.pointerId,x:e.clientX,y:e.clientY,st:sc.scrollTop,sl:sc.scrollLeft}}
      return;
    }
    e.preventDefault(); const pt=pos(e);
    if(SH.tool==="eraser"){SH.cur={i,erase:true,id:e.pointerId,before:SH.pages[i].strokes.slice()};eraseAt(i,pt);eraseRing(i,pt);return}
    SH.cur={i,st:{t:SH.tool,c:SH.color,s:SH_W[SH.size],p:[pt]},id:e.pointerId};
    const Lv=pageCtx(i,true);if(Lv){Lv.ctx.clearRect(0,0,Lv.cv.width,Lv.cv.height);strokeOn(Lv.ctx,SH.cur.st,Lv.w)}
  });
  cv.addEventListener("pointermove",e=>{
    if(tp.has(e.pointerId)){
      tp.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(SH.pinch&&tp.size===2){const [a,b]=[...tp.values()],z=SH.pinch.z0*Math.hypot(a.x-b.x,a.y-b.y)/SH.pinch.d0;if(!SH.raf)SH.raf=requestAnimationFrame(()=>{SH.raf=0;applyZoom(z)});return}
      if(SH.ts&&e.pointerId===SH.ts.id){const sc=document.getElementById("shScroll");sc.scrollTop=SH.ts.st-(e.clientY-SH.ts.y);sc.scrollLeft=SH.ts.sl-(e.clientX-SH.ts.x)}
      return;
    }
    if(!SH.cur||e.pointerId!==SH.cur.id) return; e.preventDefault();
    let evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!evs||!evs.length) evs=[e];
    if(SH.cur.erase){evs.forEach(x=>eraseAt(i,pos(x)));eraseRing(i,pos(e));return}
    const st=SH.cur.st,min=.0012/(SH.z||1);
    evs.forEach(x=>{const r=pos(x),l=st.p[st.p.length-1],pt=[l[0]*.2+r[0]*.8,l[1]*.2+r[1]*.8,r[2]];if(Math.hypot(pt[0]-l[0],pt[1]-l[1])>=min)st.p.push(pt)});
    const Lv=pageCtx(i,true);if(Lv){Lv.ctx.clearRect(0,0,Lv.cv.width,Lv.cv.height);strokeOn(Lv.ctx,st,Lv.w)}
  });
  const end=e=>{
    if(tp.has(e.pointerId)){tp.delete(e.pointerId);if(tp.size<2)SH.pinch=null;if(SH.ts&&SH.ts.id===e.pointerId)SH.ts=null;return}
    if(SH.cur&&e.pointerId===SH.cur.id){const c=SH.cur;SH.cur=null;
      if(c.erase){eraseRing(i,null);const now=SH.pages[i].strokes;if(now.length!==c.before.length||now.some((s,k)=>s!==c.before[k])){SH.hist.push({i,before:c.before,after:now.slice()});SH.redo=[];shState()}return}
      const before=SH.pages[i].strokes.slice();SH.pages[i].strokes.push(c.st);SH.hist.push({i,before,after:SH.pages[i].strokes.slice()});SH.redo=[];shState();const Lv=pageCtx(i,true);if(Lv)Lv.ctx.clearRect(0,0,Lv.cv.width,Lv.cv.height);const B=pageCtx(i);if(B)strokeOn(B.ctx,c.st,B.w)}
  };
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
}
function closeSheet(){const o=document.getElementById("sheet");if(o)o.remove();document.body.classList.remove("sheet-open");const f=document.getElementById("chatFab");if(f)f.hidden=!authed}
function sheetClick(e){
  e.stopPropagation(); const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  if(d.sht){SH.tool=d.sht;document.querySelectorAll("#sheet [data-sht]").forEach(x=>x.classList.toggle("on",x===b));shWidths();return}
  if(d.shw){if(SH.tool==="eraser")SH.esize=+d.shw;else SH.size=+d.shw;shWidths();return}
  if(d.shc){SH.color=d.shc;if(SH.tool!=="pen")SH.tool="pen";document.querySelectorAll("#sheet [data-shc]").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("#sheet [data-sht]").forEach(x=>x.classList.toggle("on",x.dataset.sht===SH.tool));shState();return}
  if(d.sha==="undo"){const s=SH.hist.pop();if(s&&SH.pages[s.i]){SH.pages[s.i].strokes=s.before.slice();SH.redo.push(s);redrawPage(s.i)}shState();return}
  if(d.sha==="redo"){const s=SH.redo.pop();if(s&&SH.pages[s.i]){SH.pages[s.i].strokes=s.after.slice();SH.hist.push(s);redrawPage(s.i)}shState();return}
  if(d.sha==="finger"){SH.finger=!SH.finger;b.classList.toggle("on",SH.finger);toast(SH.finger?"Finger schreibt – zum Scrollen den Rand nutzen":"Finger scrollt, nur der Stift schreibt");return}
  if(d.sha==="add"){SH.pages.push({strokes:[]});sheetPages();const sc=document.getElementById("shScroll");setTimeout(()=>sc.scrollTo({top:sc.scrollHeight,behavior:"smooth"}),50);return}
  if(d.sha==="zin"){applyZoom((SH.z||1)+.25);return}
  if(d.sha==="zout"){applyZoom((SH.z||1)-.25);return}
  if(d.sha==="close"){closeSheet();return}
  if(d.sha==="submit"){askConfirm("Prüfung jetzt abgeben? Danach siehst du die Lösungen.","Abgeben",()=>{closeSheet();view.exam.mode="done";view.exam.end=Date.now();render()});return}
  if(d.sha==="cancel"){askConfirm("Prüfung abbrechen? Dein Blatt wird dabei gelöscht.","Prüfung abbrechen",()=>{closeSheet();SH.pages=[];SH.hist=[];view.exam={mode:"idle",pts:{}};render()},"Weiter schreiben");return}
}

/* ---------- Bestätigungsdialog (statt confirm, das im Artifact blockiert ist) ---------- */
function askConfirm(msg,okLabel,onOk,noLabel){
  const o=document.createElement("div");o.className="cf-ov";
  o.innerHTML=`<div class="cf-box" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="cf-act"><button class="cf-no">${esc(noLabel||"Abbrechen")}</button><button class="cf-yes">${esc(okLabel||"OK")}</button></div></div>`;
  document.body.appendChild(o);
  const close=()=>{o.remove();document.removeEventListener("keydown",onKey,true)};
  const onKey=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};
  document.addEventListener("keydown",onKey,true);
  o.addEventListener("click",e=>{e.stopPropagation();if(e.target===o||e.target.closest(".cf-no"))close();else if(e.target.closest(".cf-yes")){close();onOk()}});
  setTimeout(()=>{const y=o.querySelector(".cf-yes");if(y)y.focus()},20);
}
