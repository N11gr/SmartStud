<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStud – Abi-Lernplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#12174A; --bg2:#262A78; --bg3:#4B3A8E; --text:#EEF0FF; --soft:#AEB4DC; --gold:#F5D33F; --gold2:#FFE89A; --gold-ink:#17183A;
  --cyan:#6FD3F5; --card:rgba(255,255,255,.065); --card2:rgba(255,255,255,.1); --line:rgba(255,255,255,.14);
  --ok:#5BD6A0; --red:#FF8590; --shadow:0 18px 50px rgba(5,8,40,.45);
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#12174A;--text:#EEF0FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#12174A;--text:#EEF0FF;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg1)}
body{margin:0;min-height:100%;color:var(--text);font:16px/1.6 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(rgba(18,23,74,.0),rgba(18,23,74,.0)),url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22380%22 height=%22380%22 viewBox=%220 0 380 380%22%3E%3Cg opacity=%22.14%22 fill=%22none%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%0A%3Cg transform=%22translate(46 58) rotate(-35)%22 stroke=%22%23F5D33F%22%3E%3Crect x=%22-6%22 y=%22-34%22 width=%2212%22 height=%2256%22 rx=%222%22/%3E%3Cpath d=%22M-6 22 L0 36 L6 22%22/%3E%3Cpath d=%22M-6 -24 H6%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(205 52)%22 stroke=%22%23FFFFFF%22%3E%3Cpath d=%22M0 6 C-12 -2 -26 -2 -34 2 V30 C-26 26 -12 26 0 34 Z%22/%3E%3Cpath d=%22M0 6 C12 -2 26 -2 34 2 V30 C26 26 12 26 0 34%22/%3E%3Cpath d=%22M0 6 V34%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(318 168)%22 stroke=%22%236FD3F5%22%3E%3Cpath d=%22M-30 0 L0 -13 L30 0 L0 13 Z%22/%3E%3Cpath d=%22M-18 6 V18 C-8 26 8 26 18 18 V6%22/%3E%3Cpath d=%22M30 0 V18%22/%3E%3Ccircle cx=%2230%22 cy=%2221%22 r=%222.5%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(78 196)%22 stroke=%22%23F5D33F%22%3E%3Cpath d=%22M-11 6 C-20 -2 -16 -22 0 -22 C16 -22 20 -2 11 6 C8 9 7 12 7 15 H-7 C-7 12 -8 9 -11 6 Z%22/%3E%3Cpath d=%22M-6 20 H6%22/%3E%3Cpath d=%22M-4 25 H4%22/%3E%3Cpath d=%22M-26 -22 L-20 -17 M26 -22 L20 -17 M0 -34 V-29%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(176 300) rotate(-18)%22 stroke=%22%23FFFFFF%22%3E%3Crect x=%22-44%22 y=%22-9%22 width=%2288%22 height=%2218%22 rx=%222%22/%3E%3Cpath d=%22M-32 -9 V-2 M-20 -9 V-4 M-8 -9 V-2 M4 -9 V-4 M16 -9 V-2 M28 -9 V-4%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(312 300)%22 stroke=%22%236FD3F5%22%3E%3Cellipse rx=%2226%22 ry=%229%22/%3E%3Cellipse rx=%2226%22 ry=%229%22 transform=%22rotate(60)%22/%3E%3Cellipse rx=%2226%22 ry=%229%22 transform=%22rotate(-60)%22/%3E%3Ccircle r=%223%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(58 318)%22 stroke=%22%23F5D33F%22%3E%3Ccircle r=%2220%22/%3E%3Cellipse rx=%229%22 ry=%2220%22/%3E%3Cpath d=%22M-20 0 H20 M-17 -10 H17 M-17 10 H17%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(250 236)%22 stroke=%22%23FFFFFF%22%3E%3Cpath d=%22M-22 18 L22 18 L-22 -22 Z%22/%3E%3Cpath d=%22M-14 10 L-1 10 L-14 -3 Z%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(120 112) rotate(-12)%22 stroke=%22%236FD3F5%22%3E%3Cpath d=%22M-22 4 L24 -14 L8 20 L2 8 Z%22/%3E%3Cpath d=%22M2 8 L24 -14%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(340 46)%22 stroke=%22%23FFFFFF%22%3E%3Crect x=%22-14%22 y=%22-20%22 width=%2228%22 height=%2240%22 rx=%224%22/%3E%3Crect x=%22-9%22 y=%22-15%22 width=%2218%22 height=%229%22 rx=%221.5%22/%3E%3Cpath d=%22M-8 2 H-6 M-1 2 H1 M6 2 H8 M-8 9 H-6 M-1 9 H1 M6 9 H8 M-8 15 H-6 M-1 15 H1 M6 15 H8%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(262 116)%22 stroke=%22%23F5D33F%22%3E%3Cpath d=%22M0 -12 L3.5 -4 L12 -3.5 L5.5 2 L7.5 10.5 L0 6 L-7.5 10.5 L-5.5 2 L-12 -3.5 L-3.5 -4 Z%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(130 228)%22 stroke=%22%23FFFFFF%22%3E%3Cpath d=%22M-12 -10 C-12 -18 0 -18 0 -10 V12 C0 20 12 20 12 12 V-6%22/%3E%3C/g%3E%0A%3C/g%3E%0A%3Cg font-family=%22Georgia, 'Times New Roman', serif%22 font-weight=%22700%22 opacity=%22.14%22%3E%0A%3Ctext x=%22150%22 y=%22196%22 font-size=%2230%22 fill=%22%23F5D33F%22%3E%CF%80%3C/text%3E%0A%3Ctext x=%22196%22 y=%22166%22 font-size=%2217%22 fill=%22%23FFFFFF%22%3Ea%C2%B2%2Bb%C2%B2=c%C2%B2%3C/text%3E%0A%3Ctext x=%2214%22 y=%22140%22 font-size=%2220%22 fill=%22%236FD3F5%22%3EABC%3C/text%3E%0A%3Ctext x=%22226%22 y=%22350%22 font-size=%2218%22 fill=%22%23F5D33F%22%3EE=mc%C2%B2%3C/text%3E%0A%3Ctext x=%2296%22 y=%22270%22 font-size=%2220%22 fill=%22%236FD3F5%22%3E%E2%88%91%3C/text%3E%0A%3Ctext x=%22330%22 y=%22236%22 font-size=%2222%22 fill=%22%23FFFFFF%22%3E%3F%3C/text%3E%0A%3C/g%3E%3C/svg%3E") 0 0/380px 380px repeat,radial-gradient(900px 600px at 105% -5%,rgba(245,211,63,.28),transparent 60%),
             radial-gradient(800px 700px at -10% 30%,rgba(111,211,245,.10),transparent 60%),
             linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed}
h1,h2,h3{font-family:"DM Serif Display",Georgia,"Times New Roman",serif;font-weight:400;line-height:1.1;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.1rem,6.5vw,3.6rem)}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{max-width:1120px;margin:0 auto;padding:16px 18px 80px}
.gold-t{background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Navigation */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 22px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--gold-ink);display:grid;place-items:center;font-family:"DM Serif Display",serif;font-size:1.35rem;box-shadow:0 6px 18px rgba(245,211,63,.35)}
.brand b{display:block;font-weight:800;font-size:1.05rem;line-height:1.1}
.brand small{display:block;color:var(--soft);font-size:.8rem}
.ntabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(10,12,40,.45);border:1px solid var(--line)}
.ntab{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:800;color:var(--soft)}
.ntab[aria-current="page"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink)}
@media (max-width:760px){.nav{display:grid;grid-template-columns:1fr auto}.ntabs{grid-column:1/-1;grid-row:2;justify-content:space-between}.ntab{flex:1;padding:8px 6px}}
.date{font-weight:700;font-size:.9rem;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line)}

/* Buttons */
.btn{border-radius:999px;padding:11px 20px;font-weight:800;border:1px solid var(--line);background:var(--card);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);border-color:transparent;box-shadow:0 8px 24px rgba(245,211,63,.3)}
.btn.small{padding:7px 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--soft);padding:4px 0;font-weight:700}
.link:hover{color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.glass{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.muted{color:var(--soft)}
select{background:rgba(10,12,40,.5);border:1px solid var(--line);border-radius:10px;padding:7px 10px}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;margin:10px 0 28px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.lead{font-size:1.08rem;color:var(--soft);max-width:34em;margin:14px 0 22px}
.hint{color:var(--soft);font-size:.9rem;margin-top:14px}
.subj-card{padding:18px}
.subj-card .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge{font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(111,211,245,.16);color:var(--cyan)}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;background:rgba(10,12,40,.35);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:8px}
.srow b{font-weight:800}
.srow .bar{grid-column:1/-1}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--ok));border-radius:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:30px}
.stat{padding:18px;text-align:center}
.stat strong{display:block;font-family:"DM Serif Display",serif;font-size:2.1rem;line-height:1;color:var(--gold)}
.stat span{color:var(--soft);font-size:.88rem}
@media (max-width:520px){.stats{gap:8px}.stat{padding:14px 6px}.stat strong{font-size:1.6rem}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.92rem}

/* Fächerwahl */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:22px 0 30px}
.lk-pick .chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.pick{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font-weight:700;padding:13px 15px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.pick[aria-pressed="true"]{border-color:var(--gold);background:rgba(245,211,63,.12)}
.pick .slot{min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.82rem;border:1px dashed var(--soft)}
.pick[aria-pressed="true"] .slot{background:var(--gold);color:var(--gold-ink);border:0;font-weight:800}
.setup-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(1084px,calc(100% - 24px));display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:18px;background:rgba(18,23,74,.88);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:5}

/* Fach / Lehrplan */
.subj-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.subj-head .bar{width:min(320px,100%);margin-top:8px}
.chap{padding:18px;margin-bottom:16px}
.chap h2{font-size:1.3rem;margin-bottom:8px}
.lp{list-style:none;margin:0;padding:0}
.lp-row{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px}
.lp li:first-child .lp-row{border-top:0}
.lp-row:hover .t{color:var(--gold2)}
.lp-row .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:rgba(255,255,255,.08)}
.lp-row.done .n{background:var(--ok);color:#0B2A1E}
.lp-row .t{font-weight:700}
.lp-row .st{font-size:.82rem;color:var(--soft)}
.lp-row.done .st{color:var(--ok)}

/* Thema */
.crumbs{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.t-title{margin:4px 0 16px}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(10,12,40,.45);border:1px solid var(--line);margin-bottom:18px;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:3;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{border:0;background:none;border-radius:999px;padding:9px 18px;font-weight:800;color:var(--soft)}
.seg button[aria-selected="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink)}
.seg .cnt{display:inline-block;margin-left:6px;font-size:.78rem;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.18)}
.learn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.learn{grid-template-columns:minmax(0,1fr)}}
.card{padding:18px 20px}
.card.full{grid-column:1/-1}
.card h3{margin-bottom:8px}
.card .kind{font-size:.8rem;font-weight:800;color:var(--cyan);margin-bottom:4px}
.card p{margin:0 0 8px}
.card ul,.card ol{margin:0;padding-left:1.15em}
.card li{margin:3px 0}
.card li::marker{color:var(--gold)}
.intro{background:linear-gradient(135deg,rgba(245,211,63,.16),rgba(111,211,245,.08));border-color:rgba(245,211,63,.35)}
.intro p{margin:0 0 6px}
.intro b{color:var(--gold2)}
.warn{border-color:rgba(255,133,144,.45);background:rgba(255,133,144,.08)}
.warn .kind{color:var(--red)}
.tip .kind{color:var(--ok)}
.sketch figure{margin:0}
.sketch svg{width:100%;height:auto;display:block;max-height:340px}
.sketch figcaption{color:var(--soft);font-size:.88rem;margin-top:6px}
.example .q{font-weight:700;margin-bottom:10px;white-space:pre-wrap}
.steps{border-left:3px solid var(--gold);padding:4px 0 4px 14px;white-space:pre-wrap}
.note{font-size:.9rem;color:var(--soft);padding:10px 14px;border-radius:12px;border:1px dashed var(--line)}
.go-ex{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Aufklapp-Übungen in Karten */
.xp{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.xp summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-weight:800;color:var(--gold);padding:9px 14px;border-radius:12px;background:rgba(245,211,63,.1);border:1px solid rgba(245,211,63,.3)}
.xp summary::-webkit-details-marker{display:none}
.xp .chev{width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
.xp[open]>summary .chev{transform:rotate(-135deg);margin-top:4px}
.xq,.xa{padding:12px 4px 0}
.xq b,.xa b{display:block;font-size:.85rem;color:var(--soft)}
.xq p,.xa p{margin:2px 0 0;white-space:pre-wrap}
.xp.xsol summary{color:var(--ok);background:rgba(91,214,160,.1);border-color:rgba(91,214,160,.35)}
.xp.xsol .xa p{color:var(--text)}

/* Kalender – eigener Look */
.kal{font-family:"Space Grotesk",Manrope,system-ui,sans-serif;background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 55%,#F1F2FF 80%,#E3E6FB 100%);color:#16132F;border-radius:28px;padding:20px;border:1px solid rgba(255,255,255,.55);box-shadow:0 0 0 6px rgba(255,255,255,.07),0 0 0 13px rgba(255,255,255,.035),0 0 70px rgba(150,165,255,.28),0 26px 60px rgba(4,6,40,.45);margin-top:26px;position:relative;overflow:hidden}

.kal h2{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.02em;color:#16132F}
.k-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.k-title{display:flex;align-items:baseline;gap:10px}.k-title h2{font-size:clamp(1.7rem,5vw,2.4rem)}.k-title span{font-size:1.2rem;color:#8A86A8;font-weight:500}
.k-nav{display:flex;gap:6px;align-items:center}
.k-nav button{height:40px;min-width:40px;border-radius:12px;border:1px solid #E2DEF5;background:#fff;color:#16132F;font:700 1.15rem "Space Grotesk",sans-serif}
.k-nav .k-today{font-size:.88rem;padding:0 12px}
.k-plus{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font:500 1.7rem/1 "Space Grotesk",sans-serif;background:linear-gradient(135deg,#FF3D7F,#7B5CFF);box-shadow:0 8px 22px rgba(123,92,255,.45);display:grid;place-items:center;padding-bottom:3px;margin-left:4px}
.k-nav .k-plus{width:44px;height:44px;border-radius:50%;border:0;color:#fff;font-size:1.7rem;font-weight:500;background:linear-gradient(135deg,#FF3D7F,#7B5CFF)}
.cal .k-head{padding-right:56px}
.cal .k-nav .k-plus{position:absolute;top:20px;right:18px;margin:0}
.k-addday{white-space:nowrap}
.k-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.k-week span{text-align:center;font-size:.75rem;font-weight:700;color:#8A86A8;text-transform:uppercase;letter-spacing:.06em}
.k-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kd{position:relative;min-height:84px;border-radius:14px;border:1px solid #ECE9F8;background:#fff;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;color:#16132F;overflow:hidden;font-family:inherit}
.kd.blank{background:transparent;border:0}
.kd .dn{font-weight:700;font-size:.95rem;line-height:1;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.kd.we .dn{color:#8A86A8}
.kd.fer{background:repeating-linear-gradient(135deg,#EEF1F6 0 6px,#E2E7EF 6px 12px);border-color:#D5DCE7}
.kd.hol{background:#FFF1F7;border-color:#F9C5DC}.kd.hol .dn{color:#BE185D;box-shadow:inset 0 0 0 2px #BE185D}
.kd.today .dn{background:#16132F;color:#fff;box-shadow:none}
.kd.sel{outline:2px solid #16132F;outline-offset:-2px}
.kd:hover:not(.blank){border-color:#C9C0F5}
.tag{font-size:.62rem;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-fer{color:#475569}.t-hol{color:#BE185D}
.evs{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.ev{background:var(--c);color:var(--t,#fff);box-shadow:0 1px 0 rgba(0,0,0,.08);font-size:.62rem;font-weight:700;border-radius:6px;padding:1px 5px;line-height:1.4}
.k-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:.82rem;font-weight:500;color:#3F3B5E}
.k-legend span{display:inline-flex;align-items:center;gap:6px}.k-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.lg-fer{background:repeating-linear-gradient(135deg,#EEF1F6 0 3px,#C9D2DF 3px 6px)}.lg-hol{background:#FFF1F7;border:2px solid #BE185D}
.k-day{margin-top:16px;padding:14px;border-radius:18px;background:#fff;border:1px solid #ECE9F8}
.k-dayh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.k-addday{border:0;background:#16132F;color:#fff;border-radius:999px;padding:7px 14px;font:700 .85rem "Space Grotesk",sans-serif}

.target{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.target label{display:flex;gap:10px;align-items:center;font-weight:700}
.target p{margin:10px 0 0}
.okc{color:var(--ok);font-weight:700}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold2),var(--gold));color:var(--gold-ink);font-family:"DM Serif Display",serif;font-size:1.5rem}
.fl{display:grid;gap:6px;font-weight:700;font-size:.92rem;margin-top:12px}
.fl input,.fl select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(10,12,40,.55)}
.plist{list-style:none;margin:10px 0 16px;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-weight:700}

/* Prüfung */
.exam-head .eh-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:"DM Serif Display",serif;font-size:1.6rem;color:var(--gold);min-width:84px;text-align:right}
.score{font-weight:700}.score b{font-family:"DM Serif Display",serif;font-size:1.6rem;color:var(--gold)}
.exam{margin-top:14px}
.ex-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.be-h{font-weight:800;color:var(--soft);width:44px;text-align:center}
.stem{white-space:pre-wrap;margin:0 0 12px}
.part{display:grid;grid-template-columns:26px 1fr 44px;gap:10px;align-items:start;padding:12px 0 6px;border-top:1px solid var(--line)}
.part .pl{font-weight:800;color:var(--gold)}
.part .pq{white-space:pre-wrap}
.part .be{text-align:center;font-weight:800;border-left:1px solid var(--line)}
.part.sum{border-top:2px solid var(--line)}
.pdet{margin:4px 0 8px 36px;border-top:0;padding-top:4px}
.psol{margin:6px 0 10px 36px;padding:12px 14px;border-radius:14px;background:rgba(91,214,160,.08);border:1px solid rgba(91,214,160,.35)}
.psol b{color:var(--ok);font-size:.88rem}
.psol p{margin:4px 0 10px;white-space:pre-wrap}
.rate{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rb{min-width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:800}
.rb.on{background:var(--gold);color:var(--gold-ink);border-color:transparent}
@media (max-width:520px){.pdet,.psol{margin-left:0}}

/* Anmeldung */
.login{max-width:440px;margin:6vh auto 0;padding:30px 26px;text-align:center}
.login .logo{width:58px;height:58px;font-size:2rem;margin:0 auto 14px;border-radius:16px}
.login h1{font-size:clamp(1.9rem,6vw,2.4rem)}
.login form{text-align:left;margin-top:22px;display:grid;gap:14px}
.login label{display:grid;gap:6px;font-weight:700;font-size:.92rem}
.login input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,12,40,.55);font-size:1rem}
.login input:focus{border-color:var(--gold);outline:none}
.login .btn{width:100%;margin-top:4px}
.err{color:var(--red);font-weight:700;min-height:1.2em;margin:0;font-size:.9rem}
.hello{font-family:"DM Serif Display",Georgia,serif;font-size:clamp(1.5rem,4vw,2rem);margin:0 0 10px}
.navr{display:flex;gap:10px;align-items:center}

/* Übungen */
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.task{padding:18px 20px;margin-bottom:12px}
.task .num{font-weight:800;color:var(--gold);font-size:.88rem;margin-bottom:6px}
.task .q{white-space:pre-wrap;margin:0 0 12px}
.sol{margin-top:12px;padding:14px 16px;border-radius:14px;background:rgba(91,214,160,.09);border:1px solid rgba(91,214,160,.4);white-space:pre-wrap}
.sol b{display:block;color:var(--ok);margin-bottom:4px;font-size:.88rem}
.gen{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}

.t-foot{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:26px}
.t-foot .prev{justify-self:start}.t-foot .next{justify-self:end}
.t-foot .navb{background:none;border:0;color:var(--soft);font-weight:700;max-width:100%;text-align:left}
.t-foot .next.navb{text-align:right}
.t-foot .navb small{display:block;color:var(--text);font-weight:700}
@media (max-width:600px){.t-foot{grid-template-columns:1fr 1fr}.t-foot .mid{grid-column:1/-1;grid-row:1;justify-self:center}}
.empty{padding:26px;text-align:center}
.gen-out{white-space:pre-wrap;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--gold-ink);font-weight:800;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.foot{margin-top:40px;color:var(--soft);font-size:.82rem;text-align:center}

/* Skizzen */
svg .grid{stroke:rgba(255,255,255,.07);stroke-width:1}
svg .axis{stroke:var(--soft);stroke-width:1.3;fill:none}
svg .axh{fill:var(--soft)}
svg .tick{fill:var(--soft);font-size:9.5px;font-family:Manrope,sans-serif}
svg .lbl{fill:var(--text);font-size:11px;font-weight:700;font-family:Manrope,sans-serif}
svg .fn{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
svg .c1{stroke:var(--gold)} svg .c2{stroke:var(--cyan)} svg .c3{stroke:var(--soft)}
svg .h1{fill:var(--gold)} svg .h2{fill:var(--cyan)} svg .h3{fill:var(--soft)} svg .hhi{fill:var(--red)}
svg .dash{stroke-dasharray:5 4}
svg .f-pos{fill:rgba(91,214,160,.3)} svg .f-neg{fill:rgba(255,133,144,.35)} svg .f-acc{fill:rgba(245,211,63,.28)}
svg .rect{fill:rgba(111,211,245,.22);stroke:var(--cyan);stroke-width:1}
svg .box{fill:rgba(245,211,63,.18);stroke:var(--gold);stroke-width:1.5}
svg .ell{fill:none;stroke:var(--cyan);stroke-width:1.2;stroke-dasharray:3 3}
svg .pt{fill:var(--text);stroke:var(--bg1);stroke-width:1.5}
svg .bar0{fill:rgba(111,211,245,.55)} svg .bar1{fill:var(--red)}
svg .poly0{fill:rgba(245,211,63,.16);stroke:rgba(245,211,63,.6);stroke-width:1}
svg .poly1{fill:rgba(111,211,245,.16);stroke:rgba(111,211,245,.6);stroke-width:1}
svg .s-line{stroke:var(--gold);stroke-width:2.2} svg .s-line2{stroke:var(--cyan);stroke-width:2.2}
svg .s-dash{stroke:var(--soft);stroke-width:1.5;stroke-dasharray:5 4} svg .s-hi{stroke:var(--red);stroke-width:2.6}
svg .vec{stroke:var(--cyan);stroke-width:2.2} svg .vech{fill:var(--cyan)}
svg .sph{fill:rgba(111,211,245,.12);stroke:var(--cyan);stroke-width:1.5}
svg .node{fill:rgba(255,255,255,.08);stroke:var(--line)}
svg .edge{stroke:var(--soft);stroke-width:1.3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Dunkles Fensterdesign (Planung) ===== */
.srow{align-items:center}.srow-go{font-size:1.5rem;line-height:1;color:var(--gold)}
.kal{--w-bg:#211D3B;--w-card:#2B2650;--w-card2:#352F5C;--w-tx:#EEEAFB;--w-soft:#B3ACD6;--w-dim:#8E88B8;--w-line:rgba(255,255,255,.09)}
.kal{background:linear-gradient(165deg,#26214A 0%,#1B1834 100%);color:var(--w-tx);border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 6px rgba(255,255,255,.03),0 24px 60px rgba(4,6,30,.55)}
.kal h2,.kal .c-title{color:#F4F1FF}
.kal .k-title span,.kal .k-week span{color:var(--w-dim)}
.kal .k-nav button:not(.k-plus){background:var(--w-card);border-color:var(--w-line);color:var(--w-tx)}
.kal .kd{background:var(--w-card);border-color:var(--w-line);color:var(--w-tx)}
.kal .kd.blank{background:transparent;border:0}
.kal .kd.we .dn{color:var(--w-dim)}
.kal .kd.fer{background:repeating-linear-gradient(135deg,#2B2650 0 6px,#36305E 6px 12px);border-color:var(--w-line)}
.kal .kd.hol{background:#3A2148;border-color:#7A2F5B}.kal .kd.hol .dn{color:#FF8DBA;box-shadow:inset 0 0 0 2px #FF8DBA}
.kal .t-fer{color:var(--w-soft)}.kal .t-hol{color:#FF8DBA}
.kal .kd.today .dn{background:var(--gold);color:var(--gold-ink);box-shadow:none}
.kal .kd.sel{outline-color:#F4F1FF}
.kal .kd:hover:not(.blank){border-color:rgba(255,255,255,.28)}
.kal .k-legend{color:var(--w-soft)}
.kal .lg-fer{background:repeating-linear-gradient(135deg,#2B2650 0 3px,#4D4778 3px 6px)}.kal .lg-hol{background:#3A2148;border-color:#FF8DBA}.kal .lg-lern{border-color:var(--w-tx)}
.kal .k-day,.kal .nx,.kal .c-box,.kal .hw-item{background:var(--w-card);border-color:var(--w-line);color:var(--w-tx)}
.kal .nx{border-left-color:var(--c)}
.kal .k-addday{background:var(--gold);color:var(--gold-ink)}
.kal .k-row{border-top-color:var(--w-line);color:var(--w-tx)}.kal .k-row small{color:var(--w-soft)}
.kal .p-fer{background:#5B5585}
.kal .k-empty,.kal .k-sub,.kal .c-mini,.kal .lp-hint{color:var(--w-soft)}
.kal .nx-date{background:var(--w-card2)}.kal .nx-date small{color:var(--w-dim)}.kal .nx-body small{color:var(--w-soft)}
.kal .c-tog:not(.sm){background:var(--gold)}.kal .c-tog:not(.sm)::after{border-color:var(--gold-ink)}
.kal .k-f{color:var(--w-soft)}
.kal .k-f input,.kal .k-f select,.kal .k-f textarea,.calc .target select{background:var(--w-card2);color:var(--w-tx);border-color:var(--w-line);color-scheme:dark}
.kal .k-btn.ghost{background:var(--w-card2);color:var(--w-tx)}
.calc .pname b,.calc .pval,.calc .pr-top strong{color:#F4F1FF}
.calc .pr-top small,.calc .muted{color:var(--w-dim)}
.calc .prow{border-top-color:var(--w-line)}
.calc .prow input[type=range]{accent-color:var(--gold)}
.calc .badge{background:rgba(111,211,245,.18);color:var(--cyan)}.calc .badge.soft{background:rgba(255,255,255,.1);color:var(--w-soft)}
.calc .verdict.ok{background:rgba(91,214,160,.14);color:#6EE7B7;border-color:rgba(91,214,160,.4)}
.calc .verdict.no{background:rgba(255,133,144,.13);color:#FF9AA5;border-color:rgba(255,133,144,.45)}
.calc .why{color:#FF9AA5}.calc .okc{color:#6EE7B7}.calc .target{border-top-color:var(--w-line)}
.kal .hw-txt span{color:var(--w-soft)}.kal .hw-txt b{color:var(--w-tx)}
.kal .hw-check{border-color:var(--cyan);background:transparent}.kal .hw-check:hover{background:rgba(111,211,245,.15)}
.kal .hw-due{color:var(--w-soft)}.kal .hw-due.soon{color:#FBBF24}.kal .hw-due.late{color:#FF8590}
.kal .hw-del{color:var(--w-dim)}.kal .hw-del:hover{background:rgba(255,255,255,.08);color:#FF8590}
.k-modal .k-sheet{background:linear-gradient(165deg,#2A2550,#1E1A38);color:#EEEAFB;border:1px solid rgba(255,255,255,.1)}
.k-modal .k-sheet h2{color:#F4F1FF}
.k-modal .k-x{background:#352F5C;border-color:rgba(255,255,255,.12);color:#EEEAFB}
.k-modal .k-f{color:#B3ACD6}
.k-modal .k-f input,.k-modal .k-f select,.k-modal .k-f textarea{background:#352F5C;color:#EEEAFB;border-color:rgba(255,255,255,.12);color-scheme:dark}
.k-modal .k-btn.ghost{background:#352F5C;color:#EEEAFB}.k-modal .k-btn.danger{color:#FF8590}.k-modal .k-err{color:#FF8590}

/* ===== Notenseite ===== */
body.pg-noten{background:#0A0A0D}
details.np-card,details.np-card *,details.np-card *::before,details.np-card *::after{box-sizing:border-box}
.np-list .np-card>summary>span:first-child{display:block}
.ntab{white-space:nowrap}
@media (max-width:760px){.ntab{font-size:.82rem;padding:8px 4px}}
.np-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:8px 0 16px}
.np-title{font:800 clamp(2.5rem,8vw,3.6rem)/1 Manrope,system-ui,sans-serif;color:#F2F2F5;letter-spacing:-.03em;margin-top:6px}
.np-title span{color:#4AA8F0}
.np-avg{background:#E2EAE3;color:#151517;border-radius:18px 18px 4px 18px;padding:8px 16px 6px;text-align:right;line-height:1}
.np-avg b{font:800 2.2rem Manrope,sans-serif;display:block}.np-avg i{font-style:normal;color:#5E6E74;margin-right:6px;font-size:1.6rem}
.np-avg small{display:block;font-weight:700;margin-top:4px;color:#2b2b2e}
.np-chips{display:flex;gap:8px;margin-bottom:18px}
.np-chip{border:0;border-radius:999px;padding:10px 22px;font:800 1rem Manrope,sans-serif;background:#1B1B21;color:#9A9AA6}
.np-chip[aria-pressed="true"]{background:#3D8C8F;color:#fff}
.np-list{display:grid;gap:14px}
.np-list .np-card.gsub{position:relative;border:0;border-radius:18px;background:#1a1a1f;background:color-mix(in srgb,var(--sc) 30%,#111114);box-shadow:none;overflow:hidden;color:#EEE}
.np-card::before{content:"";position:absolute;left:0;top:0;width:20px;height:50px;background:var(--sc);border-radius:18px 0 0 0;clip-path:polygon(0 0,100% 0,100% 100%,45% 78%,0 70%)}
.np-card::after{content:"";position:absolute;left:10px;top:44px;bottom:0;width:9px;background:var(--sc)}
.np-list .np-card>summary{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:4px 10px;min-height:104px;padding:16px 16px 14px 38px;cursor:pointer;list-style:none}
.np-card>summary::-webkit-details-marker{display:none}
.np-name{font:800 clamp(1.4rem,4.5vw,1.8rem)/1.1 Manrope,sans-serif;color:#E9E9EF}
.np-tag{display:inline-block;vertical-align:middle;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.35);color:#fff;margin-left:4px}
.np-av{font:800 clamp(1.4rem,4.5vw,1.8rem)/1 Manrope,sans-serif;color:#fff;text-align:right}.np-av i{font-style:normal;font-size:.8em;opacity:.8;margin-right:6px}
.np-go{grid-column:2;grid-row:2;justify-self:end;align-self:end;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;color:var(--sc);font-weight:800;font-size:1.1rem;transition:transform .18s;filter:brightness(1.3)}
.np-card[open] .np-go{transform:rotate(90deg)}
.np-list .np-card .gbody{background:rgba(0,0,0,.28);border-top:1px solid rgba(255,255,255,.08);padding:14px 16px 16px 38px}
@media (max-width:600px){.np-list .np-card .gbody{padding-left:28px}}
.np-btn{margin:18px 0 0;border:0;border-radius:999px;padding:12px 20px;font:800 .95rem Manrope,sans-serif;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink)}
.np-note{color:#8A8A96;font-size:.85rem;margin-top:16px}
body.pg-noten .kal.calc{background:#141419;border-color:rgba(255,255,255,.08)}
body.pg-noten .kal.calc .c-box{background:#1D1D24}

/* Prüfung/Ereignis-Umschalter */
.k-seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:#352F5C;margin:4px 0 6px}
.k-seg button{flex:1;border:0;border-radius:999px;padding:9px 12px;font:800 .92rem "Space Grotesk",Manrope,sans-serif;background:transparent;color:#B3ACD6}
.k-seg button[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink)}

/* Heute & morgen */
.soon{padding:18px 20px;margin:0 0 22px;border-color:rgba(245,211,63,.45);box-shadow:0 0 0 1px rgba(245,211,63,.15),var(--shadow)}
.soon h2{font-size:1.5rem;margin-bottom:6px}
.so-day{margin-top:10px}
.so-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}.so-h b{font-size:1.05rem;color:var(--gold)}.so-h span{color:var(--soft);font-size:.88rem}
.so-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(10,12,40,.35);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:11px 14px;margin-top:8px;color:var(--text)}
.so-row.lern{grid-template-columns:auto minmax(0,1fr);border-left-style:dashed}
.so-txt{display:grid;gap:1px}.so-txt small{color:var(--soft)}
.soon .p-lern{background:transparent!important}

/* Zurück-Knopf */
.backbtn{display:inline-flex;align-items:center;gap:12px;padding:7px 20px 7px 7px;margin-bottom:6px;border-radius:999px;background:rgba(10,12,40,.55);border:1.5px solid rgba(236,72,153,.6);color:var(--text);font:800 1.02rem Manrope,system-ui,sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(5,8,40,.35),0 0 18px rgba(168,85,247,.25);transition:background .15s,border-color .15s}
.backbtn:hover{background:rgba(236,72,153,.12);border-color:#EC4899}
.bb-ic{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;background:linear-gradient(135deg,#FF3D7F,#7B5CFF);color:#fff;box-shadow:0 4px 14px rgba(123,92,255,.45);transition:transform .15s}
.backbtn:hover .bb-ic{transform:translateX(-3px)}
.backbtn:active{transform:scale(.98)}

/* Pink-lila Akzente: Logo, Datum, Navigation */
.logo{background:rgba(10,12,40,.55);border:1.5px solid rgba(236,72,153,.6);box-shadow:0 6px 18px rgba(5,8,40,.35),0 0 16px rgba(168,85,247,.25)}
.logo{color:#EC4899;background-clip:padding-box}
@supports (-webkit-background-clip:text){.logo{color:transparent;background:linear-gradient(135deg,#FF3D7F,#9B6BFF) text,rgba(10,12,40,.55);-webkit-background-clip:text,padding-box;background-clip:text,padding-box}}
.date{border:1.5px solid rgba(236,72,153,.6);box-shadow:0 0 16px rgba(168,85,247,.2)}
.ntabs{border:1.5px solid rgba(236,72,153,.6);box-shadow:0 0 18px rgba(168,85,247,.22)}

/* Dashboard: pink-lila Rahmen, Duo-Reihe, Notendurchschnitt */
.subj-card.glass,.soon.glass,.cd.glass,.hw-home.glass,.stat.glass,.avgw.glass{border:1.5px solid rgba(236,72,153,.55);box-shadow:0 0 18px rgba(168,85,247,.18),var(--shadow)}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:0 0 22px;align-items:stretch}
.duo .soon{margin:0}
@media (max-width:560px){.duo{grid-template-columns:1fr}}
.so-empty{color:var(--soft);margin:8px 0 0}
.avgw{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px 20px;color:var(--text);font-family:inherit;cursor:pointer}
.avgw:hover{background:rgba(255,255,255,.09)}
.aw-h{font-family:"DM Serif Display",Georgia,serif;font-size:1.5rem;line-height:1.1;background:linear-gradient(180deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.aw-big{font:800 clamp(2.2rem,5vw,3rem)/1.05 Manrope,sans-serif;margin-top:8px}.aw-big i{font-style:normal;color:var(--gold);margin-right:8px;font-size:.8em}

.aw-foot{color:var(--soft);font-size:.85rem}
.aw-empty{color:var(--soft);margin-top:8px}
.aw-go{margin-top:auto;padding-top:10px;color:#F472B6;font-weight:800;font-size:.92rem}

/* KI-Hilfe bei Übungen */
.ai-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.ai-lbl{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;color:#F9A8D4;margin-right:2px}
.ai-dot{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#FF3D7F,#7B5CFF);box-shadow:0 0 8px rgba(236,72,153,.5)}
.ai-b{border:1px solid rgba(236,72,153,.5);background:rgba(236,72,153,.1);color:#FBCFE8;border-radius:999px;padding:6px 12px;font:700 .82rem Manrope,sans-serif}
.ai-b:hover{background:rgba(236,72,153,.2);border-color:#EC4899}

/* Prüfungsblatt */
