{q:"Erkläre, warum eine schmelzende Eisfläche die Erwärmung verstärkt.", a:"Eis hat eine hohe Albedo und reflektiert viel Strahlung. Schmilzt es, kommt dunkleres Wasser oder Land zum Vorschein, das mehr Strahlung absorbiert. Die Erwärmung nimmt zu, mehr Eis schmilzt – eine positive Rückkopplung (Eis-Albedo-Effekt)."},
{q:"Begründe, warum es in den Tropen wärmer ist als an den Polen.", a:"In den Tropen fällt die Sonnenstrahlung steil ein, die Energie verteilt sich auf eine kleine Fläche und durchläuft eine kürzere Strecke in der Atmosphäre. An den Polen fällt sie flach ein und verteilt sich auf eine große Fläche."}]},

{t:"Klima- und Vegetationszonen", i:["Wenn du von Norden nach Süden über die Erde reisen würdest, kämst du durch Eiswüsten, Nadelwälder, Laubwälder, Wüsten und Regenwälder. Diese Abfolge folgt dem Klima, und das Klima folgt der Sonneneinstrahlung.","Klimazonen sind das Grundgerüst für fast alle Abi-Themen in Geographie. Unten lernst du die Zonen, ihre Vegetation und wie man Klimadiagramme liest."], s:`Klimaklassifikationen
• Genetisch: nach Ursachen, z.B. Luftdruck- und Windgürtel (Neef)
• Effektiv: nach Wirkungen, z.B. Temperatur, Niederschlag, Vegetation (Köppen-Geiger, Troll/Paffen)

Klimadiagramm lesen
• Temperatur- und Niederschlagskurve im Verhältnis 1 °C : 2 mm
• Liegt die Niederschlagskurve über der Temperaturkurve: humid; darunter: arid
• Angaben: Jahresmitteltemperatur, Jahresniederschlag, Lage, Höhe

Zonen und Vegetation
• Polare und subpolare Zone: Eis, Tundra
• Boreale Zone: Nadelwald (Taiga)
• Gemäßigte Zone: sommergrüner Laubwald (ozeanisch), Steppe (kontinental)
• Subtropen: Hartlaubvegetation (winterfeucht, z.B. Mittelmeer), Wüsten und Halbwüsten (trocken)
• Tropen: Savannen (wechselfeucht), Regenwald (immerfeucht)

Wichtige Begriffe
• Jahreszeitenklima (gemäßigte Breiten) vs. Tageszeitenklima (Tropen: Tagesschwankung größer als Jahresschwankung)
• Thermische und hygrische Jahreszeiten (Regen- und Trockenzeit)

Fallstricke
• Beim Klimadiagramm immer auch Lage, Höhe und Ausreißer nennen`, k:[
{q:"Ein Klimadiagramm zeigt ganzjährig 26–28 °C und in jedem Monat über 150 mm Niederschlag. Ordne es einer Zone zu und begründe.", a:"Immerfeuchte Tropen (tropischer Regenwald): ganzjährig hohe Temperaturen mit geringer Jahresschwankung (Tageszeitenklima) und in allen Monaten humide Verhältnisse."},
{q:"Unterscheide genetische und effektive Klimaklassifikation.", a:"Genetische Klassifikationen ordnen das Klima nach seinen Ursachen, z.B. Luftdruck- und Windsysteme. Effektive Klassifikationen ordnen nach messbaren Wirkungen wie Temperatur, Niederschlag und Vegetation, z.B. Köppen-Geiger."}]},

{t:"Atmosphärische Zirkulation", i:["Weil die Tropen mehr Energie bekommen als die Pole, gerät die Luft in Bewegung – wie ein riesiger Wärmetransport rund um die Erde. Daraus entstehen Hoch- und Tiefdruckgebiete und die großen Windsysteme.","Mit der Zirkulation erklärst du Regenzeiten, Wüsten und den Monsun. Unten lernst du das Modell Schritt für Schritt."], s:`Luftdruckgürtel
• Äquatoriale Tiefdruckrinne (Innertropische Konvergenzzone, ITC): warme Luft steigt auf, Wolken, Zenitalregen
• Subtropischer Hochdruckgürtel (um 30°): Luft sinkt ab, erwärmt sich, trocken → Wüsten
• Subpolare Tiefdruckrinne (um 60°)
• Polare Hochdruckgebiete

Passatkreislauf (Hadley-Zelle)
• Aufsteigen am Äquator, Abfluss in der Höhe polwärts, Absinken bei ca. 30°
• Rückströmung am Boden: Passate
• Corioliskraft lenkt Winde auf der Nordhalbkugel nach rechts, auf der Südhalbkugel nach links ab → Nordost- und Südostpassat

Mittelbreiten
• Westwinddrift mit wandernden Tiefdruckgebieten (Zyklonen) und Hochs
• Polarfront und Jetstream in der Höhe

Jahreszeitliche Verlagerung
• Die ITC wandert mit dem Zenitstand der Sonne nach Norden und Süden
• Folge: Regenzeiten in den wechselfeuchten Tropen, Trockenzeiten wenn die ITC fern ist

Fallstricke
• Die ITC verlagert sich über Land stärker als über dem Meer`, k:[
{q:"Erkläre, warum bei etwa 30° nördlicher und südlicher Breite viele Wüsten liegen.", a:"Dort sinkt die Luft der Hadley-Zelle ab, erwärmt sich dabei und wird relativ trockener. Es bilden sich beständige Hochdruckgebiete, Wolkenbildung und Niederschlag werden unterdrückt – es entstehen Wüsten wie die Sahara."},
{q:"Erkläre die Entstehung des Nordostpassats.", a:"Am Boden strömt Luft vom subtropischen Hoch zur äquatorialen Tiefdruckrinne, also nach Süden. Die Corioliskraft lenkt sie auf der Nordhalbkugel nach rechts ab, sodass ein Wind aus Nordost entsteht."}]},

{t:"Monsun", i:["In Indien regnet es monatelang kaum – und dann kommt plötzlich der Monsun mit gewaltigen Regenmengen. Dahinter steckt ein Wind, der im Lauf des Jahres seine Richtung wechselt.","Der Monsun bestimmt das Leben von Milliarden Menschen und ist ein Abi-Klassiker. Unten lernst du, wie er entsteht und was er bewirkt."], s:`Definition
• Großräumiger, beständiger Wind, der jahreszeitlich seine Richtung um mindestens 120° wechselt

Indischer Sommermonsun (ca. Juni–September)
• Starke Erwärmung des Kontinents, besonders des Hochlands von Tibet → Hitzetief
• Die ITC verlagert sich weit nach Norden
• Der Südostpassat überquert den Äquator, wird durch die Corioliskraft abgelenkt und kommt als feuchter Südwestmonsun über Indien an
• Steigungsregen an Gebirgen (Westghats, Himalaya), extreme Niederschläge

Wintermonsun
• Die ITC liegt südlich, über Asien liegt ein Kältehoch
• Trockener Nordostwind (entspricht dem Nordostpassat) → Trockenzeit

Bedeutung
• Lebenswichtig für die Landwirtschaft (z.B. Reisanbau, Wasserspeicher)
• Risiken: Überschwemmungen bei starkem, Dürren bei schwachem oder verspätetem Monsun
• Klimawandel kann den Monsun unregelmäßiger machen

Fallstricke
• Der Sommermonsun ist der abgelenkte Südostpassat – nicht ein „neuer“ Wind`, k:[
{q:"Erkläre die Entstehung des indischen Sommermonsuns.", a:"Im Sommer erwärmt sich der Kontinent stark, die ITC verlagert sich weit nach Norden. Der Südostpassat überquert den Äquator, wird von der Corioliskraft nach rechts abgelenkt und erreicht Indien als feuchter Südwestwind. An Gebirgen steigt die Luft auf und es kommt zu starken Niederschlägen."},
{q:"Erläutere zwei Folgen eines schwachen Monsuns.", a:"Ernteausfälle, weil Regen für Reis- und Feldbau fehlt; Wasserknappheit in Speichern und Städten, was Versorgung, Energie (Wasserkraft) und Einkommen der Landbevölkerung gefährdet."}]},

{t:"Meeresströmungen", i:["Die Ozeane sind ständig in Bewegung – riesige Strömungen transportieren warmes und kaltes Wasser um die Welt. Der Golfstrom ist der Grund, warum es in Europa viel milder ist als in Kanada auf gleicher Breite.","Meeresströmungen erklären Küstenwüsten, mildes Klima und Phänomene wie El Niño. Unten lernst du, wie sie entstehen und wirken."], s:`Antriebe
• Oberflächenströmungen: durch Winde (z.B. Passate, Westwinde), abgelenkt durch die Corioliskraft und die Kontinente
• Tiefenströmungen: durch Dichteunterschiede aus Temperatur und Salzgehalt → thermohaline Zirkulation („globales Förderband“)

Warme Strömungen
• Golfstrom und Nordatlantikstrom bringen Wärme nach Nordwesteuropa → milde Winter, eisfreie Häfen

Kalte Strömungen
• Z.B. Humboldtstrom (Peru/Chile), Benguelastrom (Namibia), Kanarenstrom
• Kühlen die Luft ab, verhindern Wolkenbildung → Küstenwüsten (Atacama, Namib), oft mit Nebel
• Auftrieb nährstoffreichen Tiefenwassers → fischreiche Gewässer

El Niño (ENSO)
• Schwächere Passate, warmes Wasser breitet sich vor Südamerika aus, der Auftrieb wird unterdrückt
• Folgen: Starkregen in Peru, Dürren in Indonesien und Australien, Einbruch der Fischerei
• Gegenstück: La Niña

Klimawandel
• Schmelzwasser verringert Salzgehalt und Dichte im Nordatlantik → mögliche Abschwächung der Umwälzströmung

Fallstricke
• Kalte Meeresströmung bedeutet nicht kaltes Klima an Land, sondern vor allem Trockenheit`, k:[
{q:"Erkläre, warum an der Küste Perus eine Wüste liegt, obwohl sie am Meer liegt.", a:"Der kalte Humboldtstrom kühlt die unteren Luftschichten ab. Es entsteht eine stabile Schichtung, in der Luft nicht aufsteigen und keine Regenwolken bilden kann. Es gibt höchstens Nebel – deshalb ist die Küste extrem trocken."},
{q:"Erläutere die Folgen eines El-Niño-Ereignisses für Peru.", a:"Warmes Wasser verdrängt das kalte, nährstoffreiche Auftriebswasser. Die Fischbestände brechen ein, die Fischerei leidet. Gleichzeitig kommt es zu Starkregen und Überschwemmungen in der sonst trockenen Küstenregion."}]},

{t:"Klimawandel", i:["Seit Beginn der Industrialisierung ist es auf der Erde deutlich wärmer geworden – vor allem, weil wir Kohle, Öl und Gas verbrennen. Das verändert Wetter, Meere und Lebensräume weltweit.","Der Klimawandel verbindet fast alle Geo-Themen und ist im Abi sehr wahrscheinlich. Unten lernst du Ursachen, Folgen und Gegenmaßnahmen."], s:`Ursachen
• Natürliche Schwankungen (z.B. Sonnenaktivität, Vulkanismus, Erdbahnparameter) erklären die heutige schnelle Erwärmung nicht
• Anthropogene Treibhausgase: CO₂ (fossile Brennstoffe, Entwaldung, Zement), Methan (Viehhaltung, Reisanbau, Deponien, Erdgas), Lachgas (Düngung)
• Weltweite Erwärmung bisher rund 1,2 °C gegenüber vorindustrieller Zeit (Stand 2020er-Jahre)

Folgen
• Meeresspiegelanstieg (Ausdehnung des Wassers, schmelzende Gletscher und Eisschilde)
• Mehr Extremwetter: Hitzewellen, Dürren, Starkregen
• Verschiebung von Klima- und Vegetationszonen
• Ozeanversauerung, Artensterben, Gefahren für Ernährung und Wasserversorgung
• Ungleich verteilt: Viele arme Länder sind stark betroffen, haben aber wenig beigetragen

Rückkopplungen und Kipppunkte
• Eis-Albedo-Effekt, tauender Permafrost (setzt CO₂ und Methan frei)
• Kipppunkte: z.B. Eisschilde, Amazonas-Regenwald, Atlantische Umwälzströmung

Gegenmaßnahmen
• Mitigation (Vermeidung): erneuerbare Energien, Effizienz, Aufforstung, CO₂-Preis
• Adaptation (Anpassung): Deiche, hitzeresistente Pflanzen, Stadtgrün
• Pariser Abkommen (2015): Erwärmung deutlich unter 2 °C, möglichst 1,5 °C

Fallstricke
• Wetter und Klima nicht verwechseln: Ein kalter Winter widerlegt den Klimawandel nicht`, k:[
{q:"Unterscheide Mitigation und Adaptation mit je einem Beispiel.", a:"Mitigation bekämpft die Ursachen, z.B. Ausbau erneuerbarer Energien. Adaptation passt sich an die Folgen an, z.B. höhere Deiche gegen den Meeresspiegelanstieg."},
{q:"Erkläre, warum tauender Permafrost den Klimawandel verstärken kann.", a:"Im Permafrost ist viel organisches Material gespeichert. Taut er auf, zersetzen Mikroorganismen das Material und setzen CO₂ und Methan frei. Diese Treibhausgase verstärken die Erwärmung weiter – eine positive Rückkopplung."}]}
]},

{ch:"12.2 Tropen", items:[
{t:"Ökosysteme der Tropen", i:["Die Tropen sind nicht überall gleich: Es gibt Gebiete, in denen es fast täglich regnet, und solche mit langen Trockenzeiten. Daraus entstehen ganz verschiedene Landschaften – vom Regenwald bis zur Dornsavanne.","Diese Unterschiede bestimmen, wie Menschen die Tropen nutzen können. Unten lernst du die tropischen Ökosysteme und ihre Böden kennen."], s:`Gliederung nach humiden Monaten
• Immerfeuchte Tropen (ca. 10–12 humide Monate): tropischer Regenwald
• Feuchtsavanne (ca. 7–9½ humide Monate): hohes Gras, Galeriewälder
• Trockensavanne (ca. 4½–7 humide Monate): Gras mit Bäumen, z.B. Schirmakazien
• Dornsavanne (ca. 2–4½ humide Monate): dornige Sträucher, lückenhafte Vegetation
• Je weiter vom Äquator entfernt, desto kürzer die Regenzeit

Klima
• Tageszeitenklima: Tagesschwankung der Temperatur größer als Jahresschwankung
• Regenzeiten durch die wandernde ITC (Zenitalregen)

Böden
• Tiefgründig verwittert durch Wärme und Feuchtigkeit über lange Zeit
• Nährstoffarm (z.B. Ferralsole), geringe Fähigkeit, Nährstoffe zu speichern (Zweischicht-Tonminerale)
• Fruchtbarkeit hängt stark von der Vegetation bzw. Humusschicht ab

Fallstricke
• Üppiger Regenwald bedeutet nicht fruchtbaren Boden`, k:[
{q:"Erkläre, warum die Regenzeit mit zunehmender Entfernung vom Äquator kürzer wird.", a:"Die Regenzeiten entstehen durch die ITC, die dem Zenitstand der Sonne folgt. Nahe am Äquator liegt sie lange bzw. zweimal im Jahr über dem Gebiet, weiter weg nur kurz. Deshalb nimmt die Zahl der humiden Monate polwärts ab."},
{q:"Beschreibe die Abfolge der Vegetation vom Regenwald zur Dornsavanne.", a:"Vom dichten, immergrünen Regenwald über die Feuchtsavanne mit hohem Gras und Galeriewäldern und die Trockensavanne mit Gras und vereinzelten Bäumen bis zur Dornsavanne mit lückenhafter, dorniger Vegetation."}]},

{t:"Ökosystem tropischer Regenwald", i:["Der Regenwald ist der artenreichste Lebensraum der Erde – und trotzdem steht er auf erstaunlich armen Böden. Sein Geheimnis ist ein perfekter Kreislauf, in dem fast nichts verloren geht.","Wer diesen Kreislauf versteht, versteht auch, warum Abholzung so schwere Folgen hat. Unten lernst du Aufbau, Nährstoffkreislauf und Bedeutung."], s:`Klima
• Ganzjährig warm (ca. 25–28 °C) und feucht, Niederschlag meist über 2.000 mm
• Typischer Tagesablauf: morgens klar, mittags Wolkenbildung, nachmittags Gewitterregen (Konvektion)

Stockwerkbau
• Kraut- und Strauchschicht, mehrere Baumschichten, Urwaldriesen (Emergenten) bis über 50 m
• Dichtes Kronendach, am Boden wenig Licht
• Sehr hohe Biodiversität

Nährstoffkreislauf
• Die meisten Nährstoffe stecken in der lebenden Biomasse, nicht im Boden
• Herabfallendes Laub wird sehr schnell zersetzt
• „Kurzgeschlossener“ Kreislauf: Pilze (Mykorrhiza) und flache Wurzeln nehmen Nährstoffe sofort wieder auf
• Der Boden selbst ist nährstoffarm

Bedeutung
• Kohlenstoffspeicher, Einfluss auf Klima und Wasserkreislauf (hohe Verdunstung)
• Lebensraum für indigene Völker, Quelle von Rohstoffen und Arzneistoffen

Fallstricke
• Wird der Wald entfernt, fehlt der Nährstoffspeicher – der Boden ist schnell ausgelaugt`, k:[
{q:"Erkläre den kurzgeschlossenen Nährstoffkreislauf.", a:"Nährstoffe sind überwiegend in der Biomasse gespeichert. Abgestorbenes Material wird schnell zersetzt, und die freigesetzten Nährstoffe werden über flache Wurzeln und Mykorrhizapilze sofort wieder aufgenommen, bevor sie ausgewaschen werden. Der Boden dient kaum als Speicher."},
{q:"Begründe, warum Ackerbau nach einer Rodung oft nur wenige Jahre erfolgreich ist.", a:"Mit dem Wald wird der Nährstoffspeicher entfernt. Der nährstoffarme Boden kann kaum Nährstoffe halten; Starkregen wäscht sie aus und erodiert den Boden. Nach wenigen Ernten sinken die Erträge stark."}]},

{t:"Nutzung der wechselfeuchten Tropen", i:["In den Savannen wechseln sich Regenzeit und lange Trockenzeit ab. Menschen leben hier vom Ackerbau und von Viehherden – doch wenn zu viel genutzt wird oder der Regen ausbleibt, kann das Land zur Wüste werden.","Das Thema Desertifikation, etwa in der Sahelzone, ist im Abi sehr häufig. Unten lernst du Nutzungsformen, Probleme und Lösungen."], s:`Nutzungsformen
• Regenfeldbau (z.B. Hirse, Mais) bis zur agronomischen Trockengrenze
• Weidewirtschaft und Nomadismus in trockeneren Gebieten
• Teilweise Bewässerung und Plantagen

Desertifikation
• Ausbreitung wüstenähnlicher Verhältnisse in Trockengebieten durch menschliche Übernutzung, verstärkt durch Dürren
• Beispiel: Sahelzone
• Ursachen: Überweidung, Abholzung für Brennholz, Ausdehnung des Ackerbaus in zu trockene Gebiete, verkürzte Brachezeiten, Bevölkerungswachstum
• Folgen: Bodenerosion, sinkende Erträge, Hunger, Migration

Gegenmaßnahmen
• Agroforstwirtschaft, Aufforstung (z.B. Projekt „Große Grüne Mauer“)
• Steinreihen und Pflanzgruben gegen Abfluss und Erosion (z.B. Zaï-Methode)
• Angepasste Herdengrößen, effizientere Kochherde

Fallstricke
• Desertifikation ist nicht dasselbe wie natürliche Wüstenausbreitung: Der Mensch ist ein wesentlicher Faktor`, k:[
{q:"Erkläre, wie Überweidung zur Desertifikation beiträgt.", a:"Zu viele Tiere fressen die Vegetation ab und zertreten den Boden. Ohne Pflanzendecke trocknet der Boden aus und wird durch Wind und Starkregen abgetragen. Die Fläche verliert ihre Fruchtbarkeit und nähert sich wüstenähnlichen Verhältnissen."},
{q:"Erläutere eine Maßnahme gegen Desertifikation.", a:"Agroforstwirtschaft: Bäume werden zusammen mit Feldfrüchten angebaut. Sie schützen den Boden vor Wind und Erosion, spenden Schatten, verbessern durch Laub den Humus und liefern Brennholz oder Früchte."}]},

{t:"Nutzung der Tropen", i:["Der tropische Regenwald liefert Holz, Platz für Plantagen und Weiden – aber jedes Jahr verschwinden riesige Flächen. Die Frage ist, wie man ihn nutzen kann, ohne ihn zu zerstören.","Nachhaltige Nutzung und Regenwaldzerstörung sind zentrale Abi-Themen. Unten lernst du traditionelle und moderne Nutzung, Folgen und Lösungen."], s:`Traditionelle Nutzung
• Brandrodungswanderfeldbau (Shifting Cultivation): kleine Flächen roden, wenige Jahre bebauen, dann lange Brache
• Nachhaltig bei geringer Bevölkerungsdichte und langer Regenerationszeit

Moderne Nutzung
• Holzeinschlag (Edelhölzer)
• Plantagen: Ölpalmen, Kautschuk, Kakao, Bananen
• Rinderweiden und Sojaanbau (z.B. Amazonien)
• Bergbau, Staudämme, Straßenbau

Folgen der Zerstörung
• Verlust der Artenvielfalt
• Bodendegradation und Erosion
• Freisetzung von CO₂, Veränderung des Wasserkreislaufs
• Verdrängung indigener Bevölkerung

Nachhaltige Ansätze
• Agroforstsysteme, Schutzgebiete, Extraktivreservate (Nutzung von Sammelprodukten)
• Zertifizierung (z.B. FSC-Holz), nachhaltiges Palmöl
• Internationale Finanzierung zum Waldschutz (z.B. REDD+)

Fallstricke
• Shifting Cultivation ist nicht automatisch schädlich – entscheidend sind Bevölkerungsdruck und Brachezeit`, k:[
{q:"Erkläre, unter welchen Bedingungen Shifting Cultivation nachhaltig ist.", a:"Wenn nur kleine Flächen gerodet werden und die Brachezeit lang genug ist, damit sich Wald und Nährstoffe erholen. Bei hoher Bevölkerungsdichte werden Brachezeiten kürzer, und die Böden degradieren."},
{q:"Erläutere zwei Folgen großflächiger Rodung für Sojaanbau.", a:"Der Verlust des Waldes zerstört Lebensräume und senkt die Artenvielfalt. Außerdem werden große Mengen CO₂ freigesetzt, und der regionale Wasserkreislauf wird geschwächt, was zu Trockenheit führen kann."}]}
]},

{ch:"12.3 Polare und Subpolare Zone", items:[
{t:"Permafrost", i:["In Sibirien, Kanada oder Alaska ist der Boden das ganze Jahr über gefroren – oft Hunderte Meter tief. Nur die oberste Schicht taut im Sommer kurz auf. Das macht Bauen und Leben dort zur Herausforderung.","Durch den Klimawandel taut der Permafrost, mit Folgen weit über die Arktis hinaus. Unten lernst du Aufbau, Probleme und Bedeutung."], s:`Definition
• Boden oder Gestein, das mindestens zwei Jahre ununterbrochen gefroren ist
• Kontinuierlicher Permafrost (fast überall gefroren) und diskontinuierlicher Permafrost (lückenhaft)
• Auftauschicht (Active Layer): taut im Sommer auf, darunter bleibt alles gefroren

Prozesse und Formen
• Im Sommer staut sich Wasser über dem gefrorenen Untergrund → Sümpfe
• Solifluktion: Bodenfließen am Hang
• Thermokarst: Einsenkungen durch tauendes Bodeneis

Bauen im Permafrost
• Wärme von Gebäuden kann den Boden auftauen → Absacken, Risse
• Lösungen: Gebäude auf Stelzen bzw. Pfählen, aufgeständerte Pipelines, Kühlung des Untergrunds

Klimawandel
• Tauender Permafrost beschädigt Straßen, Häuser und Leitungen
• Freisetzung von CO₂ und Methan aus gespeichertem organischem Material → verstärkt die Erwärmung

Fallstricke
• Permafrost ist nicht dasselbe wie Gletschereis – es geht um gefrorenen Boden`, k:[
{q:"Erkläre, warum Häuser in Permafrostgebieten auf Stelzen gebaut werden.", a:"Ein beheiztes Gebäude würde den gefrorenen Boden darunter erwärmen und auftauen lassen. Der Boden würde nachgeben, das Haus absacken. Durch Stelzen kann kalte Luft unter dem Haus zirkulieren, und der Boden bleibt gefroren."},
{q:"Was ist die Auftauschicht und welche Folge hat sie im Sommer?", a:"Die oberste Bodenschicht, die im Sommer auftaut. Da das Schmelzwasser nicht in den gefrorenen Untergrund versickern kann, entstehen Staunässe und Sümpfe, und der Boden kann am Hang abrutschen."}]},

{t:"Gebietsansprüche in der Arktis und Antarktis", i:["Lange interessierte sich kaum jemand für die Eiswüsten an den Polen. Doch durch das schmelzende Eis werden Rohstoffe und Schifffahrtswege erreichbar – und plötzlich wollen viele Staaten mitreden.","Das Thema verbindet Klimawandel, Wirtschaft und Politik. Unten lernst du, wer welche Ansprüche hat und welche Regeln gelten."], s:`Arktis
• Ozean, umgeben von Kontinenten; Anrainerstaaten: Russland, Kanada, USA, Norwegen, Dänemark (Grönland)
• Rechtsgrundlage: UN-Seerechtsübereinkommen
  12 Seemeilen Hoheitsgewässer, 200 Seemeilen Ausschließliche Wirtschaftszone (AWZ)
  Erweiterung des Festlandsockels möglich, wenn geologisch nachgewiesen
• Streit z.B. um den Lomonossow-Rücken (Russland, Dänemark, Kanada)
• Interessen: Erdöl, Erdgas, Bodenschätze, Fischerei, neue Seewege (Nordostpassage, Nordwestpassage)
• Arktischer Rat als Forum der Zusammenarbeit

Antarktis
• Kontinent, mit dickem Eisschild bedeckt
• Mehrere Staaten erheben Gebietsansprüche, die sich teils überlappen
• Antarktisvertrag (1959): Nutzung nur für friedliche Zwecke und Forschung, Gebietsansprüche ruhen
• Umweltschutzprotokoll (1991): Rohstoffabbau verboten

Konfliktfelder
• Wirtschaftliche Interessen vs. Umweltschutz
• Risiken: Ölunfälle in sensiblen Ökosystemen, Lebensraum indigener Völker in der Arktis

Fallstricke
• Arktis (Meer) und Antarktis (Kontinent) sind rechtlich ganz unterschiedlich geregelt`, k:[
{q:"Erkläre, warum das Interesse an der Arktis in den letzten Jahren gestiegen ist.", a:"Durch den Klimawandel geht das Meereis zurück. Dadurch werden Rohstoffvorkommen (Öl, Gas, Erze) leichter erreichbar und neue, kürzere Schifffahrtsrouten wie die Nordostpassage nutzbar."},
{q:"Vergleiche die rechtliche Situation von Arktis und Antarktis.", a:"Die Arktis ist ein Ozean, für den das UN-Seerecht gilt; Anrainerstaaten haben Wirtschaftszonen und können Festlandsockel beanspruchen. Die Antarktis ist ein Kontinent, für den der Antarktisvertrag gilt: friedliche Nutzung, Forschung, ruhende Gebietsansprüche und ein Verbot des Rohstoffabbaus."}]}
]},

{ch:"12.4 Mittelbreiten und Subtropen", items:[
{t:"Klima der Mittelbreiten und Subtropen", i:["Bei uns gibt es vier Jahreszeiten und ständig wechselndes Wetter, am Mittelmeer heiße, trockene Sommer und milde, nasse Winter. Diese Unterschiede entstehen durch Westwinde, Tiefdruckgebiete und die Lage zum Meer.","Das Klima der Mittelbreiten und Subtropen ist die Grundlage für Landwirtschaft, Bewässerung und Hochwasser. Unten lernst du die wichtigsten Klimatypen."], s:`Gemäßigte Breiten
• Westwinddrift mit wandernden Tiefdruckgebieten (Zyklonen) mit Warm- und Kaltfront
• Jahreszeitenklima mit deutlichen thermischen Jahreszeiten
• Ozeanisches Klima (Westseiten, z.B. Irland): milde Winter, kühle Sommer, Niederschlag ganzjährig
• Kontinentales Klima (Inneres, z.B. Russland): große Jahresamplitude, kalte Winter, warme Sommer, weniger Niederschlag
• Kontinentalität nimmt in Europa von West nach Ost zu

Subtropen
• Winterfeuchte Subtropen (mediterranes Klima): Sommer unter dem subtropischen Hoch heiß und trocken, Winter unter dem Einfluss der Westwinde feucht
• Sommerfeuchte Subtropen (Ostseiten der Kontinente, z.B. Südostchina)
• Trockene Subtropen: Wüsten durch absinkende Luft (z.B. Sahara)

Ursache der Winterregen im Mittelmeerraum
• Die Luftdruckgürtel verlagern sich mit dem Sonnenstand: im Winter nach Süden → Westwindzone mit Tiefs erreicht das Mittelmeer

Fallstricke
• Mediterranes Klima nicht mit „ganzjährig warm und trocken“ verwechseln`, k:[
{q:"Erkläre, warum es am Mittelmeer im Sommer trocken und im Winter feucht ist.", a:"Im Sommer liegt der Mittelmeerraum unter dem nach Norden verschobenen subtropischen Hochdruckgürtel mit absinkender, trockener Luft. Im Winter verlagern sich die Gürtel nach Süden, und die Westwindzone mit Tiefdruckgebieten bringt Niederschläge."},
{q:"Vergleiche ozeanisches und kontinentales Klima.", a:"Ozeanisch: geringe Jahresschwankung der Temperatur, milde Winter, kühle Sommer, ganzjährige Niederschläge. Kontinental: große Jahresschwankung, kalte Winter, heiße Sommer, insgesamt weniger Niederschlag."}]},

{t:"Bewässerungswirtschaft", i:["Ohne Wasser wächst nichts – doch in vielen warmen Regionen regnet es zu wenig. Mit Bewässerung können dort trotzdem Obst, Gemüse oder Baumwolle angebaut werden, allerdings mit Risiken.","Bewässerung und ihre Folgen wie Versalzung oder der verschwundene Aralsee sind typische Abi-Themen. Unten lernst du Formen, Probleme und Lösungen."], s:`Gründe
• Aride oder semiaride Gebiete, unzuverlässige Niederschläge, Wunsch nach mehreren Ernten pro Jahr

Wasserquellen
• Flüsse, Stauseen, Grundwasser (teils fossiles, nicht erneuerbares Grundwasser)

Bewässerungsformen
• Furchen- und Überstaubewässerung: einfach, aber hohe Verluste durch Verdunstung
• Beregnung: gleichmäßiger, mittlere Verluste
• Tropfbewässerung: Wasser direkt an die Wurzel, sehr effizient, aber teuer

Probleme
• Bodenversalzung: Wasser verdunstet, Salze reichern sich an; bei hohem Grundwasserstand steigt salziges Wasser kapillar auf
• Absinken des Grundwasserspiegels, versiegende Brunnen
• Konflikte um Wasser zwischen Staaten oder Nutzergruppen
• Beispiel Aralsee: Durch Bewässerung (v.a. Baumwolle) wurde den Zuflüssen Amudarja und Syrdarja so viel Wasser entnommen, dass der See größtenteils austrocknete

Lösungen
• Effizientere Techniken (Tropfbewässerung), Drainage gegen Versalzung, angepasste Pflanzen, Wasserpreise

Fallstricke
• Versalzung entsteht vor allem durch Verdunstung und mangelnde Drainage, nicht durch Meerwasser`, k:[
{q:"Erkläre, wie Bodenversalzung durch Bewässerung entsteht.", a:"Bewässerungswasser enthält gelöste Salze. In heißem Klima verdunstet viel Wasser, die Salze bleiben im Boden zurück. Steigt durch übermäßige Bewässerung zudem der Grundwasserspiegel, gelangt salzhaltiges Wasser kapillar an die Oberfläche und verdunstet – die Salzkonzentration nimmt zu."},
{q:"Begründe, warum Tropfbewässerung als nachhaltig gilt.", a:"Das Wasser wird gezielt an die Wurzeln geleitet, sodass kaum Verluste durch Verdunstung und Versickerung entstehen. Es wird weniger Wasser gebraucht, und die Gefahr von Versalzung sinkt."}]},

{t:"Hochwasser", i:["Wenn ein Fluss über die Ufer tritt, können ganze Ortschaften unter Wasser stehen – wie 2021 im Ahrtal. Hochwasser hat natürliche Ursachen, aber der Mensch verstärkt es oft unbewusst.","Das Thema verbindet Klima, Landnutzung und Raumplanung. Unten lernst du Ursachen, Folgen und Schutzmaßnahmen."], s:`Natürliche Ursachen
• Starkregen oder lang anhaltender Regen
• Schneeschmelze, oft kombiniert mit Regen
• Gesättigte oder gefrorene Böden, steile Täler

Anthropogene Verstärkung
• Versiegelung von Flächen (Straßen, Siedlungen): Wasser fließt schneller ab
• Flussbegradigung: höhere Fließgeschwindigkeit, Hochwasserwellen treffen schneller und höher ein
• Verlust von Auen und Überschwemmungsflächen durch Bebauung und Deiche
• Entwässerung von Feuchtgebieten, Abholzung
• Klimawandel: häufigere Starkregen

Hochwasserschutz
• Technisch: Deiche, Rückhaltebecken, Polder, Talsperren, mobile Schutzwände
• Natürlich: Renaturierung, Rückverlegung von Deichen, Auen als Überschwemmungsflächen
• Vorsorge: Bauverbote in Überschwemmungsgebieten, Frühwarnsysteme, Versicherungen

Beispiel
• Ahrtal (Juli 2021): extremer Starkregen in einem engen Tal, Sturzflut mit vielen Todesopfern

Fallstricke
• Technischer Schutz kann flussabwärts das Hochwasser verschärfen`, k:[
{q:"Erkläre, wie Flussbegradigungen Hochwasser flussabwärts verstärken können.", a:"Begradigte Flüsse sind kürzer und fließen schneller. Das Wasser erreicht flussabwärts schneller und gebündelt die Unterlieger, die Hochwasserwelle wird höher. Gleichzeitig fehlen Auen, die Wasser zurückhalten könnten."},
{q:"Unterscheide technischen und natürlichen Hochwasserschutz.", a:"Technischer Schutz baut Anlagen wie Deiche oder Rückhaltebecken. Natürlicher Schutz gibt dem Fluss Raum zurück, etwa durch Renaturierung und Auen, sodass Wasser in der Fläche zurückgehalten wird."}]},

{t:"Wälder in den Mittelbreiten", i:["Deutschlands Wälder bestehen heute oft aus Fichtenreihen – ursprünglich wuchsen hier aber vor allem Buchen und Eichen. Durch Trockenheit und Borkenkäfer sterben viele Fichten, und die Wälder müssen umgebaut werden.","Wald als Ökosystem und Wirtschaftsraum ist ein wichtiges Thema der Mittelbreiten. Unten lernst du Waldtypen, Funktionen und Probleme."], s:`Waldtypen
• Sommergrüner Laubwald (gemäßigte Zone): Buche, Eiche, Ahorn; Laubabwurf im Herbst als Anpassung an den Winter
• Borealer Nadelwald (Taiga): Fichte, Kiefer, Lärche; kurze Vegetationsperiode
• Mischwälder im Übergang

Funktionen des Waldes
• Nutzfunktion: Holz als Rohstoff
• Schutzfunktion: Boden-, Wasser-, Klima-, Lawinenschutz
• Erholungsfunktion
• Lebensraum und CO₂-Speicher

Nachhaltigkeit
• Begriff aus der Forstwirtschaft (Carlowitz, 1713): nur so viel Holz entnehmen, wie nachwächst

Probleme
• Monokulturen (z.B. Fichte) sind anfällig für Sturm, Trockenheit und Schädlinge
• Klimawandel: Hitze und Dürre schwächen Bäume
• Borkenkäfer befallen geschwächte Fichten massenhaft

Lösungen
• Waldumbau zu standortgerechten Mischwäldern mit klimatoleranten Baumarten
• Naturverjüngung, Schutz von Totholz für Artenvielfalt

Fallstricke
• Mehr Bäume pflanzen allein reicht nicht – entscheidend ist die richtige Mischung`, k:[
{q:"Erkläre, warum Fichtenmonokulturen besonders unter dem Klimawandel leiden.", a:"Fichten sind flachwurzelnd und brauchen kühles, feuchtes Klima. In heißen, trockenen Sommern geraten sie unter Trockenstress und können sich schlechter gegen Borkenkäfer wehren. In Monokulturen breiten sich Schädlinge zudem schnell aus."},
{q:"Nenne drei Funktionen des Waldes.", a:"Nutzfunktion (Holz), Schutzfunktion (z.B. Boden- und Wasserschutz, Klimaschutz) und Erholungsfunktion für Menschen."}]}
]},

{ch:"12.5 Hochgebirgsräume", items:[
{t:"Entstehung von Gebirgen", i:["Die Alpen und der Himalaya sind entstanden, weil sich riesige Erdplatten aufeinander zubewegen und das Gestein dazwischen zusammenschieben – ganz langsam, aber mit enormer Kraft.","Plattentektonik erklärt nicht nur Gebirge, sondern auch Vulkane und Erdbeben. Unten lernst du, wie Gebirge entstehen."], s:`Plattentektonik
• Die Lithosphäre ist in Platten zerlegt, die sich auf dem zähplastischen Erdmantel bewegen
• Antrieb: Konvektionsströme im Mantel, Plattenzug an Subduktionszonen
• Grundlage: Alfred Wegeners Kontinentalverschiebung

Plattengrenzen
• Konstruktiv (divergent): Platten bewegen sich auseinander, z.B. Mittelatlantischer Rücken
• Destruktiv (konvergent): Platten bewegen sich aufeinander zu
• Konservativ (Transformstörung): Platten gleiten aneinander vorbei

Gebirgsbildung an konvergenten Grenzen
• Ozeanisch-kontinental: Die schwerere ozeanische Platte taucht ab (Subduktion), Kettengebirge mit Vulkanismus, z.B. Anden
• Kontinental-kontinental (Kollision): Keine Platte taucht ab, Gestein wird gefaltet, gestapelt und gehoben, z.B. Himalaya, Alpen

Weitere Prozesse
• Faltung, Deckenüberschiebung, Hebung
• Gleichzeitig Abtragung durch Verwitterung, Gletscher und Flüsse

Fallstricke
• Faltengebirge entstehen nicht in kurzer Zeit, sondern über viele Millionen Jahre`, k:[
{q:"Erkläre die Entstehung des Himalaya.", a:"Die Indische Platte bewegt sich auf die Eurasische Platte zu. Da beide kontinental und leicht sind, taucht keine ab. Das Gestein wird zusammengeschoben, gefaltet, übereinandergestapelt und gehoben – es entsteht ein Kollisionsgebirge."},
{q:"Vergleiche die Entstehung der Anden und der Alpen.", a:"Anden: ozeanische Platte taucht unter die kontinentale Südamerikanische Platte ab (Subduktion), es entstehen Gebirge mit Vulkanen. Alpen: Kollision kontinentaler Platten bzw. Plattenteile, Gestein wird gefaltet und gestapelt, ohne vergleichbaren Vulkanismus."}]}
]},

{ch:"13.1 Wirtschaftliche Entwicklung", items:[
{t:"Ein Planet – mehrere Welten", i:["Auf derselben Erde leben Menschen in Wohlstand und andere in großer Armut. Die Geographie fragt, wie man diese Unterschiede beschreiben kann und wo sie auftreten.","Das ist der Einstieg ins Thema Entwicklung. Unten lernst du die wichtigsten Begriffe und Einteilungen."], s:`Begriffe
• Industrieländer, Schwellenländer, Entwicklungsländer
• Least Developed Countries (LDC): am wenigsten entwickelte Länder
• Globaler Norden und Globaler Süden: politisch neutralere Begriffe statt „Erste/Dritte Welt“
• Einteilung der Weltbank nach Pro-Kopf-Einkommen: niedrig, untere und obere mittlere, hohe Einkommen

Disparitäten
• Räumliche Unterschiede im Entwicklungsstand
• Global: zwischen Staaten
• Regional: innerhalb eines Landes (z.B. Stadt-Land, Küste-Binnenland)
• Sozial: zwischen Bevölkerungsgruppen

Historisch
• Brandt-Linie (1980): einfache Nord-Süd-Trennung – heute zu grob, weil viele Länder (z.B. Schwellenländer) dazwischen liegen

Fallstricke
• Begriffe wie „Entwicklungsland“ sind wertend und vereinfachend – in Klausuren kritisch reflektieren`, k:[
{q:"Erkläre den Begriff Disparität mit je einem Beispiel auf globaler und regionaler Ebene.", a:"Disparität bezeichnet räumliche Unterschiede im Entwicklungsstand. Global: Unterschiede im Einkommen zwischen Deutschland und dem Tschad. Regional: Unterschiede zwischen den wohlhabenden Küstenregionen und dem ärmeren Binnenland Chinas."},
{q:"Warum gilt die Brandt-Linie heute als überholt?", a:"Sie teilt die Welt grob in einen reichen Norden und einen armen Süden. Viele Länder haben sich seitdem stark entwickelt (z.B. Schwellenländer in Asien), und es gibt große Unterschiede innerhalb der Gruppen."}]},

{t:"Entwicklungsmodelle", i:["Warum sind manche Länder arm und andere reich? Forscher haben dafür ganz unterschiedliche Erklärungen entwickelt – manche suchen die Gründe im Land selbst, andere in der Weltwirtschaft.","Mit diesen Modellen kannst du Entwicklungsprobleme strukturiert erklären. Unten lernst du die wichtigsten kennen."], s:`Modernisierungstheorie
• Ursachen der Unterentwicklung liegen im Land selbst (endogen): traditionelle Strukturen, fehlendes Kapital, geringe Bildung
• Entwicklung als Nachholen des Weges der Industrieländer
• Rostow: Stufenmodell des Wirtschaftswachstums (von der traditionellen Gesellschaft bis zum Massenkonsum)

Dependenztheorie
• Ursachen liegen außerhalb (exogen): Abhängigkeit vom Weltmarkt und von den Industrieländern
• Zentrum-Peripherie-Modell: Die Peripherie liefert Rohstoffe und billige Arbeit, das Zentrum profitiert
• Folge historisch aus dem Kolonialismus

Teufelskreis der Armut
• Geringes Einkommen → geringe Ersparnisse → wenig Investitionen → geringe Produktivität → geringes Einkommen
• Ähnliche Kreisläufe mit Gesundheit und Bildung

Weitere Ansätze
• Grundbedürfnisorientierung, nachhaltige Entwicklung (siehe Entwicklungsstrategien)

Fallstricke
• Keine Theorie erklärt alles: In Klausuren endogene und exogene Ursachen kombinieren`, k:[
{q:"Vergleiche Modernisierungs- und Dependenztheorie.", a:"Die Modernisierungstheorie sieht die Ursachen von Unterentwicklung im Land selbst und empfiehlt, den Weg der Industrieländer nachzuholen. Die Dependenztheorie sieht die Ursachen in der Abhängigkeit vom Weltmarkt und den Industrieländern, besonders als Folge des Kolonialismus."},
{q:"Erkläre den Teufelskreis der Armut.", a:"Wer wenig verdient, kann kaum sparen. Ohne Ersparnisse fehlen Investitionen in Bildung, Maschinen oder Infrastruktur. Dadurch bleibt die Produktivität gering, und das Einkommen bleibt niedrig – der Kreis schließt sich."}]},

{t:"Entwicklungsindikatoren", i:["Wie misst man, ob ein Land „entwickelt“ ist? Nur das Einkommen anzuschauen reicht nicht – Gesundheit, Bildung und Gerechtigkeit gehören auch dazu. Dafür gibt es Kennzahlen, sogenannte Indikatoren.","Indikatoren auswerten und kritisch bewerten ist eine typische Abi-Aufgabe. Unten lernst du die wichtigsten Kennzahlen und ihre Grenzen."], s:`Wirtschaftliche Indikatoren
• BIP bzw. BNE pro Kopf, oft in Kaufkraftparitäten (KKP), um Preisunterschiede auszugleichen
• Anteil der Sektoren an Beschäftigung und Wirtschaftsleistung

Soziale Indikatoren
• Lebenserwartung, Kindersterblichkeit
• Alphabetisierungsrate, Schulbesuchsdauer
• Zugang zu sauberem Wasser und Gesundheitsversorgung

Zusammengesetzte Indizes
• Human Development Index (HDI): Lebenserwartung, Bildung (Schuljahre), Einkommen (BNE pro Kopf in KKP); Werte zwischen 0 und 1
• Gini-Koeffizient: Einkommensverteilung (0 = völlig gleich, 1 = völlig ungleich)
• Multidimensionaler Armutsindex (MPI): Armut in Gesundheit, Bildung und Lebensstandard

Kritik
• Durchschnittswerte verbergen Ungleichheit
• Informeller Sektor und Subsistenzwirtschaft werden kaum erfasst
• Umweltaspekte fehlen oft (Ergänzung z.B. durch den ökologischen Fußabdruck)

Fallstricke
• Ein Indikator allein reicht nie zur Bewertung – immer mehrere kombinieren`, k:[
{q:"Erkläre, warum das BIP pro Kopf allein kein guter Entwicklungsindikator ist.", a:"Es ist ein Durchschnittswert und sagt nichts über die Verteilung des Wohlstands aus. Gesundheit, Bildung und Lebensqualität werden nicht erfasst, ebenso wenig der informelle Sektor oder Umweltschäden."},
{q:"Nenne die drei Bereiche des HDI.", a:"Gesundheit (Lebenserwartung), Bildung (Schuljahre) und Lebensstandard (BNE pro Kopf in Kaufkraftparitäten)."}]},

{t:"Ursachen für Entwicklungsrückstände", i:["Armut hat fast nie nur eine Ursache. Klima, Geschichte, Politik und Weltwirtschaft greifen ineinander – und oft verstärken sich die Probleme gegenseitig.","Ursachen strukturiert zu erklären, ist eine der häufigsten Abi-Aufgaben in diesem Bereich. Unten lernst du interne und externe Ursachen."], s:`Endogene (interne) Ursachen
• Naturräumlich: extremes Klima, Dürren, Naturkatastrophen, Binnenlage ohne Meerzugang
• Politisch: Korruption, schwache Institutionen (Bad Governance), Kriege und Konflikte
• Gesellschaftlich: hohes Bevölkerungswachstum, geringe Bildung, Benachteiligung von Frauen
• Wirtschaftlich: Abhängigkeit von wenigen Produkten, fehlende Infrastruktur

Exogene (externe) Ursachen
• Kolonialismus: willkürliche Grenzen, auf Rohstoffexport ausgerichtete Wirtschaft
• Terms of Trade: Rohstoffpreise schwanken stark und steigen oft langsamer als Preise für Industriegüter
• Verschuldung und Zinslast
• Handelsbarrieren und Agrarsubventionen der Industrieländer

Rohstofffluch
• Reiche Rohstoffvorkommen führen oft nicht zu Wohlstand, sondern zu Korruption, Konflikten und einseitiger Wirtschaft

Fallstricke
• Naturraum erklärt Armut nie allein – viele Länder mit schwierigen Bedingungen haben sich entwickelt`, k:[
{q:"Erkläre den Begriff Terms of Trade und seine Bedeutung für rohstoffexportierende Länder.", a:"Terms of Trade beschreiben das Austauschverhältnis zwischen Export- und Importpreisen. Sinken die Preise der exportierten Rohstoffe im Verhältnis zu den importierten Industriegütern, muss ein Land mehr exportieren, um gleich viel importieren zu können – das hemmt die Entwicklung."},
{q:"Was versteht man unter dem Rohstofffluch?", a:"Länder mit reichen Rohstoffvorkommen entwickeln sich oft schlechter als erwartet, weil die Einnahmen Korruption und Konflikte fördern, andere Wirtschaftszweige vernachlässigt werden und die Abhängigkeit von schwankenden Weltmarktpreisen groß ist."}]},

{t:"Entwicklungsstrategien", i:["Wie kann ein armes Land sich entwickeln? Im Lauf der Zeit wurden viele Wege ausprobiert – von großen Industrieprojekten bis zu kleinen Krediten für einzelne Familien.","Strategien beurteilen ist typisch für Abi-Aufgaben. Unten lernst du die wichtigsten Ansätze und ihre Vor- und Nachteile."], s:`Wirtschaftliche Strategien
• Importsubstitution: eigene Industrie aufbauen, Importe durch Zölle ersetzen
• Exportorientierung: Industrie für den Weltmarkt, z.B. die asiatischen „Tigerstaaten“
• Integration in den Weltmarkt vs. Schutz der eigenen Wirtschaft

Menschenorientierte Ansätze
• Grundbedürfnisstrategie: Nahrung, Wasser, Gesundheit, Bildung, Wohnen zuerst
• Hilfe zur Selbsthilfe, Förderung von Frauen
• Mikrokredite: kleine Kredite für Kleinunternehmer ohne Sicherheiten (Muhammad Yunus, Grameen Bank)

Nachhaltige Entwicklung
• Wirtschaft, Soziales und Ökologie im Einklang
• Agenda 2030 mit 17 Zielen für nachhaltige Entwicklung (SDGs), 2015 von den Vereinten Nationen beschlossen

Instrumente
• Entwicklungszusammenarbeit (Ziel: 0,7 % des Bruttonationaleinkommens der Geberländer)
• Fairer Handel, Schuldenerlass, Technologietransfer

Bewertung
• Großprojekte (Top-down) erreichen oft nicht die Ärmsten
• Kleine, lokale Projekte (Bottom-up) sind näher an den Menschen, wirken aber begrenzt

Fallstricke
• Strategien immer bewerten: Für wen wirken sie, mit welchen Nebenwirkungen?`, k:[
{q:"Vergleiche Importsubstitution und Exportorientierung.", a:"Importsubstitution schützt die eigene Industrie durch Zölle und ersetzt Importe durch eigene Produkte, kann aber zu ineffizienten Betrieben führen. Exportorientierung produziert für den Weltmarkt, bringt Devisen und Wachstum, macht aber abhängig von der Weltwirtschaft."},
{q:"Bewerte Mikrokredite als Entwicklungsstrategie.", a:"Vorteile: Menschen ohne Sicherheiten, oft Frauen, können sich selbstständig machen und ihr Einkommen steigern. Nachteile: Hohe Zinsen können zu Überschuldung führen, und Mikrokredite allein lösen strukturelle Probleme wie fehlende Infrastruktur nicht."}]}
]}
];
GEO.forEach(c=>c.items.forEach(it=>{ if(it.i) INTRO[it.t]=it.i; }));

const SPORT = [
{ch:"1 Trainingslehre", items:[
{t:"Was ist Trainingslehre? Grundbegriffe", i:["Warum wird man durch Training eigentlich besser? Die Trainingslehre erklärt, wie der Körper auf Belastung reagiert und wie man Training sinnvoll plant – vom Freizeitsportler bis zum Profi.","Die Grundbegriffe brauchst du in jeder Sporttheorie-Aufgabe. Unten lernst du, was Training, Belastung, Beanspruchung und Anpassung bedeuten."], s:`Training
• Planmäßiger, systematischer und zielgerichteter Prozess, um die sportliche Leistungsfähigkeit zu verbessern, zu erhalten oder gezielt zu verringern
• Bestandteile: Trainingsziel, Trainingsinhalt (Übungen), Trainingsmethode, Trainingsmittel (Geräte, Hilfen)

Leistung und Leistungsfähigkeit
• Sportliche Leistung: Ergebnis einer sportlichen Handlung
• Leistungsfähigkeit hängt ab von: Kondition (Kraft, Ausdauer, Schnelligkeit, Beweglichkeit), Koordination und Technik, Taktik, Psyche, Konstitution (Körperbau), äußeren Bedingungen

Belastung und Beanspruchung
• Belastung: von außen gesetzte Anforderung (z.B. 5 × 400 m in 80 s)
• Beanspruchung: individuelle Reaktion des Körpers darauf (z.B. Herzfrequenz, Laktat)
• Gleiche Belastung → unterschiedliche Beanspruchung bei verschiedenen Personen

Anpassung (Adaptation)
• Der Körper strebt ein Gleichgewicht an (Homöostase)
• Ausreichend starke Reize stören das Gleichgewicht, der Körper passt sich an und wird leistungsfähiger
• Ohne Reiz bilden sich Anpassungen wieder zurück

Fallstricke
• Belastung und Beanspruchung nicht verwechseln – in Klausuren ein Klassiker`, k:[
{q:"Unterscheide Belastung und Beanspruchung an einem Beispiel.", a:"Belastung ist die äußere Anforderung, z.B. 20 Minuten Laufen mit 10 km/h. Beanspruchung ist die individuelle Reaktion: Ein trainierter Läufer hat dabei vielleicht 140 Schläge pro Minute, ein Untrainierter 175."},
{q:"Nenne fünf Komponenten der sportlichen Leistungsfähigkeit.", a:"Kondition (konditionelle Fähigkeiten), Koordination und Technik, Taktik, psychische Faktoren (z.B. Motivation, Konzentration) und Konstitution (Körperbau)."}]},

{t:"Belastung und Reiz: Belastungsnormative", i:["Training wirkt nur, wenn der Reiz passt – nicht zu schwach, nicht zu stark. Mit den Belastungsnormativen beschreibst du jede Trainingseinheit genau: wie stark, wie lange, wie oft und mit welchen Pausen.","Diese Begriffe brauchst du, um Trainingsmethoden zu beschreiben und Trainingspläne zu erstellen. Unten lernst du sie und die Reizstufenregel."], s:`Belastungsnormative
• Reizintensität: Stärke des Reizes, z.B. % der Maximalleistung, Geschwindigkeit, Herzfrequenz
• Reizdauer: Dauer eines einzelnen Reizes bzw. einer Serie
• Reizdichte: Verhältnis von Belastung und Pause
• Reizumfang: Gesamtmenge der Reize einer Einheit (z.B. km, Wiederholungen × Sätze)
• Trainingshäufigkeit: Zahl der Trainingseinheiten pro Woche

Reizstufenregel (nach Roux)
• Unterschwellige Reize: keine Wirkung
• Schwach überschwellige Reize: erhalten das Funktionsniveau
• Stark überschwellige Reize: lösen Anpassungen aus (optimal)
• Zu starke Reize: schädigen

Zusammenhang
• Intensität und Umfang verhalten sich meist umgekehrt: hohe Intensität → geringer Umfang

Beispiel
• Intervalltraining 6 × 400 m in 80 s, 90 s Trabpause: Intensität = Tempo, Reizdauer = 80 s, Reizdichte = 80 s Belastung zu 90 s Pause, Umfang = 2.400 m

Fallstricke
• Reizdichte ist kein „Wie oft pro Woche“ – das ist die Trainingshäufigkeit`, k:[
{q:"Bestimme alle Belastungsnormative: 3 Sätze à 10 Kniebeugen mit 60 kg (ca. 75 % des Maximums), 2 Minuten Satzpause, 3-mal pro Woche.", a:"Intensität: 60 kg bzw. ca. 75 % des Maximums. Reizdauer: Dauer eines Satzes (10 Wiederholungen). Reizdichte: Satz zu 2 Minuten Pause. Umfang: 3 × 10 = 30 Wiederholungen. Häufigkeit: 3 Einheiten pro Woche."},
{q:"Erkläre die Reizstufenregel.", a:"Ein Trainingsreiz muss eine bestimmte Schwelle überschreiten, um zu wirken. Unterschwellige Reize bewirken nichts, schwach überschwellige erhalten das Niveau, stark überschwellige lösen Anpassungen aus, und zu starke Reize schaden dem Körper."}]},

{t:"Trainingsprinzipien", i:["Trainingsprinzipien sind so etwas wie die Spielregeln für gutes Training. Wer sie beachtet, wird stetig besser – wer sie ignoriert, stagniert oder verletzt sich.","Im Abi sollst du Prinzipien nennen, erklären und auf Trainingspläne anwenden. Unten lernst du die wichtigsten."], s:`Prinzipien zur Auslösung von Anpassungen
• Prinzip des trainingswirksamen Reizes: Reiz muss eine Schwelle überschreiten
• Prinzip der progressiven Belastungssteigerung: Belastung allmählich oder sprunghaft erhöhen, weil sich der Körper anpasst
• Prinzip der Variation der Trainingsbelastung: Abwechslung verhindert Stagnation

Prinzipien zur Sicherung der Anpassung
• Prinzip der optimalen Relation von Belastung und Erholung (Superkompensation nutzen)
• Prinzip der Kontinuität: regelmäßig trainieren, sonst gehen Anpassungen verloren
• Prinzip der Periodisierung und Zyklisierung: Belastungsphasen planmäßig wechseln

Prinzipien der Spezifik
• Prinzip der Individualität und Altersgemäßheit
• Prinzip der zunehmenden Spezialisierung: vom allgemeinen zum sportartspezifischen Training
• Prinzip der regulierenden Wechselwirkung (z.B. Kraft und Ausdauer beeinflussen sich)

Fallstricke
• Prinzipien immer konkret auf das Beispiel anwenden, nicht nur auflisten`, k:[
{q:"Erkläre das Prinzip der progressiven Belastungssteigerung.", a:"Da sich der Körper an eine Belastung anpasst, wirkt der gleiche Reiz mit der Zeit nur noch erhaltend. Die Belastung muss deshalb schrittweise (z.B. mehr Umfang, dann mehr Intensität) oder in Sprüngen gesteigert werden, damit weitere Anpassungen entstehen."},
{q:"Ein Sportler trainiert nur in den Sommerferien intensiv, danach gar nicht. Gegen welches Prinzip verstößt er?", a:"Gegen das Prinzip der Kontinuität: Ohne regelmäßige Reize bilden sich die Anpassungen wieder zurück."}]},

{t:"Ermüdung, Erholung und Superkompensation", i:["Nach einem harten Training bist du erst einmal schlapper als vorher. Erst in der Erholung baut der Körper auf – und zwar etwas über das alte Niveau hinaus. Genau das ist das Geheimnis des Trainingseffekts.","Das Modell der Superkompensation ist eines der wichtigsten der Trainingslehre. Unten lernst du, wie es funktioniert und was beim Timing passiert."], s:`Superkompensation
• 1. Belastung: Energiespeicher werden geleert, Strukturen belastet
• 2. Ermüdung: Leistungsfähigkeit sinkt unter das Ausgangsniveau
• 3. Erholung: Wiederherstellung der Speicher und Strukturen
• 4. Superkompensation: Der Körper baut kurzzeitig über das Ausgangsniveau hinaus
• 5. Ohne neuen Reiz sinkt das Niveau wieder auf den Ausgangswert

Timing des nächsten Reizes
• Im Bereich der Superkompensation: Leistung steigt langfristig
• Zu früh (noch in der Ermüdung): Leistung sinkt, Gefahr von Übertraining
• Zu spät: kein dauerhafter Effekt

Ermüdung
• Physisch (z.B. leere Glykogenspeicher, Übersäuerung) und psychisch
• Peripher (im Muskel) und zentral (im Nervensystem)

Erholung
• Passiv (Schlaf, Ruhe) und aktiv (lockeres Auslaufen, Regenerationstraining)
• Unterschiedlich schnell: Phosphatspeicher in Minuten, Glykogen in Stunden bis Tagen, Strukturen wie Muskeln und Sehnen länger
• Unterstützt durch Ernährung, Flüssigkeit und Schlaf

Fallstricke
• Das Modell ist eine Vereinfachung – verschiedene Systeme erholen sich unterschiedlich schnell`, k:[
{q:"Erkläre, was passiert, wenn die nächste Belastung zu früh gesetzt wird.", a:"Der Körper ist noch in der Ermüdungsphase, die Leistungsfähigkeit liegt unter dem Ausgangsniveau. Ein neuer Reiz senkt sie weiter. Wiederholt sich das, sinkt die Leistung langfristig, und es droht Übertraining."},
{q:"Nenne zwei Maßnahmen zur Förderung der Erholung.", a:"Aktive Erholung wie lockeres Auslaufen zum schnelleren Abbau von Stoffwechselprodukten sowie ausreichender Schlaf mit kohlenhydrat- und eiweißreicher Ernährung zum Auffüllen der Speicher."}]},

{t:"Trainingsplanung und Periodisierung", i:["Kein Sportler kann das ganze Jahr in Topform sein. Deshalb wird das Training in Phasen eingeteilt: erst Grundlagen aufbauen, dann zuspitzen, dann im Wettkampf abrufen und schließlich erholen.","Trainingsplanung verbindet alle anderen Themen der Trainingslehre. Unten lernst du Zyklen, Perioden und den Regelkreis der Planung."], s:`Zyklen
• Makrozyklus: z.B. Trainingsjahr
• Mesozyklus: mehrere Wochen mit gleichem Schwerpunkt
• Mikrozyklus: meist eine Woche
• Trainingseinheit: einzelnes Training (Aufwärmen, Hauptteil, Abwärmen)

Perioden eines Jahres
• Vorbereitungsperiode: zuerst allgemeine Grundlagen mit hohem Umfang, dann speziellere Inhalte mit steigender Intensität
• Wettkampfperiode: hohe Intensität, geringerer Umfang, Leistung abrufen
• Übergangsperiode: aktive Erholung
• Einfach- oder Doppelperiodisierung (ein oder zwei Saisonhöhepunkte)

Regelkreis der Trainingsplanung
• Leistungsdiagnose (Ist-Zustand)
• Zielsetzung (Soll-Zustand)
• Planung (Inhalte, Methoden, Belastung)
• Durchführung
• Kontrolle und Auswertung → Anpassung des Plans

Fallstricke
• Umfang und Intensität verlaufen über die Saison gegenläufig`, k:[
{q:"Beschreibe den Verlauf von Umfang und Intensität über ein Trainingsjahr.", a:"In der Vorbereitungsperiode ist der Umfang hoch und die Intensität eher niedrig. Zur Wettkampfperiode hin sinkt der Umfang, die Intensität steigt. In der Übergangsperiode sinken beide zur aktiven Erholung."},
{q:"Erkläre den Regelkreis der Trainingsplanung.", a:"Ausgehend von einer Leistungsdiagnose wird ein Ziel festgelegt und das Training geplant und durchgeführt. Eine Kontrolle zeigt, ob das Ziel erreicht wurde. Die Ergebnisse fließen in die nächste Planung ein – so entsteht ein Kreislauf."}]}
]},

{ch:"2 Bewegungslehre: Körper und Organsysteme", items:[
{t:"Zelle, Gewebe und Organsysteme", i:["Alles im Körper ist aus Zellen aufgebaut. Gleichartige Zellen bilden Gewebe, Gewebe bilden Organe, und Organe arbeiten in Systemen zusammen – vom Herz-Kreislauf bis zum Bewegungsapparat.","Diese Grundlage brauchst du, um Training biologisch zu erklären. Unten lernst du Zellbestandteile, Gewebearten und Organsysteme."], s:`Zelle
• Zellmembran: Abgrenzung und Stoffaustausch
• Zellkern: Erbinformation, Steuerung
• Mitochondrien: „Kraftwerke“, aerobe Energiegewinnung (ATP)
• Ribosomen und endoplasmatisches Retikulum: Eiweißherstellung

Gewebearten
• Epithelgewebe: Haut, Schleimhäute
• Binde- und Stützgewebe: Knochen, Knorpel, Sehnen, Bänder
• Muskelgewebe: Skelettmuskulatur, glatte Muskulatur, Herzmuskulatur
• Nervengewebe: Reizleitung

Organsysteme im Sport
• Bewegungsapparat (passiv: Knochen, Gelenke, Bänder; aktiv: Muskeln, Sehnen)
• Herz-Kreislauf-System, Atmungssystem, Nervensystem, Stoffwechsel und Hormonsystem

Bedeutung fürs Training
• Ausdauertraining erhöht z.B. Zahl und Größe der Mitochondrien

Fallstricke
• Ebenen sauber trennen: Zelle → Gewebe → Organ → Organsystem`, k:[
{q:"Erkläre die Bedeutung der Mitochondrien für Ausdauersportler.", a:"In den Mitochondrien wird Energie aerob, also mit Sauerstoff, aus Kohlenhydraten und Fetten gewonnen. Ausdauertraining vergrößert ihre Zahl und Oberfläche, sodass mehr Energie aerob bereitgestellt werden kann."},
{q:"Ordne zu: Knochen, Herz, Haut, Rückenmark.", a:"Knochen: Binde- und Stützgewebe. Herz: Herzmuskelgewebe. Haut: Epithelgewebe (oberste Schicht). Rückenmark: Nervengewebe."}]},

{t:"Knochen, Knorpel, Bänder, Sehnen und Gelenke", i:["Ohne Skelett würdest du zusammensacken – Knochen geben Halt, Gelenke ermöglichen Bewegung, und Bänder und Sehnen halten alles zusammen. Zusammen bilden sie den passiven Bewegungsapparat.","Sportverletzungen und Trainingsanpassungen betreffen oft genau diese Strukturen. Unten lernst du Aufbau und Funktion."], s:`Knochen
• Röhrenknochen: Schaft (Diaphyse), Enden (Epiphysen), außen feste Kompakta, innen schwammartige Spongiosa, Knochenmark, Knochenhaut (Periost)
• Knochen passen sich der Belastung an: Druck und Zug machen sie dichter und stabiler

Knorpel
• Hyaliner Knorpel: überzieht Gelenkflächen
• Faserknorpel: Menisken, Bandscheiben
• Nicht durchblutet: Ernährung über Gelenkflüssigkeit – Bewegung ist dafür wichtig

Sehnen und Bänder
• Sehnen verbinden Muskel und Knochen und übertragen die Muskelkraft
• Bänder verbinden Knochen mit Knochen und stabilisieren Gelenke
• Passen sich langsamer an als Muskeln → Verletzungsgefahr bei zu schneller Steigerung

Echte Gelenke
• Gelenkkopf und Gelenkpfanne mit Knorpel, Gelenkkapsel, Gelenkspalt mit Gelenkflüssigkeit (Synovia)
• Gelenkarten: Kugelgelenk (Schulter, Hüfte), Scharniergelenk (Ellenbogen-Oberarm), Sattelgelenk (Daumen), Eigelenk (Handgelenk), Rad- bzw. Zapfengelenk, flaches Gelenk
• Unechte Gelenke (Fugen): z.B. Bandscheiben zwischen Wirbeln

Fallstricke
• Sehne und Band nicht verwechseln`, k:[
{q:"Erkläre, warum Sehnen und Bänder bei schneller Trainingssteigerung besonders gefährdet sind.", a:"Sie sind schwächer durchblutet und haben einen langsameren Stoffwechsel als Muskeln. Muskeln werden deshalb schneller stärker, während Sehnen und Bänder hinterherhinken. Die Kraft der Muskeln kann sie dann überlasten."},
{q:"Beschreibe den Aufbau eines echten Gelenks.", a:"Zwei Knochenenden – Gelenkkopf und Gelenkpfanne – sind mit Knorpel überzogen. Eine Gelenkkapsel umschließt den Gelenkspalt, der mit Gelenkflüssigkeit gefüllt ist. Bänder stabilisieren das Gelenk."}]},

{t:"Muskulatur", i:["Muskeln sind die Motoren des Körpers. Sie können sich nur zusammenziehen, nicht strecken – deshalb arbeiten sie immer im Team mit einem Gegenspieler.","Muskelaufbau, Fasertypen und Kontraktionsformen erklären, warum Training wirkt. Unten lernst du alles Wichtige."], s:`Aufbau
• Muskel → Muskelfaserbündel → Muskelfaser (Muskelzelle) → Myofibrillen → Sarkomere
• Im Sarkomer liegen die Eiweißfäden Aktin und Myosin

Kontraktion (Gleitfilamenttheorie)
• Nervenimpuls → Calcium wird freigesetzt → Myosinköpfchen binden an Aktin und ziehen es heran
• Die Fäden gleiten ineinander, der Muskel verkürzt sich
• Energie liefert ATP

Fasertypen
• Typ I (langsam, „slow twitch“, rot): ausdauernd, viele Mitochondrien, ermüden langsam
• Typ II (schnell, „fast twitch“, weiß): schnell- und maximalkräftig, ermüden schnell
• Verteilung ist überwiegend genetisch, Training verändert sie nur begrenzt

Arbeitsweisen
• Konzentrisch: Muskel verkürzt sich (überwindend)
• Exzentrisch: Muskel verlängert sich unter Spannung (nachgebend, z.B. Landung)
• Isometrisch: Spannung ohne Längenänderung (haltend)

Zusammenspiel
• Agonist (Spieler) und Antagonist (Gegenspieler), z.B. Bizeps und Trizeps
• Synergisten unterstützen die Bewegung

Fallstricke
• Muskeln „drücken“ nie – sie ziehen nur`, k:[
{q:"Erkläre die Gleitfilamenttheorie in eigenen Worten.", a:"Ein Nervensignal löst die Freisetzung von Calcium aus. Dadurch können die Myosinköpfchen an die Aktinfäden binden und sie unter ATP-Verbrauch heranziehen. Die Fäden gleiten ineinander, das Sarkomer und damit der Muskel verkürzen sich."},
{q:"Ordne die Arbeitsweise zu: a) Hochdrücken beim Bankdrücken, b) langsames Absenken der Hantel, c) Halten im Unterarmstütz.", a:"a) konzentrisch, b) exzentrisch, c) isometrisch."}]},

{t:"Energiebereitstellung", i:["Jede Bewegung braucht Energie, und der Körper hat dafür mehrere „Tanks“: einen kleinen für explosive Sekunden, einen für kurze, harte Belastungen und einen großen für lange Ausdauer. Je nach Sportart wird ein anderer Tank vorrangig genutzt.","Die Energiebereitstellung erklärt, warum ein Sprinter anders trainiert als ein Marathonläufer. Unten lernst du die vier Wege und ihre Eigenschaften."], s:`ATP
• Adenosintriphosphat ist die einzige direkte Energiequelle des Muskels
• Der Vorrat reicht nur für wenige Sekunden und muss ständig neu gebildet werden

Die Wege der Energiebereitstellung
• Anaerob-alaktazid (Kreatinphosphat): sehr schnell verfügbar, reicht für Maximalbelastungen von etwa 6–10 Sekunden, z.B. Sprint, Sprung
• Anaerob-laktazid (anaerobe Glykolyse): Abbau von Glukose ohne Sauerstoff, Laktat entsteht, Übersäuerung; dominiert bei intensiven Belastungen von etwa 10 Sekunden bis 2 Minuten, z.B. 400-m-Lauf
• Aerob-glykolytisch: Abbau von Kohlenhydraten mit Sauerstoff in den Mitochondrien, viel Energie, aber langsamer
• Aerob-lipolytisch: Abbau von Fetten mit Sauerstoff, fast unbegrenzter Vorrat, langsamste Energiebereitstellung, bei langen, eher ruhigen Belastungen

Wichtig
• Alle Systeme laufen gleichzeitig, aber mit unterschiedlichem Anteil – je nach Intensität und Dauer
• Faustregel: Je intensiver, desto anaerober; je länger, desto aerober
• Aerob-anaerobe Schwelle: oft bei ca. 4 mmol Laktat pro Liter Blut angesetzt

Fallstricke
• Laktat ist nicht der „Schuldige“ für Muskelkater – es wird nach der Belastung schnell abgebaut`, k:[
{q:"Ordne den Belastungen den vorrangigen Energieweg zu: 100-m-Sprint, 400-m-Lauf, Marathon.", a:"100-m-Sprint: anaerob-alaktazid (Kreatinphosphat). 400-m-Lauf: vor allem anaerob-laktazid. Marathon: aerob (Kohlenhydrate und zunehmend Fette)."},
{q:"Erkläre, warum ein 400-m-Läufer am Ende stark langsamer wird.", a:"Bei der hohen Intensität wird viel Energie anaerob-laktazid gewonnen. Dabei sammelt sich Laktat bzw. Säure im Muskel an, die Übersäuerung hemmt die Muskelarbeit und die Leistung sinkt."}]},

{t:"Atmung", i:["Mit jedem Atemzug holst du Sauerstoff in die Lunge, der über das Blut zu den Muskeln gelangt. Je mehr Sauerstoff dort ankommt, desto länger kannst du aerob, also ausdauernd, arbeiten.","Die Atmung ist eine wichtige Grundlage der Ausdauerleistung. Unten lernst du Aufbau, Gasaustausch und Anpassungen durch Training."], s:`Atemwege
• Nase bzw. Mund → Rachen → Kehlkopf → Luftröhre → Bronchien → Bronchiolen → Lungenbläschen (Alveolen)

Äußere und innere Atmung
• Äußere Atmung: Gasaustausch in der Lunge – Sauerstoff wandert durch Diffusion aus den Alveolen ins Blut, CO₂ in umgekehrter Richtung
• Innere Atmung (Zellatmung): Nutzung des Sauerstoffs in den Mitochondrien

Atemmechanik
• Einatmen aktiv: Zwerchfell und äußere Zwischenrippenmuskeln
• Ausatmen in Ruhe passiv, unter Belastung mit Hilfe der Atemhilfsmuskulatur

Kenngrößen
• Atemminutenvolumen = Atemfrequenz × Atemzugvolumen
• Vitalkapazität: maximale Luftmenge, die nach tiefster Einatmung ausgeatmet werden kann
• Maximale Sauerstoffaufnahme (VO₂max): wichtiges Maß der Ausdauerleistungsfähigkeit

Anpassungen durch Ausdauertraining
• Kräftigere Atemmuskulatur, ökonomischere Atmung (tiefer statt schneller)
• Höheres maximales Atemminutenvolumen, bessere Sauerstoffaufnahme

Fallstricke
• Der Gasaustausch geschieht durch Diffusion entlang des Konzentrationsgefälles, nicht durch „Pumpen“`, k:[
{q:"Berechne das Atemminutenvolumen bei 40 Atemzügen pro Minute mit je 2,5 l.", a:"Atemminutenvolumen = 40 × 2,5 l = 100 l pro Minute."},
{q:"Erkläre, warum eine tiefe Atmung ökonomischer ist als eine schnelle, flache.", a:"Bei jedem Atemzug bleibt ein Teil der Luft in den Atemwegen (Totraum) und erreicht die Alveolen nicht. Bei flacher Atmung ist dieser Anteil relativ groß. Tiefe Atemzüge bringen mehr frische Luft in die Alveolen und damit mehr Sauerstoff ins Blut."}]},

{t:"Herz-Kreislauf-System", i:["Das Herz ist eine Pumpe, die pro Minute mehrere Liter Blut durch den Körper schickt – unter Belastung noch viel mehr. Es versorgt die Muskeln mit Sauerstoff und Nährstoffen und transportiert Abfallstoffe ab.","Herz und Kreislauf passen sich durch Ausdauertraining besonders stark an. Unten lernst du Aufbau, Kreisläufe und Kenngrößen."], s:`Aufbau des Herzens
• Zwei Hälften mit je einem Vorhof und einer Kammer
• Herzklappen verhindern den Rückfluss
• Rechte Herzhälfte: sauerstoffarmes Blut; linke Herzhälfte: sauerstoffreiches Blut

Zwei Kreisläufe
• Lungenkreislauf: rechte Kammer → Lungenarterie → Lunge (Sauerstoffaufnahme) → Lungenvenen → linker Vorhof
• Körperkreislauf: linke Kammer → Aorta → Körper (Organe, Muskeln) → Hohlvenen → rechter Vorhof

Kenngrößen
• Herzminutenvolumen = Schlagvolumen × Herzfrequenz (in Ruhe ca. 5 l/min)
• Ruheherzfrequenz bei Untrainierten oft 60–80/min, bei Ausdauertrainierten deutlich niedriger
• Maximale Herzfrequenz, grobe Faustformel: 220 minus Lebensalter

Anpassungen durch Ausdauertraining
• Sportherz: Vergrößerung des Herzens, größeres Schlagvolumen
• Niedrigere Ruheherzfrequenz, schnellere Erholung
• Mehr Kapillaren im Muskel (Kapillarisierung)

Fallstricke
• Arterien führen vom Herzen weg, Venen zum Herzen – unabhängig vom Sauerstoffgehalt`, k:[
{q:"Berechne das Herzminutenvolumen bei 70 ml Schlagvolumen und 70 Schlägen pro Minute.", a:"70 ml × 70/min = 4.900 ml/min ≈ 4,9 l/min."},
{q:"Erkläre, warum Ausdauertrainierte eine niedrigere Ruheherzfrequenz haben.", a:"Durch Training wird das Herz größer und kräftiger, das Schlagvolumen steigt. Für dasselbe Herzminutenvolumen in Ruhe sind deshalb weniger Schläge nötig."}]},

{t:"Blut und Blutgefäße", i:["Blut ist das Transportsystem des Körpers: Es bringt Sauerstoff zu den Muskeln, holt Kohlendioxid ab, verteilt Wärme und wehrt Krankheitserreger ab. Die Gefäße sind die Straßen dafür.","Für Ausdauerleistung ist entscheidend, wie gut das Blut Sauerstoff transportiert. Unten lernst du Bestandteile, Gefäße und Anpassungen."], s:`Bestandteile des Blutes
• Blutplasma (gut die Hälfte): Wasser, Nährstoffe, Hormone, Salze
• Rote Blutkörperchen (Erythrozyten): transportieren Sauerstoff mit Hilfe des Hämoglobins
• Weiße Blutkörperchen (Leukozyten): Immunabwehr
• Blutplättchen (Thrombozyten): Blutgerinnung

Aufgaben
• Transport (Sauerstoff, CO₂, Nährstoffe, Hormone), Wärmeregulation, Abwehr, Pufferung von Säuren

Blutgefäße
• Arterien: führen vom Herzen weg, dicke, elastische Wand, hoher Druck
• Venen: führen zum Herzen, dünnere Wand, Venenklappen; der Rückfluss wird durch die Muskelpumpe unterstützt
• Kapillaren: feinste Gefäße, hier findet der Stoffaustausch mit dem Gewebe statt

Anpassungen
• Ausdauertraining: mehr Blutvolumen, mehr Kapillaren
• Höhentraining: mehr rote Blutkörperchen durch Sauerstoffmangel in der Höhe

Fallstricke
• Hämoglobin ist kein Blutbestandteil für sich, sondern der Farbstoff in den roten Blutkörperchen`, k:[
{q:"Erkläre die Wirkung von Höhentraining auf das Blut.", a:"In der Höhe ist der Sauerstoffpartialdruck geringer. Der Körper reagiert mit vermehrter Bildung roter Blutkörperchen (über das Hormon EPO). Dadurch kann das Blut mehr Sauerstoff transportieren, was später die Ausdauerleistung verbessert."},
{q:"Erkläre die Funktion der Muskelpumpe.", a:"Venen liegen zwischen Muskeln. Ziehen sich die Muskeln zusammen, drücken sie die Venen zusammen. Die Venenklappen lassen das Blut nur in Richtung Herz fließen, sodass der Rückfluss unterstützt wird."}]},

{t:"Ausdauer", i:["Ausdauer heißt, eine Belastung lange durchhalten und sich schnell erholen zu können – ob beim Marathon, im Fußballspiel oder einfach im Alltag. Sie ist die Grundlage für fast jede Sportart.","Ausdauerarten und Trainingsmethoden sind ein Kernthema im Sportabi. Unten lernst du Einteilung, Methoden und Anpassungen."], s:`Definition
• Fähigkeit, einer Belastung möglichst lange zu widerstehen (Ermüdungswiderstandsfähigkeit) und sich schnell zu erholen

Einteilung
• Nach Muskelmasse: allgemeine (mehr als 1/6 bis 1/7 der Muskulatur) und lokale Ausdauer
• Nach Energiebereitstellung: aerobe und anaerobe Ausdauer
• Nach Dauer: Kurzzeitausdauer (ca. 35 s–2 min), Mittelzeitausdauer (ca. 2–10 min), Langzeitausdauer (über 10 min)
• Grundlagenausdauer vs. spezielle Ausdauer der Sportart

Trainingsmethoden
• Dauermethode: kontinuierlich gleichmäßig, Wechselmethode (Tempowechsel), Fahrtspiel (spielerische Tempowechsel im Gelände)
• Intervallmethode: Wechsel von Belastung und „lohnender Pause“ (unvollständige Erholung); extensiv (mittlere Intensität, viele Wiederholungen) oder intensiv (hohe Intensität, weniger Wiederholungen)
• Wiederholungsmethode: hohe Intensität, vollständige Pausen
• Wettkampfmethode: Belastung unter Wettkampfbedingungen

Anpassungen
• Herz: größeres Schlagvolumen; Muskel: mehr Mitochondrien und Kapillaren; Blut: mehr Volumen
• Bessere Fettverbrennung, höhere VO₂max

Fallstricke
• „Lohnende Pause“ bedeutet: die Pause endet, bevor man vollständig erholt ist (ca. bei 120–130 Schlägen pro Minute)`, k:[
{q:"Vergleiche extensive und intensive Intervallmethode.", a:"Extensiv: mittlere Intensität, viele Wiederholungen, kürzere Pausen, Ziel v.a. aerobe Ausdauer. Intensiv: hohe Intensität, weniger Wiederholungen, etwas längere lohnende Pausen, Ziel v.a. anaerobe Ausdauer und Tempohärte."},
{q:"Nenne drei Anpassungen durch Ausdauertraining.", a:"Größeres Schlagvolumen des Herzens mit niedrigerer Ruheherzfrequenz, mehr Mitochondrien und Kapillaren im Muskel sowie eine höhere maximale Sauerstoffaufnahme."}]},

{t:"Kraft und Kraftarten", i:["Kraft ist mehr als dicke Muskeln: Ein Gewichtheber braucht Maximalkraft, ein Sprinter Schnellkraft, ein Ruderer Kraftausdauer. Jede Kraftart wird anders trainiert.","Kraftarten und -methoden sind fester Bestandteil des Sportabis. Unten lernst du die Arten, die Faktoren und die passenden Trainingsmethoden."], s:`Kraftarten
• Maximalkraft: größtmögliche Kraft, die willkürlich gegen einen Widerstand entfaltet werden kann; Basis aller anderen Kraftarten
• Schnellkraft: einen Widerstand in kurzer Zeit möglichst schnell überwinden (mit Startkraft und Explosivkraft)
• Kraftausdauer: Ermüdungswiderstand bei länger andauernden Kraftleistungen
• Reaktivkraft: Kraft im Dehnungs-Verkürzungs-Zyklus, z.B. bei Sprüngen (erst exzentrisch, dann sofort konzentrisch)

Einflussfaktoren
• Muskelquerschnitt
• Intramuskuläre Koordination: wie viele Fasern eines Muskels gleichzeitig aktiviert werden
• Intermuskuläre Koordination: Zusammenspiel verschiedener Muskeln
• Fasertypenverteilung, Motivation, Technik

Trainingsmethoden (Richtwerte)
• Hypertrophiemethode (Muskelaufbau): ca. 70–85 % des Maximums, ca. 8–12 Wiederholungen, mehrere Sätze
• Methode zur Verbesserung der intramuskulären Koordination: ca. 90–100 %, 1–3 Wiederholungen, lange Pausen
• Kraftausdauermethode: ca. 30–60 %, viele Wiederholungen, kurze Pausen
• Schnellkraft: mittlere Lasten, explosive Ausführung; Reaktivkraft: Sprungtraining (Plyometrie)

Fallstricke
• Maximalkraft ist Grundlage für Schnellkraft – beides hängt zusammen`, k:[
{q:"Ordne die Kraftart zu: Kugelstoßen, 2.000 m Rudern, Gewichtheben, Weitsprung-Absprung.", a:"Kugelstoßen: Schnellkraft. 2.000 m Rudern: Kraftausdauer. Gewichtheben: Maximalkraft (mit Schnellkraft). Weitsprung-Absprung: Reaktivkraft (Dehnungs-Verkürzungs-Zyklus)."},
{q:"Erkläre den Unterschied zwischen intra- und intermuskulärer Koordination.", a:"Intramuskulär: Zusammenspiel innerhalb eines Muskels, also wie viele motorische Einheiten gleichzeitig aktiviert werden. Intermuskulär: Zusammenspiel verschiedener Muskeln, z.B. Agonist und Antagonist bei einer Bewegung."}]}
]},

{ch:"13.1 Schnelligkeit, Nervensystem, Koordination", items:[
{t:"Schnelligkeit", i:["Wer reagiert beim Startschuss am schnellsten, wer zieht beim Fußball den schnellsten Antritt an? Schnelligkeit hängt stark davon ab, wie schnell Nerven und Muskeln zusammenarbeiten.","Schnelligkeit wird anders trainiert als Ausdauer oder Kraft. Unten lernst du ihre Formen, Einflussfaktoren und Trainingsregeln."], s:`Definition
• Fähigkeit, auf Reize schnellstmöglich zu reagieren und Bewegungen mit höchster Geschwindigkeit auszuführen

Formen
• Reaktionsschnelligkeit: schnell auf ein Signal reagieren (z.B. Startschuss)
• Aktionsschnelligkeit: einzelne Bewegung schnell ausführen (azyklisch, z.B. Wurf)
• Frequenzschnelligkeit: zyklische Bewegungen schnell wiederholen (z.B. Sprint)
• Beschleunigungsfähigkeit und Schnelligkeitsausdauer

Einflussfaktoren
• Nervensystem: Reizleitung und Steuerung
• Anteil schneller Muskelfasern (Typ II), überwiegend genetisch
• Kraft (besonders Schnellkraft), Technik, Beweglichkeit
• Ausgeruhtheit, Aufwärmen, Motivation

Trainingsregeln
• Maximale Intensität, nur kurze Belastung (wenige Sekunden)
• Vollständige Pausen
• Nur im ausgeruhten Zustand trainieren, am Anfang der Einheit
• Methoden: Wiederholungsmethode, Reaktionsspiele, Sprints aus verschiedenen Startpositionen

Fallstricke
• Schnelligkeit im ermüdeten Zustand zu trainieren, verbessert nicht die Schnelligkeit, sondern höchstens die Schnelligkeitsausdauer`, k:[
{q:"Begründe, warum Schnelligkeit zu Beginn einer Trainingseinheit trainiert wird.", a:"Schnelligkeitstraining erfordert maximale Intensität und ein frisches Nervensystem. Ermüdete Muskeln und Nerven arbeiten langsamer, sodass keine maximalen Geschwindigkeiten erreicht werden und der Trainingseffekt ausbleibt."},
{q:"Unterscheide Reaktions- und Aktionsschnelligkeit an Beispielen.", a:"Reaktionsschnelligkeit: Torwart reagiert auf einen Schuss. Aktionsschnelligkeit: Ausführung einer einzelnen schnellen Bewegung, z.B. Schlagwurf im Handball."}]},

{t:"Nervensystem", i:["Jede Bewegung beginnt im Kopf: Das Nervensystem nimmt Informationen auf, verarbeitet sie und schickt Befehle an die Muskeln – in Sekundenbruchteilen.","Das Nervensystem erklärt Schnelligkeit, Koordination und Reflexe. Unten lernst du Aufbau, Nervenzelle und motorische Einheit."], s:`Gliederung
• Zentrales Nervensystem (ZNS): Gehirn und Rückenmark
• Peripheres Nervensystem: Nerven außerhalb von Gehirn und Rückenmark
• Somatisches Nervensystem: willkürliche Bewegungen
• Vegetatives Nervensystem: unwillkürliche Steuerung; Sympathikus (Leistung, z.B. Puls hoch) und Parasympathikus (Erholung)

Nervenzelle (Neuron)
• Dendriten: nehmen Signale auf
• Zellkörper: verarbeitet
• Axon mit Myelinscheide: leitet Signale schnell weiter
• Synapse: Übertragung auf die nächste Zelle bzw. an der motorischen Endplatte auf den Muskel

Motorische Einheit
• Eine motorische Nervenzelle (Motoneuron) und alle von ihr versorgten Muskelfasern
• Feinmotorik: wenige Fasern pro Einheit; Grobmotorik: viele Fasern
• Rekrutierung: Je mehr Kraft nötig ist, desto mehr Einheiten werden aktiviert

Reflexe
• Eigenreflex: Reiz und Reaktion im selben Muskel (z.B. Kniesehnenreflex über die Muskelspindel)
• Fremdreflex: Reiz und Reaktion an verschiedenen Organen (z.B. Lidschlussreflex)

Fallstricke
• Reflexe laufen über das Rückenmark, ohne bewusste Steuerung durch das Gehirn`, k:[
{q:"Erkläre die Bedeutung der Myelinscheide für den Sport.", a:"Die Myelinscheide isoliert das Axon, sodass die Erregung sprunghaft und damit viel schneller weitergeleitet wird. Schnelle Reizleitung ist wichtig für Reaktions- und Aktionsschnelligkeit."},
{q:"Was ist eine motorische Einheit?", a:"Ein Motoneuron zusammen mit allen Muskelfasern, die es versorgt. Wird das Motoneuron erregt, ziehen sich alle zugehörigen Fasern gleichzeitig zusammen."}]},

{t:"Koordinative Fähigkeiten", i:["Koordination ist das, was eine Bewegung elegant und präzise macht: das Gleichgewicht halten, im richtigen Moment reagieren, Arme und Beine im Rhythmus bewegen. Gesteuert wird das durch das Zusammenspiel von Sinnesorganen, Nerven und Muskeln.","Koordinative Fähigkeiten und Analysatoren sind typische Abi-Begriffe. Unten lernst du sie und wie man sie trainiert."], s:`Die sieben koordinativen Fähigkeiten
• Differenzierungsfähigkeit: Bewegungen fein abstimmen (z.B. Kraftdosierung beim Pass)
• Kopplungsfähigkeit: Teilbewegungen verbinden (z.B. Dribbeln und Laufen)
• Reaktionsfähigkeit: schnell und zweckmäßig auf Signale reagieren
• Orientierungsfähigkeit: Lage und Bewegung im Raum bestimmen
• Gleichgewichtsfähigkeit: Gleichgewicht halten oder wiederherstellen
• Umstellungsfähigkeit: Bewegung an neue Situationen anpassen
• Rhythmisierungsfähigkeit: Rhythmus erfassen und umsetzen

Analysatoren (Informationsaufnahme)
• Optisch (Augen), akustisch (Ohren), taktil (Haut, Berührung)
• Kinästhetisch (Muskelspindeln, Sehnen- und Gelenkrezeptoren: Stellung und Spannung des Körpers)
• Vestibulär bzw. statico-dynamisch (Gleichgewichtsorgan im Innenohr)

Training
• Bewegungen variieren (Ausführung, Bedingungen, Geräte)
• Druckbedingungen erhöhen: Präzisions-, Zeit-, Komplexitäts-, Situations- und Belastungsdruck
• Am besten im ausgeruhten Zustand

Fallstricke
• Der kinästhetische Analysator ist der einzige, der Informationen über den eigenen Körper aus dem Inneren liefert`, k:[
{q:"Welche Analysatoren sind beim Balancieren auf einem Schwebebalken vor allem beteiligt?", a:"Vestibulärer Analysator (Gleichgewichtsorgan), kinästhetischer Analysator (Muskel- und Gelenkstellung), optischer Analysator (Orientierung am Balken) und taktiler Analysator (Fußsohlen)."},
{q:"Nenne drei Möglichkeiten, ein Koordinationstraining zu erschweren.", a:"Zeitdruck erhöhen (schneller ausführen), Komplexität steigern (zusätzliche Aufgabe, z.B. zwei Bälle) und Situationsdruck erzeugen (wechselnde Bedingungen, z.B. Gegnerdruck)."}]}
]},

{ch:"Ergänzungen von SmartStud", items:[
{t:"Beweglichkeit", i:["Beweglichkeit bestimmt, wie weit du dich strecken, beugen oder drehen kannst. Sie schützt vor Verletzungen und ist in vielen Sportarten Voraussetzung für eine gute Technik.","Beweglichkeit ist die vierte konditionelle Fähigkeit neben Kraft, Ausdauer und Schnelligkeit und fehlte in deinen Ordnern. Unten lernst du Formen und Dehnmethoden."], s:`Definition
• Fähigkeit, Bewegungen mit großer Schwingungsweite auszuführen
• Setzt sich zusammen aus Gelenkigkeit (Bau der Gelenke) und Dehnfähigkeit (Muskeln, Sehnen, Bänder)

Formen
• Aktive Beweglichkeit: durch eigene Muskelkraft erreicht
• Passive Beweglichkeit: mit Hilfe äußerer Kräfte (Partner, Schwerkraft) – immer größer als die aktive
• Statische und dynamische Beweglichkeit

Einflussfaktoren
• Gelenkstruktur, Muskeltonus, Temperatur (Aufwärmen), Tageszeit, Alter, Geschlecht, Ermüdung

Dehnmethoden
• Statisches Dehnen: Position langsam einnehmen und halten
• Dynamisches Dehnen: federnde bzw. schwingende Bewegungen, gut zur Wettkampfvorbereitung
• PNF-Dehnen (Anspannen–Entspannen): Muskel erst anspannen, dann tiefer dehnen

Fallstricke
• Ausgiebiges statisches Dehnen direkt vor Schnellkraftleistungen kann die Leistung kurzfristig senken`, k:[
{q:"Unterscheide aktive und passive Beweglichkeit.", a:"Aktive Beweglichkeit wird durch eigene Muskelkraft erreicht, z.B. Bein selbst anheben. Passive Beweglichkeit wird durch äußere Kräfte erreicht, z.B. ein Partner drückt das Bein höher. Die passive ist immer größer."},
{q:"Welche Dehnmethode eignet sich vor einem Sprintwettkampf? Begründe.", a:"Dynamisches Dehnen: Es bereitet Muskeln und Nervensystem auf schnelle Bewegungen vor, während langes statisches Dehnen die Schnellkraft kurzfristig senken kann."}]},

{t:"Motorisches Lernen", i:["Wie lernt man eine neue Bewegung, etwa einen Flickflack oder einen Sprungwurf? Am Anfang ist alles holprig, dann wird es flüssiger, bis es schließlich auch unter Druck klappt.","Das Phasenmodell des motorischen Lernens hilft, Lernprozesse zu beschreiben und Unterricht zu planen. Diese Ergänzung fehlte noch in deinen Ordnern."], s:`Phasenmodell (nach Meinel/Schnabel)
• 1. Grobkoordination: Bewegung gelingt in Grundzügen, aber verkrampft, ungenau, mit zu viel Krafteinsatz
• 2. Feinkoordination: Bewegung wird flüssig, genau und ökonomisch – unter günstigen Bedingungen
• 3. Variable Verfügbarkeit (stabilisierte Feinkoordination): Bewegung gelingt auch unter schwierigen, wechselnden Bedingungen

Lernhilfen
• Instruktion (verbale Erklärung), Demonstration (Vormachen, Videos), Bewegungsbeschreibung
• Feedback: über das Ergebnis (Knowledge of Results) oder die Ausführung (Knowledge of Performance)
• Hilfestellung und methodische Übungsreihen

Methoden
• Ganzheitsmethode: Bewegung als Ganzes üben (bei einfachen Bewegungen)
• Teillernmethode: Bewegung in Teile zerlegen (bei komplexen Bewegungen)

Fallstricke
• In der Grobkoordination zu viele Korrekturen auf einmal überfordern den Lernenden`, k:[
{q:"Beschreibe die drei Phasen des motorischen Lernens am Beispiel des Korblegers.", a:"Grobkoordination: Der Korbleger gelingt nur verkrampft, Schrittrhythmus und Absprung stimmen oft nicht. Feinkoordination: Ablauf ist flüssig und meist treffsicher, solange kein Gegner stört. Variable Verfügbarkeit: Korbleger gelingt auch im Spiel unter Gegnerdruck und von verschiedenen Seiten."},
{q:"Wann ist die Teillernmethode sinnvoll?", a:"Bei komplexen Bewegungen, die aus mehreren gut trennbaren Teilen bestehen, z.B. Hochsprung (Anlauf, Absprung, Lattenüberquerung). Die Teile werden einzeln geübt und dann zusammengesetzt."}]}
]}
];
SPORT.forEach(c=>c.items.forEach(it=>{ if(it.i) INTRO[it.t]=it.i; }));

const SCHNELL = {ch:"13.1 Schnelligkeit", items:[
{t:"Schnelligkeit: Begriff und Arten", i:["Ein Sprinter beim Startschuss, ein Boxer beim Schlag, ein Torwart beim Elfmeter – sie alle brauchen Schnelligkeit, aber jeweils eine andere Form. Schnelligkeit ist nämlich nicht nur „schnell rennen“, sondern ein Bündel aus Reaktion, Bewegung und Denken.","Die Einteilung der Schnelligkeitsformen ist die Grundlage für alle weiteren Themen. Unten lernst du die Definition, die Arten und das Ordnungsschema mit allen Erscheinungsformen."], s:`Definition
• Schnelligkeit ist die Fähigkeit, auf der Basis kognitiver Prozesse, maximaler Willenskraft und einer hoch entwickelten koordinativen und konditionellen Leistungsfähigkeit die schnellstmögliche Reaktions- und Bewegungsgeschwindigkeit zu erzielen
• Sie hat also drei Wurzeln: Kopf (kognitiv), Steuerung (koordinativ) und Körper (konditionell)

Bedeutung je Sportart
• Schnelligkeit zeigt sich in jeder Sportart in typischer Form
• Boxen: Schlagschnelligkeit
• Sprint: Bewegungsgeschwindigkeit
• Rückschlagspiele (Tennis, Badminton): Antizipation
• Kugelstoßen: Explosivkraft
• Komplexer Charakter: Für Höchstleistungen müssen Reaktions- und Bewegungsgeschwindigkeit zusammenspielen

Zyklisch und azyklisch
• Zyklische Schnelligkeit (Frequenzschnelligkeit): sich wiederholende, gleiche Bewegungen mit maximaler Geschwindigkeit bzw. höchster Frequenz, z.B. Sprint (100-m-Lauf)
• Azyklische Schnelligkeit (Aktionsschnelligkeit): einmalige Bewegung mit höchster Geschwindigkeit wie Schlagen, Werfen, Stoßen, Springen, z.B. Kugelstoß, Weitsprung
• Beide Formen sind voneinander unabhängig: Wer eine hohe Frequenzschnelligkeit hat, muss nicht automatisch eine hohe Aktionsschnelligkeit haben (und umgekehrt)

Elementar und komplex
• Elementare („reine“) Schnelligkeit: ohne oder mit nur geringem Widerstand und ohne Ermüdung
• Komplexe Schnelligkeit: mit Widerstand bzw. mit Ermüdung – also in Kombination mit Kraft oder Ausdauer

Die Erscheinungsformen im Überblick
• Zyklisch, elementar: Frequenzschnelligkeit
• Zyklisch, komplex: (zyklische) Sprintschnelligkeitsausdauer
