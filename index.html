<script>
const MATH = [
{ch:"Grundlagen 11: Analysis", items:[
{t:"Kurvendiskussion", s:`Kurzüberblick
Bei einer Kurvendiskussion untersuchst du eine Funktion Schritt für Schritt, bis du den Graphen sicher skizzieren kannst. Die Reihenfolge unten funktioniert für ganzrationale Funktionen und lässt sich auf andere Funktionstypen übertragen.

1. Definitionsmenge
• Ganzrationale Funktionen: ganz ℝ
• Brüche: Nullstellen des Nenners ausschließen
• Wurzel: Argument ≥ 0; ln: Argument > 0

2. Symmetrie
• f(−x) = f(x) → achsensymmetrisch zur y-Achse (nur gerade Exponenten)
• f(−x) = −f(x) → punktsymmetrisch zum Ursprung (nur ungerade Exponenten)
• Bei Symmetrie spart man sich die Hälfte der Arbeit.

3. Nullstellen: f(x) = 0
• Ausklammern, Mitternachtsformel, Substitution (x² = u), Polynomdivision nach Raten einer Nullstelle
• Vielfachheit: einfach → Schnittpunkt mit Vorzeichenwechsel; doppelt → Berührpunkt (Extrempunkt), kein Vorzeichenwechsel; dreifach → Terrassenpunkt

4. Monotonie und Extrempunkte: f'(x) = 0
• f'(x) > 0 → streng monoton steigend; f'(x) < 0 → fallend
• Vorzeichenwechsel von f' von + nach − → Hochpunkt, von − nach + → Tiefpunkt
• Kein Vorzeichenwechsel → Terrassenpunkt
• Alternativ: f''(x₀) < 0 → Hochpunkt, f''(x₀) > 0 → Tiefpunkt
• y-Wert immer in f(x) einsetzen, nicht in f'(x)!

5. Krümmung und Wendepunkte: f''(x) = 0
• f''(x) > 0 → linksgekrümmt; f''(x) < 0 → rechtsgekrümmt
• Nullstelle von f'' mit Vorzeichenwechsel → Wendepunkt (Krümmungswechsel)

6. Verhalten im Unendlichen
• Bei ganzrationalen Funktionen bestimmt der Summand mit der höchsten Potenz das Verhalten.

7. Zeichnung
• Alle besonderen Punkte eintragen, Symmetrie und Verhalten im Unendlichen beachten.`, k:[
{q:"Führe für f(x) = x³ − 3x² eine Kurvendiskussion durch: Nullstellen, Extrempunkte, Monotonie, Wendepunkt und Verhalten im Unendlichen.", a:"Nullstellen: x²(x − 3) = 0 → x = 0 (doppelt, Berührpunkt), x = 3 (einfach)\nf'(x) = 3x² − 6x = 3x(x − 2) → x = 0, x = 2\nf' > 0 für x < 0, f' < 0 für 0 < x < 2, f' > 0 für x > 2\n→ Hochpunkt H(0 | 0), Tiefpunkt T(2 | −4)\nMonoton steigend auf ]−∞; 0] und [2; ∞[, fallend auf [0; 2]\nf''(x) = 6x − 6 = 0 → x = 1 mit Vorzeichenwechsel → W(1 | −2)\nx → ∞: f(x) → ∞; x → −∞: f(x) → −∞"},
{q:"Untersuche f(x) = x⁴ − 2x² auf Symmetrie, Nullstellen und Extrempunkte.", a:"Nur gerade Exponenten → achsensymmetrisch zur y-Achse\nNullstellen: x²(x² − 2) = 0 → x = 0 (doppelt), x = ±√2\nf'(x) = 4x³ − 4x = 4x(x² − 1) → x = 0, x = ±1\nf''(x) = 12x² − 4: f''(0) = −4 < 0 → H(0 | 0); f''(±1) = 8 > 0 → T(±1 | −1)"},
{q:"Gegeben ist f(x) = (x − 1)³·(x + 2). Was kannst du ohne Ableitung über den Graphen an den Stellen x = 1 und x = −2 aussagen?", a:"x = 1 ist eine dreifache Nullstelle: Der Graph schneidet die x-Achse dort mit Vorzeichenwechsel und hat einen Terrassenpunkt (waagrechte Tangente, aber kein Extrempunkt).\nx = −2 ist eine einfache Nullstelle: Der Graph schneidet die x-Achse dort ganz normal."},
{q:"Die zweite Ableitung einer Funktion f hat bei x = 3 eine Nullstelle mit Vorzeichenwechsel von + nach −. Gib die Bedeutung für den Graphen von f an.", a:"Der Graph von f hat bei x = 3 einen Wendepunkt. Er wechselt dort von einer Linkskrümmung zu einer Rechtskrümmung. An dieser Stelle ist die Steigung von f maximal (lokal)."}]},

{t:"Exponential- und Logarithmusfunktion", s:`Kurzüberblick
Die natürliche Exponentialfunktion eˣ und der natürliche Logarithmus ln x sind Umkehrfunktionen voneinander. Sie kommen im Abitur ständig vor, oft verknüpft mit anderen Funktionen.

e-Funktion
• Definitionsmenge ℝ, Wertemenge ]0; ∞[ – eˣ ist nie null!
• e⁰ = 1; (eˣ)' = eˣ
• x → −∞: eˣ → 0 (x-Achse ist Asymptote)

ln-Funktion
• Definitionsmenge ]0; ∞[
• ln 1 = 0; ln e = 1; (ln x)' = 1/x
• x → 0 (von rechts): ln x → −∞; x → ∞: ln x → ∞ (aber sehr langsam)

Umkehrung und Rechenregeln
• e^(ln x) = x und ln(eˣ) = x
• ln(a·b) = ln a + ln b; ln(a/b) = ln a − ln b; ln(aʳ) = r·ln a
• Gleichungen: eˣ = 5 → x = ln 5; ln x = 2 → x = e²

Ableiten mit Kettenregel
• (e^(g(x)))' = g'(x)·e^(g(x))
• (ln(g(x)))' = g'(x)/g(x)

Wichtige Grenzwerte
• eˣ „gewinnt“ gegen jede Potenz: x²·e^(−x) → 0 für x → ∞
• Potenzen „gewinnen“ gegen ln: (ln x)/x → 0 für x → ∞; x·ln x → 0 für x → 0

Fallstricke
• Definitionsmenge bei ln beachten.
• Bei Gleichungen wie e^(2x) − 3eˣ + 2 = 0 substituieren: u = eˣ.`, k:[
{q:"Löse die Gleichung e^(2x) − 3eˣ + 2 = 0.", a:"Substitution u = eˣ: u² − 3u + 2 = 0 → u = 1 oder u = 2\neˣ = 1 → x = 0\neˣ = 2 → x = ln 2 ≈ 0,69"},
{q:"Gegeben ist f(x) = ln(x² + 1). Gib die Definitionsmenge an und bestimme den Extrempunkt.", a:"x² + 1 > 0 für alle x → D = ℝ\nf'(x) = 2x/(x² + 1) = 0 → x = 0\nf' < 0 für x < 0, f' > 0 für x > 0 → Tiefpunkt T(0 | 0)"},
{q:"Gegeben ist f(x) = (ln x)² mit x > 0. Zeige, dass der Graph bei x = e einen Wendepunkt hat.", a:"f'(x) = 2·ln x · (1/x) = 2 ln x / x\nQuotientenregel: f''(x) = (2/x · x − 2 ln x · 1)/x² = (2 − 2 ln x)/x²\nf''(e) = (2 − 2)/e² = 0\nFür x < e ist ln x < 1, also f'' > 0; für x > e ist f'' < 0 → Vorzeichenwechsel\nWendepunkt W(e | 1): Der Graph wechselt von Links- zu Rechtskrümmung."},
{q:"Begründe, dass lim (x → ∞) x²·e^(−x) = 0 gilt.", a:"x²·e^(−x) = x²/eˣ. Die Exponentialfunktion wächst schneller als jede Potenz, deshalb wird der Nenner viel schneller groß als der Zähler. Der Bruch geht gegen 0."}]}
]},

{ch:"Grundlagen 11: Stochastik", items:[
{t:"Kombinatorik", s:`Kurzüberblick
Kombinatorik beantwortet die Frage „Wie viele Möglichkeiten gibt es?“. Das braucht man vor allem für Laplace-Wahrscheinlichkeiten: P(E) = Anzahl günstige / Anzahl mögliche Ergebnisse.

Allgemeines Zählprinzip
• Bei mehreren unabhängigen Stufen werden die Anzahlen multipliziert.

Urnenmodelle (k aus n ziehen)
• Geordnet, mit Zurücklegen: nᵏ
• Geordnet, ohne Zurücklegen: n·(n−1)·…·(n−k+1) = n!/(n−k)!
• Ungeordnet, ohne Zurücklegen: (n über k) = n!/(k!·(n−k)!)
• Alle n Objekte anordnen (Permutation): n!
• Mit gleichen Objekten: n!/(k₁!·k₂!·…)

Binomialkoeffizient (n über k)
• Anzahl der Möglichkeiten, k Objekte aus n auszuwählen (Reihenfolge egal)
• Beispiel: (3 über 2) = 3 Möglichkeiten, 2 von 3 Farben auszuwählen

Systematisch abzählen
• Bei Bedingungen wie „mindestens 4 und höchstens 6“ lohnt sich oft eine geordnete Liste aller Fälle.

Fallstricke
• Erst klären: Spielt die Reihenfolge eine Rolle? Wird zurückgelegt?
• Im Sachzusammenhang die Bedeutung jedes Faktors erklären können.`, k:[
{q:"Wie viele vierstellige PINs aus den Ziffern 0–9 gibt es? Wie viele davon enthalten keine Ziffer doppelt?", a:"Mit Wiederholung: 10⁴ = 10 000\nOhne Wiederholung: 10·9·8·7 = 5 040"},
{q:"Beim Lotto werden 6 aus 49 Zahlen gezogen. Wie viele Tipps gibt es und wie groß ist die Wahrscheinlichkeit für 6 Richtige?", a:"(49 über 6) = 13 983 816\nP(6 Richtige) = 1/13 983 816 ≈ 0,0000072 %"},
{q:"Wie viele verschiedene „Wörter“ lassen sich aus allen Buchstaben von ANANAS bilden?", a:"6 Buchstaben, davon 3 A, 2 N, 1 S:\n6!/(3!·2!) = 720/12 = 60"},
{q:"Ein Strauß besteht aus 10 Tulpen. Es gibt Tulpen in Gelb, Orange und Rot. Der Strauß soll Tulpen in genau zwei verschiedenen Farben enthalten. Bestimme die Anzahl der Möglichkeiten und erkläre die Bedeutung der Faktoren.", a:"(3 über 2) = 3: Auswahl der zwei Farben aus drei.\nFür zwei feste Farben: Die erste Farbe kann 1 bis 9 Tulpen haben, der Rest ist die zweite Farbe → 9 Möglichkeiten.\nGesamt: 3·9 = 27"}]},

{t:"Binomialverteilung", s:`Kurzüberblick
Die Binomialverteilung beschreibt die Anzahl der Treffer, wenn ein Zufallsexperiment mit nur zwei Ausgängen mehrfach unabhängig wiederholt wird.

Voraussetzungen (Bernoulli-Kette)
• Jede Stufe hat genau zwei Ausgänge: Treffer / Niete
• Trefferwahrscheinlichkeit p bleibt gleich
• Die Stufen sind unabhängig (z.B. Ziehen mit Zurücklegen)
• n = Anzahl der Stufen (Kettenlänge)

Formel
• P(X = k) = (n über k) · pᵏ · (1 − p)ⁿ⁻ᵏ
• Kumuliert P(X ≤ k): aus Tabelle oder Taschenrechner

Wichtige Umformungen
• P(X ≥ k) = 1 − P(X ≤ k − 1)
• P(X > k) = 1 − P(X ≤ k)
• P(a ≤ X ≤ b) = P(X ≤ b) − P(X ≤ a − 1)
• „mindestens 1“: P(X ≥ 1) = 1 − (1 − p)ⁿ

Kenngrößen
• Erwartungswert μ = n·p
• Standardabweichung σ = √(n·p·(1 − p))
• Das Histogramm hat sein Maximum in der Nähe von n·p.

Mindestens-Aufgabe (Typ „Wie oft muss man mindestens…“)
• 1 − (1 − p)ⁿ ≥ Sicherheit → nach n auflösen mit ln (Ungleichheitszeichen dreht sich beim Teilen durch ln(1−p) < 0!)

Fallstricke
• „Höchstens“, „mindestens“, „mehr als“, „weniger als“ sauber übersetzen.`, k:[
{q:"Ein Würfel wird 10-mal geworfen, X ist die Anzahl der Sechsen. Berechne P(X = 2).", a:"P(X = 2) = (10 über 2)·(1/6)²·(5/6)⁸ = 45·(1/36)·0,2326 ≈ 0,291 = 29,1 %"},
{q:"Berechne für Aufgabe 1 die Wahrscheinlichkeit für mindestens eine Sechs.", a:"P(X ≥ 1) = 1 − P(X = 0) = 1 − (5/6)¹⁰ ≈ 1 − 0,1615 = 0,8385 ≈ 83,9 %"},
{q:"Wie oft muss man mindestens würfeln, um mit mindestens 95 % Wahrscheinlichkeit mindestens eine Sechs zu erhalten?", a:"1 − (5/6)ⁿ ≥ 0,95 → (5/6)ⁿ ≤ 0,05\nn·ln(5/6) ≤ ln 0,05 → n ≥ ln 0,05 / ln(5/6) ≈ 16,4 (Zeichen dreht sich, da ln(5/6) < 0)\nMan muss mindestens 17-mal würfeln."},
{q:"20 % aller Kunden zahlen bar. Von 100 Kunden: Gib Erwartungswert und Standardabweichung der Anzahl der Barzahler an.", a:"μ = 100·0,2 = 20\nσ = √(100·0,2·0,8) = √16 = 4"}]},

{t:"Hypothesentest", s:`Kurzüberblick
Mit einem Hypothesentest entscheidet man anhand einer Stichprobe, ob man eine Behauptung über eine Wahrscheinlichkeit p ablehnt. Wichtig: Eine Hypothese wird nie „bewiesen“, man kann sie nur ablehnen oder nicht ablehnen.

Hypothesen
• Nullhypothese H₀ und Gegenhypothese H₁; das Gleichheitszeichen gehört immer zu H₀.
• Linksseitiger Test: H₀: p ≥ p₀, H₁: p < p₀ → kleine Werte sprechen gegen H₀, Ablehnungsbereich K = {0, …, k}
• Rechtsseitiger Test: H₀: p ≤ p₀, H₁: p > p₀ → große Werte sprechen gegen H₀, Ablehnungsbereich K = {k, …, n}
• Merkhilfe: Das Ungleichheitszeichen bei H₁ zeigt in Richtung des Ablehnungsbereichs.

Fehler
• Fehler 1. Art: H₀ wird abgelehnt, obwohl sie wahr ist. Seine Wahrscheinlichkeit ist höchstens das Signifikanzniveau α.
• Fehler 2. Art: H₀ wird nicht abgelehnt, obwohl sie falsch ist.
• Wird α kleiner gewählt, wird der Fehler 2. Art größer (und umgekehrt).

Ablauf
1. Hypothesen aufstellen
2. Stichprobenumfang n und Signifikanzniveau α festlegen
3. Testgröße X = Anzahl der Treffer; bei wahrer H₀ binomialverteilt mit n und p₀
4. Linksseitig: größtes k mit P(X ≤ k) ≤ α
   Rechtsseitig: kleinstes k mit P(X ≥ k) ≤ α, umgeformt P(X ≤ k − 1) ≥ 1 − α
5. Ablehnungsbereich mit der Tabelle bestimmen
6. Entscheidungsregel formulieren bzw. Stichprobenergebnis bewerten

Fallstricke
• Beim rechtsseitigen Test den Schritt zur Gegenwahrscheinlichkeit nicht vergessen (k − 1!).
• Die Entscheidung im Sachzusammenhang formulieren.`, k:[
{q:"Ein Hersteller behauptet, höchstens 10 % seiner Bauteile seien defekt. Dies soll mit 50 zufällig ausgewählten Bauteilen auf dem Signifikanzniveau 5 % getestet werden. Bestimme den Ablehnungsbereich und formuliere die Entscheidungsregel.\nTabellenwerte für n = 50, p = 0,1: P(X ≤ 8) = 0,9421; P(X ≤ 9) = 0,9755", a:"H₀: p ≤ 0,1; H₁: p > 0,1 (rechtsseitig)\nX = Anzahl defekter Teile, bei wahrer H₀ binomialverteilt mit n = 50, p = 0,1\nGesucht: kleinstes k mit P(X ≥ k) ≤ 0,05 ⇔ P(X ≤ k − 1) ≥ 0,95\nP(X ≤ 9) = 0,9755 ≥ 0,95 → k − 1 = 9 → k = 10\nK = {10, …, 50}\nRegel: Werden mindestens 10 defekte Teile gefunden, wird die Behauptung des Herstellers abgelehnt."},
{q:"Eine Partei hatte bisher einen Stimmenanteil von 30 %. Man vermutet, dass er gesunken ist. Bei 100 Befragten soll auf dem Niveau 5 % getestet werden. Bestimme den Ablehnungsbereich.\nTabellenwerte für n = 100, p = 0,3: P(X ≤ 22) = 0,0479; P(X ≤ 23) = 0,0755", a:"H₀: p ≥ 0,3; H₁: p < 0,3 (linksseitig)\nGesucht: größtes k mit P(X ≤ k) ≤ 0,05\nP(X ≤ 22) = 0,0479 ≤ 0,05, aber P(X ≤ 23) = 0,0755 > 0,05 → k = 22\nK = {0, …, 22}\nGeben höchstens 22 Personen an, die Partei zu wählen, kann man auf dem 5 %-Niveau von einem gesunkenen Stimmenanteil ausgehen."},
{q:"Beschreibe für Aufgabe 2 den Fehler 1. Art im Sachzusammenhang.", a:"Man geht davon aus, dass der Stimmenanteil gesunken ist, obwohl er in Wirklichkeit immer noch mindestens 30 % beträgt."},
{q:"Für einen Test mit n = 20 und H₀: p ≥ 0,4 wird der Ablehnungsbereich K = {0, …, 3} gewählt. Berechne die Wahrscheinlichkeit für den Fehler 1. Art.\nTabellenwert: P(X ≤ 3) = 0,0160 für n = 20, p = 0,4", a:"Fehler 1. Art: Ergebnis in K, obwohl p = 0,4.\nP(X ≤ 3) = 0,0160 = 1,6 %"}]}
]},

{ch:"Grundlagen 11: Vektoren", items:[
{t:"Vektoren: Grundlagen", s:`Kurzüberblick
Vektoren beschreiben Verschiebungen im Raum: Sie haben eine Länge und eine Richtung. Punkte und Vektoren werden unterschiedlich geschrieben, hängen aber eng zusammen.

Grundbegriffe
• Koordinatensystem: x₁-Achse nach vorne, x₂ nach rechts, x₃ nach oben
• Ortsvektor OA⃗: zeigt vom Ursprung zum Punkt A, hat dieselben Koordinaten wie A
• Verbindungsvektor: AB⃗ = B⃗ − A⃗ („Spitze minus Fuß“)
• Gegenvektor: BA⃗ = −AB⃗
• Nullvektor 0⃗: Ergebnis einer geschlossenen Vektorkette

Rechnen
• Addition und Subtraktion koordinatenweise
• Vektorkette: AB⃗ + BC⃗ = AC⃗
• Vielfaches r·a⃗: parallel zu a⃗, |r|-fache Länge; r < 0 dreht die Orientierung um

Länge (Betrag)
• |a⃗| = √(a₁² + a₂² + a₃²)
• Abstand zweier Punkte = |AB⃗|
• Einheitsvektor: a⃗ / |a⃗| (Länge 1)

Besondere Punkte
• Mittelpunkt: M⃗ = ½·(A⃗ + B⃗)
• Schwerpunkt eines Dreiecks: S⃗ = ⅓·(A⃗ + B⃗ + C⃗)
• Vierter Punkt eines Parallelogramms ABCD: D⃗ = A⃗ + BC⃗
• Parallelogramm-Nachweis: AB⃗ = DC⃗

Fallstricke
• Reihenfolge beim Verbindungsvektor: B − A, nicht A − B.
• Beim Parallelogramm auf die Reihenfolge der Ecken achten (ABCD gegen den Uhrzeigersinn oder im Uhrzeigersinn).`, k:[
{q:"Gegeben sind A(1 | 0 | 2), B(4 | 1 | 3), C(5 | 3 | 6) und D(2 | 2 | 5). Weise nach, dass ABCD ein Parallelogramm ist.", a:"AB⃗ = (3 | 1 | 1)\nDC⃗ = C⃗ − D⃗ = (3 | 1 | 1)\nAB⃗ = DC⃗ → die Seiten [AB] und [DC] sind parallel und gleich lang → ABCD ist ein Parallelogramm."},
{q:"Bestimme den Mittelpunkt der Strecke [AB] mit A(1 | −2 | 3) und B(5 | 4 | −1).", a:"M⃗ = ½·((1 | −2 | 3) + (5 | 4 | −1)) = ½·(6 | 2 | 2) = (3 | 1 | 1)\nM(3 | 1 | 1)"},
{q:"Berechne den Abstand der Punkte A(1 | 2 | 3) und B(3 | 4 | 4).", a:"AB⃗ = (2 | 2 | 1), |AB⃗| = √(4 + 4 + 1) = 3"},
{q:"Bestimme den Punkt D so, dass ABCD mit A(1 | 1 | 0), B(4 | 2 | 1) und C(5 | 5 | 3) ein Parallelogramm ist.", a:"BC⃗ = (1 | 3 | 2)\nD⃗ = A⃗ + BC⃗ = (1 | 1 | 0) + (1 | 3 | 2) = (2 | 4 | 2)\nD(2 | 4 | 2)"},
{q:"Zeige, dass das Dreieck mit A(0 | 0 | 0), B(3 | 4 | 0) und C(0 | 0 | 5) gleichschenklig ist.", a:"|AB⃗| = √(9 + 16) = 5, |AC⃗| = √25 = 5\nZwei gleich lange Seiten → gleichschenklig mit Spitze A."}]},

{t:"Skalarprodukt und Vektorprodukt", s:`Kurzüberblick
Das Skalarprodukt liefert eine Zahl und hilft bei Winkeln und rechten Winkeln. Das Vektorprodukt liefert einen Vektor, der senkrecht auf zwei Vektoren steht, und hilft bei Flächen, Volumen und Normalenvektoren.

Skalarprodukt
• a⃗ ∘ b⃗ = a₁b₁ + a₂b₂ + a₃b₃ (Ergebnis ist eine Zahl!)
• a⃗ ∘ b⃗ = |a⃗|·|b⃗|·cos φ
• Winkel: cos φ = (a⃗ ∘ b⃗) / (|a⃗|·|b⃗|), 0° ≤ φ ≤ 180°
• a⃗ ⊥ b⃗ ⇔ a⃗ ∘ b⃗ = 0
• a⃗ ∘ a⃗ = |a⃗|²

Vektorprodukt (Kreuzprodukt)
• a⃗ × b⃗ = (a₂b₃ − a₃b₂ | a₃b₁ − a₁b₃ | a₁b₂ − a₂b₁)
• Ergebnis steht senkrecht auf a⃗ und b⃗ → Normalenvektor einer Ebene
• |a⃗ × b⃗| = Flächeninhalt des Parallelogramms aus a⃗ und b⃗
• Dreieck ABC: A = ½·|AB⃗ × AC⃗|
• a⃗ × b⃗ = −(b⃗ × a⃗)

Volumen (Spatprodukt)
• Dreiseitige Pyramide: V = ⅙·|(a⃗ × b⃗) ∘ c⃗|
• Vierseitige Pyramide mit Parallelogramm-Grundfläche: V = ⅓·|(a⃗ × b⃗) ∘ c⃗|

Typische Abituraufgaben
• Rechten Winkel in einem Dreieck nachweisen
• Punkt auf einer Strecke so bestimmen, dass ein rechter Winkel entsteht
• Flächeninhalt und Volumen berechnen

Fallstricke
• Beim rechten Winkel bei B: Vektoren von B aus nehmen (BA⃗ und BC⃗).
• Probe beim Vektorprodukt: Ergebnis ∘ a⃗ = 0 und Ergebnis ∘ b⃗ = 0.`, k:[
{q:"Berechne den Winkel zwischen a⃗ = (1 | 2 | 2) und b⃗ = (2 | −1 | 2).", a:"a⃗ ∘ b⃗ = 2 − 2 + 4 = 4; |a⃗| = 3; |b⃗| = 3\ncos φ = 4/9 → φ ≈ 63,6°"},
{q:"Zeige, dass das Dreieck mit A(1 | 0 | 0), B(3 | 1 | 2) und C(1 | 3 | 3) bei B einen rechten Winkel hat.", a:"BA⃗ = (−2 | −1 | −2), BC⃗ = (−2 | 2 | 1)\nBA⃗ ∘ BC⃗ = 4 − 2 − 2 = 0 → rechter Winkel bei B"},
{q:"Berechne den Flächeninhalt des Dreiecks A(1 | 0 | 1), B(3 | 2 | 1), C(1 | 2 | 3).", a:"AB⃗ = (2 | 2 | 0), AC⃗ = (0 | 2 | 2)\nAB⃗ × AC⃗ = (2·2 − 0·2 | 0·0 − 2·2 | 2·2 − 2·0) = (4 | −4 | 4)\n|AB⃗ × AC⃗| = √48 = 4√3\nA = ½·4√3 = 2√3 ≈ 3,46 FE"},
{q:"Gegeben sind A(0 | 0 | 0), B(2 | 2 | 0) und C(2 | 6 | 4). Der Punkt T liegt auf der Strecke [AC], und das Dreieck ABT hat bei B einen rechten Winkel. Bestimme das Verhältnis der Längen AT : TC.", a:"T = s·C⃗ = (2s | 6s | 4s), 0 ≤ s ≤ 1\nBA⃗ = (−2 | −2 | 0), BT⃗ = (2s − 2 | 6s − 2 | 4s)\nBA⃗ ∘ BT⃗ = −2(2s − 2) − 2(6s − 2) = −16s + 8 = 0 → s = 0,5\nT ist der Mittelpunkt von [AC], also AT : TC = 1 : 1"},
{q:"Berechne das Volumen der Pyramide mit A(0 | 0 | 0), B(4 | 0 | 0), C(0 | 4 | 0) und Spitze S(0 | 0 | 6).", a:"a⃗ = AB⃗ = (4 | 0 | 0), b⃗ = AC⃗ = (0 | 4 | 0), c⃗ = AS⃗ = (0 | 0 | 6)\na⃗ × b⃗ = (0 | 0 | 16); (a⃗ × b⃗) ∘ c⃗ = 96\nV = ⅙·96 = 16 VE\nKontrolle: Grundfläche ½·4·4 = 8, Höhe 6 → ⅓·8·6 = 16 ✓"}]}
]},

{ch:"I Flächeninhalt und bestimmtes Integral", items:[
{t:"Das bestimmte Integral", s:`Schreibweise in dieser App: ∫[a;b] f(x) dx = Integral von a bis b.

Kurzüberblick
Die Fläche unter einem Graphen wird durch schmale Rechteckstreifen angenähert. Die Untersumme liegt darunter, die Obersumme darüber. Werden die Streifen immer schmaler (n → ∞), nähern sich beide demselben Grenzwert: dem bestimmten Integral ∫[a;b] f(x) dx.

Wichtige Begriffe
• Integrationsgrenzen a und b
• Integrand f(x), Integrationsvariable x
• Unter- und Obersumme: Annäherung von unten bzw. oben

Kernwissen
• Ist f(x) ≥ 0 auf [a;b], ist das Integral der Flächeninhalt zwischen Graph und x-Achse.
• ∫[a;a] f(x) dx = 0
• ∫[b;a] f(x) dx = −∫[a;b] f(x) dx (Grenzen tauschen = Vorzeichen wechseln)
• ∫[a;b] f dx + ∫[b;c] f dx = ∫[a;c] f dx (Intervalladditivität)
• ∫ k·f(x) dx = k·∫ f(x) dx und ∫ (f+g) dx = ∫ f dx + ∫ g dx

Typische Fallstricke
• Integral und Flächeninhalt sind nur gleich, wenn der Graph oberhalb der x-Achse liegt.
• Symmetrie nutzen: Bei punktsymmetrischen Funktionen ist ∫[−a;a] f(x) dx = 0.`, k:[
{q:"Schätze ∫[0;2] x² dx mit Unter- und Obersumme bei 4 gleich breiten Streifen ab.", a:"Streifenbreite 0,5.\nUntersumme: 0,5·(0² + 0,5² + 1² + 1,5²) = 0,5·3,5 = 1,75\nObersumme: 0,5·(0,5² + 1² + 1,5² + 2²) = 0,5·7,5 = 3,75\nDer exakte Wert 8/3 ≈ 2,67 liegt dazwischen."},
{q:"Es gilt ∫[1;4] f(x) dx = 5 und ∫[1;2] f(x) dx = 2. Berechne\na) ∫[2;4] f(x) dx\nb) ∫[4;1] f(x) dx\nc) ∫[1;4] 3·f(x) dx", a:"a) 5 − 2 = 3 (Intervalladditivität)\nb) −5 (Grenzen vertauscht)\nc) 3·5 = 15 (Faktorregel)"},
{q:"Begründe ohne Rechnung, dass ∫[−2;2] x³ dx = 0 gilt.", a:"Der Graph von x³ ist punktsymmetrisch zum Ursprung. Die Fläche über [0;2] liegt oberhalb, die über [−2;0] gleich groß unterhalb der x-Achse. Sie heben sich in der Bilanz auf."}]},

{t:"Integral als Flächenbilanz und Integralfunktion", s:`Kurzüberblick
Flächen unterhalb der x-Achse zählen beim Integral negativ. Das Integral ist also eine Flächenbilanz: Fläche oben minus Fläche unten. Die Integralfunktion beschreibt diese Bilanz in Abhängigkeit von der oberen Grenze.

Wichtige Begriffe
• Flächenbilanz: Summe der orientierten Flächen
• Integralfunktion: Iₐ(x) = ∫[a;x] f(t) dt mit fester unterer Grenze a

Kernwissen zur Integralfunktion
• Iₐ(a) = 0, also ist a immer eine Nullstelle von Iₐ.
• Iₐ'(x) = f(x)
• Wo f(x) > 0 ist, steigt Iₐ. Wo f(x) < 0 ist, fällt Iₐ.
• Nullstelle von f mit Vorzeichenwechsel → Extremstelle von Iₐ (+ nach − Hochpunkt, − nach + Tiefpunkt)
• Extremstelle von f → Wendestelle von Iₐ

Typische Abituraufgaben
• Aus dem Graphen von f Eigenschaften von Iₐ ablesen (Monotonie, Extrema, Wendestellen).
• Werte von Iₐ durch Kästchenzählen abschätzen.`, k:[
{q:"Berechne die Flächenbilanz ∫[0;3] (x − 1) dx mithilfe von Dreiecksflächen.", a:"Von 0 bis 1 liegt ein Dreieck unterhalb der x-Achse: ½·1·1 = 0,5.\nVon 1 bis 3 liegt ein Dreieck oberhalb: ½·2·2 = 2.\nBilanz: 2 − 0,5 = 1,5"},
{q:"Gegeben ist I(x) = ∫[2;x] (t² − 4) dt.\na) Gib eine Nullstelle von I ohne Rechnung an.\nb) Bestimme Lage und Art der Extremstellen von I.\nc) Gib die Wendestelle von I an.", a:"a) x = 2, da I(2) = ∫[2;2] … = 0.\nb) I'(x) = x² − 4 hat Nullstellen x = ±2 mit Vorzeichenwechsel.\nBei x = −2: + nach − → Hochpunkt.\nBei x = 2: − nach + → Tiefpunkt.\nc) Die Wendestelle von I ist die Extremstelle von f(x) = x² − 4, also x = 0."},
{q:"Der Graph von f ist eine nach unten geöffnete Parabel mit den Nullstellen x = 1 und x = 5. Begründe, an welcher Stelle I₁(x) = ∫[1;x] f(t) dt im Intervall [1;5] ihren größten Wert annimmt.", a:"Auf ]1;5[ ist f(x) > 0, also steigt I₁ dort streng monoton. Der größte Wert wird deshalb am rechten Rand bei x = 5 angenommen."}]},

{t:"Hauptsatz der Differential- und Integralrechnung", s:`Kurzüberblick
Der Hauptsatz verbindet Ableiten und Integrieren: Integrale lassen sich mit einer Stammfunktion berechnen, ohne Grenzwerte von Streifensummen.

Wichtige Begriffe
• Stammfunktion F von f: F'(x) = f(x)
• Schreibweise: [F(x)]ₐᵇ = F(b) − F(a)

Kernwissen
• Hauptsatz: ∫[a;b] f(x) dx = F(b) − F(a)
• Zwei Stammfunktionen unterscheiden sich nur um eine Konstante C.
• Jede Integralfunktion ist eine Stammfunktion (für stetiges f).
• Nicht jede Stammfunktion ist eine Integralfunktion: Eine Integralfunktion hat immer eine Nullstelle.

Typische Abituraufgaben
• Nachweisen, dass F Stammfunktion von f ist → F ableiten und mit f vergleichen.
• Begründen, warum eine Funktion keine Integralfunktion sein kann (keine Nullstelle).

Fallstricke
• Klammern beim Einsetzen der unteren Grenze: F(b) − F(a), nicht F(b) − a.`, k:[
{q:"Berechne ∫[1;3] (2x + 1) dx.", a:"[x² + x]₁³ = (9 + 3) − (1 + 1) = 12 − 2 = 10"},
{q:"Berechne ∫[0;π] sin x dx.", a:"[−cos x]₀^π = −cos π − (−cos 0) = 1 + 1 = 2"},
{q:"Zeige, dass F(x) = x·ln x − x eine Stammfunktion von f(x) = ln x ist (x > 0).", a:"Produktregel: F'(x) = 1·ln x + x·(1/x) − 1 = ln x + 1 − 1 = ln x = f(x). ✓"},
{q:"Begründe, dass F(x) = x² + 1 zwar Stammfunktion, aber keine Integralfunktion von f(x) = 2x ist.", a:"F'(x) = 2x, also ist F Stammfunktion. Jede Integralfunktion Iₐ hat die Nullstelle x = a. Da x² + 1 ≥ 1 > 0 ist, hat F keine Nullstelle und kann keine Integralfunktion sein."}]},

{t:"Stammfunktionen und Integrale", s:`Kurzüberblick
Stammfunktionen findet man, indem man Ableitungsregeln rückwärts anwendet. Die wichtigsten Grundfunktionen solltest du sicher können.

Grundstammfunktionen
• xⁿ → xⁿ⁺¹/(n+1) (n ≠ −1)
• 1/x → ln|x|
• 1/√x → 2√x
• eˣ → eˣ
• sin x → −cos x
• cos x → sin x

Regeln
• Summenregel und Faktorregel (Konstanten bleiben stehen)
• Lineare Verkettung: f(ax + b) hat die Stammfunktion (1/a)·F(ax + b)
  z.B. e^(2x−1) → ½·e^(2x−1), (3x+1)⁴ → (1/15)·(3x+1)⁵

Tipp
• Immer durch Ableiten kontrollieren!
• Brüche wie 4/x² vorher als 4·x⁻² schreiben.

Fallstricke
• 1/x² ist nicht ln: 1/x² = x⁻² → −x⁻¹ = −1/x
• Bei linearer Verkettung den Faktor 1/a nicht vergessen.`, k:[
{q:"Bestimme eine Stammfunktion von f(x) = 3x² − 4/x² + 2.", a:"f(x) = 3x² − 4x⁻² + 2\nF(x) = x³ + 4x⁻¹ + 2x = x³ + 4/x + 2x\nProbe: F'(x) = 3x² − 4/x² + 2 ✓"},
{q:"Bestimme eine Stammfunktion von f(x) = e^(2x−1).", a:"Lineare Verkettung mit a = 2: F(x) = ½·e^(2x−1)"},
{q:"Berechne ∫[0;1] (x + 1)³ dx.", a:"[¼(x + 1)⁴]₀¹ = ¼·16 − ¼·1 = 15/4 = 3,75"},
{q:"Berechne ∫[1;e] 2/x dx.", a:"[2·ln x]₁ᵉ = 2·1 − 2·0 = 2"}]},

{t:"Flächeninhaltsberechnungen mit dem Integral", s:`Kurzüberblick
Für echte Flächeninhalte dürfen sich Teile ober- und unterhalb der x-Achse nicht gegenseitig aufheben. Deshalb wird abschnittsweise integriert.

Fläche zwischen Graph und x-Achse
1. Nullstellen von f im Intervall bestimmen.
2. Zwischen benachbarten Nullstellen einzeln integrieren.
3. Beträge der Teilergebnisse addieren.

Fläche zwischen zwei Graphen
1. Schnittstellen bestimmen: f(x) = g(x).
2. Auf jedem Abschnitt A = |∫ (f(x) − g(x)) dx|.
3. Teilflächen addieren.
• Liegt f überall oberhalb von g, gilt direkt A = ∫ (f − g) dx. Die Lage zur x-Achse spielt dabei keine Rolle.

Tipps
• Immer eine Skizze machen.
• Symmetrie nutzen: Fläche einer Hälfte berechnen und verdoppeln.

Fallstricke
• Über eine Nullstelle hinweg integrieren liefert die Bilanz, nicht die Fläche.`, k:[
{q:"Berechne den Inhalt der Fläche, die der Graph von f(x) = x² − 4x mit der x-Achse einschließt.", a:"Nullstellen: x(x − 4) = 0 → x = 0, x = 4\n∫[0;4] (x² − 4x) dx = [x³/3 − 2x²]₀⁴ = 64/3 − 32 = −32/3\nFlächeninhalt: 32/3 ≈ 10,67 FE"},
{q:"Berechne den Inhalt der Fläche zwischen den Graphen von f(x) = x² und g(x) = 2x.", a:"Schnittstellen: x² = 2x → x = 0, x = 2. Dazwischen liegt g oberhalb.\nA = ∫[0;2] (2x − x²) dx = [x² − x³/3]₀² = 4 − 8/3 = 4/3 FE"},
{q:"Der Graph von f(x) = x³ − x schließt mit der x-Achse zwei Flächenstücke ein. Berechne deren Gesamtinhalt und erkläre, warum ∫[−1;1] f(x) dx nicht das richtige Ergebnis liefert.", a:"Nullstellen: −1, 0, 1.\n∫[0;1] (x³ − x) dx = [x⁴/4 − x²/2]₀¹ = −¼ → Fläche ¼\nWegen Punktsymmetrie ist die zweite Fläche ebenfalls ¼, gesamt ½ FE.\n∫[−1;1] f(x) dx = 0, weil sich die Flächen in der Bilanz aufheben."}]},

{t:"Uneigentliche Integrale", s:`Kurzüberblick
Ein Integral heißt uneigentlich, wenn man es nicht einfach mit F(b) − F(a) ausrechnen kann, weil an einer Grenze „etwas Unendliches“ passiert. Trotzdem kann die Fläche einen endlichen Inhalt haben.

Zwei Arten von uneigentlichen Integralen
• Typ 1 – unendliche Grenze: z.B. ∫[1;∞] 1/x² dx. Die Fläche ist nach rechts (oder links) unbegrenzt.
• Typ 2 – Definitionslücke an einer Grenze: z.B. ∫[0;1] 1/√x dx. Bei x = 0 ist 1/√x nicht definiert und wird beliebig groß – die Fläche ist nach oben unbegrenzt.
• In beiden Fällen darf man die Grenze nicht direkt einsetzen: ∞ ist keine Zahl, und bei x = 0 würde man durch 0 teilen.

Problematische Grenze erkennen
• Steht ∞ oder −∞ als Grenze, ist diese Grenze immer problematisch.
• Sonst beide Grenzen gedanklich in den Integranden f(x) einsetzen und prüfen:
  Wird ein Nenner 0? (z.B. 1/x bei x = 0, 1/(x − 2)² bei x = 2)
  Wurzel aus einer negativen Zahl? Logarithmus von 0 oder einer negativen Zahl? (z.B. ln x bei x = 0)
• Faustregel: Kommt beim Einsetzen „durch 0 teilen“ oder ein nicht definierter Ausdruck heraus, ist genau diese Grenze problematisch.
• Liegt so eine Stelle mitten im Intervall (z.B. ∫[−1;1] 1/x² dx mit Problemstelle 0), musst du das Integral dort in zwei Teile zerlegen.

Vorgehen
1. Problematische Grenze durch eine Variable z ersetzen (∞ → z bzw. Problemstelle → z).
2. Ganz normal mit dem Hauptsatz rechnen: F(z) − F(a) bzw. F(b) − F(z).
3. Grenzwert bilden: z → ∞ (Typ 1) bzw. z → Problemstelle, und zwar von der Seite, auf der das Intervall liegt (z.B. z → 0 mit z > 0).
4. Kommt eine Zahl heraus, hat die Fläche diesen endlichen Inhalt (das Integral „konvergiert“). Kommt ∞ heraus, existiert das uneigentliche Integral nicht (es „divergiert“).

Merkregeln für Grenzwerte
• Zahl geteilt durch etwas, das gegen ∞ geht, ergibt 0: 1/z → 0, 5/z² → 0, 3/√z → 0 für z → ∞.
  Kurz: Was im Nenner unendlich groß wird, macht den Bruch null.
• Zahl geteilt durch etwas, das gegen 0 geht (positiv), wird unendlich groß: 1/z → ∞ für z → 0 (z > 0).
• Positive Potenzen: zʳ → ∞ für z → ∞, aber zʳ → 0 für z → 0 (r > 0), z.B. √z → 0.
• e-Funktion: e^(−z) = 1/eᶻ → 0 für z → ∞, während eᶻ → ∞.
• Logarithmus: ln z → ∞ für z → ∞ (sehr langsam), ln z → −∞ für z → 0.
• Konstanten bleiben stehen: ½ − 1/(2z²) → ½ − 0 = ½.

Woher kommen die Merkwerte?
• Für ∫[1;∞] 1/xʳ dx mit r ≠ 1 ist eine Stammfunktion x^(1−r)/(1−r).
• Ist r > 1, ist der Exponent 1 − r negativ. Dann ist x^(1−r) = 1/x^(r−1), und das geht nach der Merkregel gegen 0 → Ergebnis endlich, nämlich 1/(r − 1).
• Ist r < 1, ist der Exponent positiv → x^(1−r) → ∞ → Fläche unendlich.
• Ist r = 1, ist die Stammfunktion ln x → ∞ → Fläche unendlich.
• Für ∫[0;1] 1/xʳ dx (z → 0) ist es genau umgekehrt: endlich nur für r < 1.
• Bildlich: Nach rechts bis ∞ muss die Kurve schneller fallen als 1/x. In der Nähe von 0 darf sie langsamer steigen als 1/x.

Fallstricke
• Nie ∞ einfach einsetzen – immer mit z und Grenzwert arbeiten.
• Vorzeichen der Stammfunktion beachten: [−1/x]₁ᶻ = −1/z − (−1) = 1 − 1/z.
• Eine Kurve, die gegen 0 geht, garantiert noch keine endliche Fläche – 1/x ist das wichtigste Gegenbeispiel.`, k:[
{q:"Berechne ∫[1;∞] 1/x² dx.", a:"∫[1;z] x⁻² dx = [−1/x]₁ᶻ = 1 − 1/z\nFür z → ∞ gilt 1/z → 0, also ergibt sich 1."},
{q:"Berechne ∫[0;1] 1/√x dx.", a:"∫[z;1] x^(−½) dx = [2√x]_z¹ = 2 − 2√z\nFür z → 0 ergibt sich 2."},
{q:"Berechne ∫[0;∞] e^(−x) dx.", a:"[−e^(−x)]₀ᶻ = −e^(−z) + 1\nFür z → ∞ gilt e^(−z) → 0, also ergibt sich 1."},
{q:"Zeige, dass die Fläche unter dem Graphen von f(x) = 1/x für x ≥ 1 keinen endlichen Inhalt hat.", a:"∫[1;z] 1/x dx = ln z − ln 1 = ln z\nFür z → ∞ gilt ln z → ∞. Das uneigentliche Integral existiert nicht."}]},

{t:"Das Integral als Gesamtänderung einer Größe", s:`Kurzüberblick
Beschreibt f die Änderungsrate einer Größe (Zuflussrate, Geschwindigkeit, Wachstumsrate), dann liefert das Integral die Gesamtänderung dieser Größe. Damit rekonstruiert man Bestände.

Kernwissen
• Gesamtänderung von a bis b: ∫[a;b] f(t) dt
• Bestand: B(b) = B(a) + ∫[a;b] f(t) dt
• Einheit: Einheit der Rate × Einheit der Zeit (z.B. m³/h · h = m³)
• Rate positiv → Bestand nimmt zu; Rate negativ → Bestand nimmt ab
• Bestand maximal, wo die Rate von + nach − wechselt (oder am Rand)
• Mittlere Rate: 1/(b − a) · ∫[a;b] f(t) dt

Typische Abituraufgaben
• Wasserstand, Füllmenge, zurückgelegter Weg
• Bedeutung eines Integrals im Sachzusammenhang erklären (mit Einheit!)

Fallstricke
• Anfangsbestand nicht vergessen.
• Rate und Bestand nicht verwechseln: Ein Maximum der Rate ist nicht das Maximum des Bestands.`, k:[
{q:"Die Zuflussrate in ein Becken ist r(t) = −0,5t² + 4t (t in h, r in m³/h, 0 ≤ t ≤ 8). Zu Beginn sind 10 m³ Wasser im Becken. Berechne die Wassermenge nach 6 Stunden.", a:"∫[0;6] (−0,5t² + 4t) dt = [−t³/6 + 2t²]₀⁶ = −36 + 72 = 36\nWassermenge: 10 + 36 = 46 m³"},
{q:"Ein Körper bewegt sich mit der Geschwindigkeit v(t) = 3t² (t in s, v in m/s). Welchen Weg legt er in den ersten 4 Sekunden zurück?", a:"∫[0;4] 3t² dt = [t³]₀⁴ = 64 m"},
{q:"Begründe für das Becken aus Aufgabe 1, zu welchem Zeitpunkt im Intervall [0;8] die Wassermenge am größten ist.", a:"r(t) = t·(4 − 0,5t) ≥ 0 für 0 ≤ t ≤ 8. Es fließt also nie Wasser ab, die Menge steigt durchgehend. Sie ist deshalb bei t = 8 am größten."}]},

{t:"Volumen von Rotationskörpern", s:`Kurzüberblick
Rotiert ein Flächenstück um eine Koordinatenachse, entsteht ein Rotationskörper. Sein Volumen lässt sich als Integral über Kreisscheiben berechnen.

Rotation um die x-Achse
• V = π · ∫[a;b] (f(x))² dx

Rotation um die y-Achse
• Funktionsgleichung nach x² auflösen (x² als Term von y).
• V = π · ∫[c;d] x² dy mit den y-Grenzen c und d.
• Beispiel: y = ¼x² → x² = 4y

Tipps
• Grenzen genau bestimmen: Bei Rotation um die y-Achse sind es y-Werte!
• Kontrolle mit bekannten Formeln: Kegel V = ⅓πr²h, Kugel V = (4/3)πr³

Fallstricke
• Quadrat nicht vergessen: (f(x))², nicht f(x).
• Faktor π nicht vergessen.`, k:[
{q:"Der Graph von f(x) = √x über [0;4] rotiert um die x-Achse. Berechne das Volumen.", a:"V = π·∫[0;4] (√x)² dx = π·∫[0;4] x dx = π·[x²/2]₀⁴ = 8π ≈ 25,13 VE"},
{q:"Der Graph von f(x) = ½x² und die Gerade y = 2 schließen ein Flächenstück ein. Es rotiert um die y-Achse. Bestimme das Volumen des Körpers.", a:"Nach x² auflösen: y = ½x² → x² = 2y\nV = π·∫[0;2] 2y dy = π·[y²]₀² = 4π ≈ 12,57 VE"},
{q:"Leite mit f(x) = (r/h)·x über [0;h] die Volumenformel des Kegels her.", a:"V = π·∫[0;h] (r²/h²)·x² dx = π·(r²/h²)·[x³/3]₀ʰ = π·(r²/h²)·(h³/3) = ⅓πr²h"}]}
]},

{ch:"II Normalverteilung", items:[
{t:"Diskrete und stetige Zufallsgrößen", s:`Kurzüberblick
Diskrete Zufallsgrößen nehmen einzelne Werte an (Augenzahl, Anzahl Treffer). Stetige Zufallsgrößen nehmen beliebige Werte in einem Intervall an (Körpergröße, Wartezeit).

Diskret
• Wahrscheinlichkeitsverteilung, Darstellung als Histogramm
• Erwartungswert: E(X) = μ = Σ xᵢ·P(X = xᵢ)
• Varianz: Var(X) = Σ (xᵢ − μ)²·P(X = xᵢ), Standardabweichung σ = √Var(X)

Stetig
• Wahrscheinlichkeit = Fläche unter der Dichtefunktion φ
• P(a ≤ X ≤ b) = ∫[a;b] φ(x) dx
• P(X = a) = 0, deshalb ist P(X < b) = P(X ≤ b)
• Bedingungen für eine Dichtefunktion: φ(x) ≥ 0 und Gesamtfläche 1
• Erwartungswert: E(X) = ∫ x·φ(x) dx

Fallstricke
• Bei stetigen Zufallsgrößen nie nach P(X = a) > 0 fragen.
• Ein Funktionswert φ(x) ist keine Wahrscheinlichkeit, nur Flächen sind es.`, k:[
{q:"Für welches k ist f(x) = k·x auf [0;2] (sonst 0) eine Dichtefunktion? Berechne dann P(X ≤ 1).", a:"∫[0;2] kx dx = k·[x²/2]₀² = 2k = 1 → k = 0,5 (und f ≥ 0 ✓)\nP(X ≤ 1) = ∫[0;1] 0,5x dx = [x²/4]₀¹ = 0,25"},
{q:"Berechne den Erwartungswert der Zufallsgröße aus Aufgabe 1.", a:"E(X) = ∫[0;2] x·0,5x dx = [x³/6]₀² = 8/6 = 4/3 ≈ 1,33"},
{q:"Bei einem Glücksrad gewinnt man 0 € (p = 0,5), 2 € (p = 0,3) oder 5 € (p = 0,2). Berechne Erwartungswert und Standardabweichung des Gewinns.", a:"E(X) = 0·0,5 + 2·0,3 + 5·0,2 = 1,6 €\nVar(X) = 1,6²·0,5 + 0,4²·0,3 + 3,4²·0,2 = 1,28 + 0,048 + 2,312 = 3,64\nσ = √3,64 ≈ 1,91 €"}]},

{t:"Die Analysis der Gauß'schen Glockenfunktion", s:`Kurzüberblick
Die Dichtefunktion der Normalverteilung ist die Gauß'sche Glockenfunktion. Ihre Form hängt nur von μ und σ ab.

Funktionsterm
• φ(x) = 1/(σ·√(2π)) · e^(−(x−μ)²/(2σ²))
• Standardnormalverteilung (μ = 0, σ = 1): φ(x) = 1/√(2π) · e^(−x²/2)

Eigenschaften
• Symmetrisch zur Geraden x = μ
• Hochpunkt bei x = μ mit Höhe 1/(σ·√(2π)) ≈ 0,4/σ
• Wendestellen bei x = μ − σ und x = μ + σ
• x-Achse ist waagrechte Asymptote
• Fläche unter dem Graphen: 1
• Größeres σ: Glocke breiter und flacher. Größeres μ: Glocke nach rechts verschoben.

Typische Abituraufgaben
• μ und σ aus einem Graphen ablesen (Hochpunkt, Wendestellen).
• Skizzieren, wie sich der Graph bei anderem σ verändert.`, k:[
{q:"Gegeben ist g(x) = e^(−x²/2). Zeige mit der Ableitung, dass der Graph nur bei x = 0 einen Hochpunkt hat.", a:"g'(x) = −x·e^(−x²/2). Da e^(...) > 0, ist g'(x) = 0 nur für x = 0.\nFür x < 0 ist g' > 0, für x > 0 ist g' < 0 → Vorzeichenwechsel + nach − → Hochpunkt."},
{q:"Bestimme die Wendestellen von g(x) = e^(−x²/2).", a:"g''(x) = −e^(−x²/2) + x²·e^(−x²/2) = (x² − 1)·e^(−x²/2)\ng''(x) = 0 → x = ±1, jeweils mit Vorzeichenwechsel → Wendestellen x = −1 und x = 1."},
{q:"Der Graph einer Dichtefunktion einer normalverteilten Zufallsgröße hat seinen Hochpunkt bei (8 | 0,2). Bestimme μ und σ näherungsweise und gib die Wendestellen an.", a:"μ = 8 (Lage des Hochpunkts)\n1/(σ·√(2π)) = 0,2 → σ = 1/(0,2·√(2π)) ≈ 2\nWendestellen: μ ± σ → x ≈ 6 und x ≈ 10"},
{q:"Eine Zufallsgröße B hat denselben Erwartungswert wie A, aber eine größere Standardabweichung. Beschreibe, wie sich der Graph der Dichtefunktion von B von dem von A unterscheidet.", a:"Der Hochpunkt liegt an derselben Stelle x = μ, aber niedriger. Die Glocke ist breiter und flacher, die Wendestellen liegen weiter außen. Die Gesamtfläche bleibt 1."}]},

{t:"Normalverteilung", s:`Kurzüberblick
Viele Messgrößen (Körpergröße, Füllmengen, Messfehler) sind annähernd normalverteilt. Wahrscheinlichkeiten sind Flächen unter der Glockenkurve.

Berechnung
• P(a ≤ X ≤ b) = ∫[a;b] φ(x) dx, in der Praxis mit Tabelle oder Taschenrechner
• Standardisieren: z = (x − μ)/σ
• P(X ≤ b) = Φ((b − μ)/σ), wobei Φ die Verteilungsfunktion der Standardnormalverteilung ist
• P(a ≤ X ≤ b) = Φ((b−μ)/σ) − Φ((a−μ)/σ)
• Symmetrie: Φ(−z) = 1 − Φ(z)
• P(X > b) = 1 − P(X ≤ b)

Näherung der Binomialverteilung
• μ = n·p, σ = √(n·p·(1−p))
• Brauchbar, wenn σ > 3 (Laplace-Bedingung)

Fallstricke
• Erst standardisieren, dann in der Tabelle nachschlagen.
• Bei "mehr als" an die Gegenwahrscheinlichkeit denken.`, k:[
{q:"Die Körpergröße erwachsener Männer ist normalverteilt mit μ = 176 cm und σ = 7 cm. Berechne die Wahrscheinlichkeit, dass ein zufällig gewählter Mann größer als 190 cm ist.", a:"z = (190 − 176)/7 = 2\nP(X > 190) = 1 − Φ(2) = 1 − 0,9772 = 0,0228 ≈ 2,3 %"},
{q:"Berechne für die Situation aus Aufgabe 1 P(169 ≤ X ≤ 183).", a:"z-Werte: −1 und 1\nP = Φ(1) − Φ(−1) = 2·Φ(1) − 1 = 2·0,8413 − 1 ≈ 0,683 = 68,3 %"},
{q:"Welche Körpergröße wird in Aufgabe 1 nur von 10 % der Männer überschritten?", a:"Gesucht ist z mit Φ(z) = 0,9 → z ≈ 1,28\nx = 176 + 1,28·7 ≈ 185 cm"}]},

{t:"Die Sigma-Regeln", s:`Kurzüberblick
Für normalverteilte Zufallsgrößen liegt ein fester Anteil der Werte in symmetrischen Intervallen um μ. Diese Sigma-Regeln ermöglichen schnelle Abschätzungen.

Sigma-Regeln
• P(μ − σ ≤ X ≤ μ + σ) ≈ 68,3 %
• P(μ − 2σ ≤ X ≤ μ + 2σ) ≈ 95,4 %
• P(μ − 3σ ≤ X ≤ μ + 3σ) ≈ 99,7 %

Umgekehrt (Intervall zu vorgegebener Wahrscheinlichkeit)
• 90 %: μ ± 1,64σ
• 95 %: μ ± 1,96σ
• 99 %: μ ± 2,58σ

Anwendung
• Gelten exakt für die Normalverteilung, näherungsweise für die Binomialverteilung bei σ > 3.
• Prognoseintervalle: In welchem Bereich liegt das Ergebnis mit 95 % Wahrscheinlichkeit?

Typische Abituraufgabe
• Ist P(μ − σ ≤ X ≤ μ + σ) ≈ 68 % gegeben, lässt sich σ direkt ablesen. Wegen der Symmetrie liegt der Rest je zur Hälfte links und rechts.`, k:[
{q:"Eine normalverteilte Zufallsgröße A hat μ = 8. Die Wahrscheinlichkeit, dass A im Intervall [6;10] liegt, beträgt etwa 68 %. Berechne P(A > 10).", a:"[6;10] = [μ − σ; μ + σ], also liegen außerhalb etwa 32 %.\nWegen der Symmetrie: P(A > 10) ≈ 32 % : 2 = 16 %"},
{q:"Eine Münze wird 400-mal geworfen. Bestimme das Intervall, in dem die Anzahl der Würfe mit Zahl mit etwa 95 % Wahrscheinlichkeit liegt.", a:"μ = 400·0,5 = 200, σ = √(400·0,5·0,5) = 10 (> 3 ✓)\n200 ± 1,96·10 → [180,4; 219,6]\nAlso zwischen 181 und 219 Würfen mit Zahl."},
{q:"Eine Maschine füllt Packungen mit μ = 500 g und σ = 4 g. In welchem zu μ symmetrischen Intervall liegen etwa 99,7 % der Füllmengen?", a:"μ ± 3σ = 500 ± 12 → [488 g; 512 g]"}]}
]},

{ch:"III Geraden und Ebenen im Raum", items:[
{t:"Lineare Abhängigkeit und Unabhängigkeit", s:`Kurzüberblick
Vektoren heißen linear abhängig, wenn sich einer als Kombination der anderen schreiben lässt. Geometrisch: Sie sind parallel oder liegen in einer Ebene.

Kernwissen
• Linear abhängig: r₁·a⃗₁ + … + rₙ·a⃗ₙ = 0⃗ hat eine Lösung, bei der nicht alle rᵢ = 0 sind.
• Zwei Vektoren abhängig ⇔ einer ist Vielfaches des anderen (kollinear, parallel).
• Drei Vektoren im Raum abhängig ⇔ sie liegen in einer Ebene (komplanar).
• Vier Vektoren im Raum sind immer linear abhängig.

Prüfen
• Zwei Vektoren: Gibt es ein r mit b⃗ = r·a⃗? Alle drei Koordinaten prüfen!
• Drei Vektoren: Ansatz c⃗ = r·a⃗ + s·b⃗ als LGS lösen. Lösbar → abhängig.

Fallstricke
• Beim Vielfachen-Test muss derselbe Faktor in allen Koordinaten passen.`, k:[
{q:"Prüfe, ob a⃗ = (1 | 2 | −1) und b⃗ = (−2 | −4 | 2) linear abhängig sind.", a:"b⃗ = −2·a⃗ (in allen Koordinaten) → linear abhängig, die Vektoren sind parallel."},
{q:"Prüfe, ob a⃗ = (1 | 0 | 2), b⃗ = (0 | 1 | 1) und c⃗ = (2 | 3 | 7) linear abhängig sind.", a:"Ansatz c⃗ = r·a⃗ + s·b⃗:\nx₁: r = 2\nx₂: s = 3\nx₃: 2r + s = 4 + 3 = 7 ✓\nLösbar → linear abhängig (komplanar)."},
{q:"Für welchen Wert von t sind (1 | 1 | 0), (0 | 1 | 1) und (1 | 0 | t) linear abhängig?", a:"Ansatz (1 | 0 | t) = r·(1 | 1 | 0) + s·(0 | 1 | 1):\nr = 1; r + s = 0 → s = −1; t = s = −1\nFür t = −1 sind die Vektoren linear abhängig."}]},

{t:"Parameterform von Geraden", s:`Kurzüberblick
Eine Gerade im Raum wird durch einen Punkt und eine Richtung festgelegt.

Kernwissen
• g: X⃗ = A⃗ + λ·u⃗ (λ ∈ ℝ)
• A: Aufpunkt (Stützpunkt), u⃗: Richtungsvektor (≠ 0⃗)
• Gerade durch A und B: u⃗ = AB⃗ = B⃗ − A⃗
• Strecke [AB]: 0 ≤ λ ≤ 1

Punktprobe
• Punkt einsetzen, jede Koordinatengleichung nach λ auflösen.
• Gleiches λ in allen Zeilen → Punkt liegt auf g.

Spurpunkte
• Schnittpunkte mit den Koordinatenebenen: eine Koordinate = 0 setzen.

Fallstricke
• Eine Gerade hat unendlich viele Parameterdarstellungen. Unterschiedliche Gleichungen können dieselbe Gerade beschreiben.`, k:[
{q:"Gib eine Gleichung der Geraden g durch A(1 | 2 | 0) und B(3 | −1 | 4) an.", a:"u⃗ = B⃗ − A⃗ = (2 | −3 | 4)\ng: X⃗ = (1 | 2 | 0) + λ·(2 | −3 | 4)"},
{q:"Prüfe, ob P(5 | −4 | 8) auf g aus Aufgabe 1 liegt.", a:"1 + 2λ = 5 → λ = 2\n2 − 3·2 = −4 ✓\n0 + 4·2 = 8 ✓\nGleiches λ in allen Zeilen → P liegt auf g."},
{q:"Bestimme die Spurpunkte von g aus Aufgabe 1 mit der x₁x₂-Ebene und mit der x₁x₃-Ebene.", a:"x₁x₂-Ebene (x₃ = 0): 4λ = 0 → λ = 0 → (1 | 2 | 0)\nx₁x₃-Ebene (x₂ = 0): 2 − 3λ = 0 → λ = 2/3 → (7/3 | 0 | 8/3)"}]},

{t:"Gegenseitige Lage von Geraden", s:`Kurzüberblick
Zwei Geraden im Raum können identisch, echt parallel, schneidend oder windschief sein.

Vorgehen
1. Sind die Richtungsvektoren Vielfache voneinander?
   • Ja → Punktprobe mit einem Aufpunkt: liegt er auf der anderen Geraden → identisch, sonst echt parallel.
   • Nein → weiter mit 2.
2. Geradengleichungen gleichsetzen: LGS mit 3 Gleichungen und 2 Unbekannten (λ, μ).
   • Eindeutige Lösung → Geraden schneiden sich, Schnittpunkt durch Einsetzen.
   • Widerspruch → windschief.

Fallstricke
• Für beide Geraden verschiedene Parameter verwenden (λ und μ)!
• Die dritte Gleichung immer zur Kontrolle prüfen.
• Windschief gibt es nur im Raum, nicht in der Ebene.`, k:[
{q:"Untersuche die Lage von g: X⃗ = (1 | 0 | 0) + λ·(1 | 1 | 0) und h: X⃗ = (0 | 1 | 0) + μ·(1 | −1 | 0).", a:"Richtungsvektoren nicht kollinear.\nGleichsetzen: 1 + λ = μ; λ = 1 − μ; 0 = 0\n→ 1 + 1 − μ = μ → μ = 1, λ = 0\nSchnittpunkt S(1 | 0 | 0)"},
{q:"Untersuche die Lage von g: X⃗ = λ·(1 | 0 | 0) und h: X⃗ = (0 | 1 | 0) + μ·(0 | 0 | 1).", a:"Richtungsvektoren nicht kollinear.\nGleichsetzen: λ = 0; 0 = 1 → Widerspruch\nDie Geraden sind windschief."},
{q:"Untersuche die Lage von g: X⃗ = (1 | 2 | 3) + λ·(2 | −1 | 1) und h: X⃗ = (5 | 0 | 5) + μ·(−4 | 2 | −2).", a:"(−4 | 2 | −2) = −2·(2 | −1 | 1) → parallel oder identisch.\nPunktprobe (5 | 0 | 5) in g: 1 + 2λ = 5 → λ = 2; 2 − 2 = 0 ✓; 3 + 2 = 5 ✓\nDie Geraden sind identisch."}]},

{t:"Parameterform von Ebenen", s:`Kurzüberblick
Eine Ebene wird durch einen Punkt und zwei nicht parallele Richtungen festgelegt.

Kernwissen
• E: X⃗ = A⃗ + λ·u⃗ + μ·v⃗
• u⃗, v⃗: Spannvektoren, müssen linear unabhängig sein
• Ebene durch drei Punkte A, B, C: u⃗ = AB⃗, v⃗ = AC⃗
• Die drei Punkte dürfen nicht auf einer Geraden liegen.
• Weitere Möglichkeiten: Gerade + Punkt, zwei sich schneidende oder zwei echt parallele Geraden

Punktprobe
• Punkt einsetzen → LGS mit 3 Gleichungen, 2 Unbekannten
• Lösbar → Punkt liegt in E

Tipp
• Für die meisten Rechnungen (Lage, Abstand, Winkel) ist die Koordinatenform praktischer. Die Parameterform ist oft nur der Zwischenschritt.`, k:[
{q:"Gib eine Parametergleichung der Ebene E durch A(1 | 0 | 0), B(0 | 2 | 0) und C(0 | 0 | 3) an.", a:"AB⃗ = (−1 | 2 | 0), AC⃗ = (−1 | 0 | 3)\nE: X⃗ = (1 | 0 | 0) + λ·(−1 | 2 | 0) + μ·(−1 | 0 | 3)"},
{q:"Prüfe, ob P(0 | 1 | 1,5) in E aus Aufgabe 1 liegt.", a:"x₂: 2λ = 1 → λ = 0,5\nx₃: 3μ = 1,5 → μ = 0,5\nx₁: 1 − 0,5 − 0,5 = 0 ✓\nP liegt in E."},
{q:"Begründe, warum A(1 | 1 | 1), B(2 | 3 | 4) und C(3 | 5 | 7) keine Ebene festlegen.", a:"AB⃗ = (1 | 2 | 3), AC⃗ = (2 | 4 | 6) = 2·AB⃗\nDie Vektoren sind linear abhängig, die Punkte liegen auf einer Geraden."}]},

{t:"Normalen- und Koordinatenform von Ebenen", s:`Kurzüberblick
Statt mit zwei Spannvektoren kann man eine Ebene über einen Vektor beschreiben, der senkrecht auf ihr steht: den Normalenvektor n⃗.

Formen
• Normalenform: n⃗ ∘ (X⃗ − A⃗) = 0
• Koordinatenform: n₁x₁ + n₂x₂ + n₃x₃ = d mit d = n⃗ ∘ A⃗
• Die Koeffizienten der Koordinatenform sind die Koordinaten von n⃗.

Normalenvektor bestimmen
• Vektorprodukt der Spannvektoren: n⃗ = u⃗ × v⃗
  u⃗ × v⃗ = (u₂v₃ − u₃v₂ | u₃v₁ − u₁v₃ | u₁v₂ − u₂v₁)
• Probe: n⃗ ∘ u⃗ = 0 und n⃗ ∘ v⃗ = 0

Spurpunkte (Achsenschnittpunkte)
• Zwei Koordinaten = 0 setzen, z.B. S₁(d/n₁ | 0 | 0)

Besondere Lagen
• Fehlt x₃ → Ebene parallel zur x₃-Achse
• Nur x₃ = c → Ebene parallel zur x₁x₂-Ebene

Fallstricke
• Rechenfehler im Vektorprodukt → immer Probe mit Skalarprodukt!`, k:[
{q:"Bestimme eine Koordinatengleichung der Ebene durch A(1 | 0 | 0), B(0 | 2 | 0) und C(0 | 0 | 3).", a:"u⃗ = (−1 | 2 | 0), v⃗ = (−1 | 0 | 3)\nn⃗ = u⃗ × v⃗ = (2·3 − 0·0 | 0·(−1) − (−1)·3 | (−1)·0 − 2·(−1)) = (6 | 3 | 2)\nd = n⃗ ∘ A⃗ = 6\nE: 6x₁ + 3x₂ + 2x₃ = 6\nProbe B: 6 ✓, C: 6 ✓"},
{q:"Bestimme die Spurpunkte der Ebene E: 2x₁ − x₂ + 4x₃ = 8.", a:"S₁(4 | 0 | 0), S₂(0 | −8 | 0), S₃(0 | 0 | 2)"},
{q:"Beschreibe die besondere Lage der Ebenen E: x₃ = 2 und F: x₁ + x₂ = 4.", a:"E ist parallel zur x₁x₂-Ebene im Abstand 2.\nIn F fehlt x₃, also ist F parallel zur x₃-Achse."}]},

{t:"Gegenseitige Lage von Gerade und Ebene", s:`Kurzüberblick
Eine Gerade kann eine Ebene schneiden, echt parallel zu ihr sein oder in ihr liegen.

Schnelltest mit Koordinatenform
• n⃗ ∘ u⃗ = 0 → Gerade parallel zu E oder in E
  Punktprobe mit dem Aufpunkt: liegt in E → Gerade in E, sonst echt parallel
• n⃗ ∘ u⃗ ≠ 0 → Gerade schneidet E

Schnittpunkt berechnen
1. Koordinaten der Geraden (in Abhängigkeit von λ) in die Koordinatenform einsetzen.
2. Nach λ auflösen.
3. λ in die Geradengleichung einsetzen.

Anwendungen
• Durchstoßpunkt, Spurpunkte
• Schattenpunkt: Lichtstrahl als Gerade durch Lichtquelle L und Objektpunkt S, dann Schnitt mit Wand oder Boden
• Prüfen, ob der Schnittpunkt im relevanten Bereich liegt (z.B. auf der Wandfläche)

Fallstricke
• Beim Schatten: Der Parameter muss größer als beim Objektpunkt sein, der Schatten liegt hinter dem Objekt.`, k:[
{q:"Bestimme den Schnittpunkt von g: X⃗ = λ·(1 | 2 | 3) mit E: x₁ + x₂ + x₃ = 6.", a:"Einsetzen: λ + 2λ + 3λ = 6 → λ = 1\nSchnittpunkt S(1 | 2 | 3)"},
{q:"Untersuche die Lage von g: X⃗ = (1 | 1 | 1) + λ·(1 | −1 | 0) zur Ebene E: x₁ + x₂ + x₃ = 6.", a:"n⃗ ∘ u⃗ = 1 − 1 + 0 = 0 → parallel oder in E\nAufpunkt: 1 + 1 + 1 = 3 ≠ 6\ng ist echt parallel zu E."},
{q:"Eine Lampe befindet sich im Punkt L(2 | 0 | 6), die Spitze eines Gegenstands in S(2 | 3 | 3). Der Boden liegt in der Ebene x₃ = 0. Bestimme den Schattenpunkt der Spitze auf dem Boden.", a:"Lichtstrahl: X⃗ = (2 | 0 | 6) + λ·(0 | 3 | −3)\nBoden: 6 − 3λ = 0 → λ = 2 (> 1, also hinter S ✓)\nSchattenpunkt: (2 | 6 | 0)"}]},

{t:"Gegenseitige Lage von Ebenen", s:`Kurzüberblick
Zwei Ebenen sind identisch, echt parallel oder schneiden sich in einer Schnittgeraden.

Vorgehen mit Koordinatenformen
1. Normalenvektoren kollinear?
   • Ja → Gleichungen auf gleiche Koeffizienten bringen: gleiches d → identisch, sonst echt parallel.
   • Nein → Schnittgerade.
2. Schnittgerade: Beide Gleichungen als LGS, eine Variable als Parameter t setzen, die anderen durch t ausdrücken.

Alternative
• Ist eine Ebene in Parameterform gegeben: in die Koordinatenform der anderen einsetzen, Beziehung zwischen λ und μ bestimmen, zurück einsetzen.

Fallstricke
• Beim Parallelitätstest die ganze Gleichung skalieren, also auch d.`, k:[
{q:"Untersuche die Lage von E: x₁ + 2x₂ − x₃ = 4 und F: 2x₁ + 4x₂ − 2x₃ = 10.", a:"n⃗_F = 2·n⃗_E → parallel oder identisch.\nE·2: 2x₁ + 4x₂ − 2x₃ = 8 ≠ 10\nDie Ebenen sind echt parallel."},
{q:"Bestimme die Schnittgerade von E: x₁ + x₂ + x₃ = 2 und F: x₁ − x₂ = 0.", a:"Aus F: x₁ = x₂ = t\nIn E: t + t + x₃ = 2 → x₃ = 2 − 2t\ns: X⃗ = (0 | 0 | 2) + t·(1 | 1 | −2)"},
{q:"Für welchen Wert von a ist E: a·x₁ + x₂ = 3 parallel zu F: 4x₁ + 2x₂ = 1?", a:"Normalenvektoren (a | 1 | 0) und (4 | 2 | 0) kollinear → a = 2.\nDann E: 2x₁ + x₂ = 3, F: 2x₁ + x₂ = 0,5 → echt parallel."}]},

{t:"Abstandsbestimmungen", s:`Kurzüberblick
Abstände im Raum sind immer kürzeste Entfernungen, also entlang einer Senkrechten (Lot).

Punkt – Punkt
• |AB⃗| = √((b₁−a₁)² + (b₂−a₂)² + (b₃−a₃)²)

Punkt – Ebene (Hesse-Formel)
• E: n₁x₁ + n₂x₂ + n₃x₃ = d
• Abstand von P: |n₁p₁ + n₂p₂ + n₃p₃ − d| / |n⃗|
• Alternativ: Lotgerade P + t·n⃗ mit E schneiden → Lotfußpunkt F, Abstand |PF⃗|

Punkt – Gerade
• Lotfußpunkt F auf g mit PF⃗ ⊥ u⃗, also PF⃗ ∘ u⃗ = 0
• Abstand = |PF⃗|

Parallele Ebenen / Gerade parallel zu Ebene
• Abstand eines beliebigen Punktes der einen zur anderen Ebene

Fallstricke
• Betrag im Zähler der Hesse-Formel nicht vergessen.
• Durch |n⃗| teilen, nicht durch n⃗.`, k:[
{q:"Berechne den Abstand des Punktes P(3 | 1 | 2) von der Ebene E: 2x₁ − x₂ + 2x₃ = 3.", a:"|n⃗| = √(4 + 1 + 4) = 3\nd = |2·3 − 1 + 2·2 − 3| / 3 = |6| / 3 = 2"},
{q:"Bestimme den Lotfußpunkt von P aus Aufgabe 1 auf E.", a:"Lotgerade: X⃗ = (3 | 1 | 2) + t·(2 | −1 | 2)\nIn E: 2(3 + 2t) − (1 − t) + 2(2 + 2t) = 3 → 9 + 9t = 3 → t = −2/3\nF(5/3 | 5/3 | 2/3)\nKontrolle: |t|·|n⃗| = 2/3·3 = 2 ✓"},
{q:"Berechne den Abstand von P(1 | 3 | 0) zur Geraden g: X⃗ = λ·(1 | 1 | 0).", a:"F = (λ | λ | 0), PF⃗ = (λ − 1 | λ − 3 | 0)\nPF⃗ ∘ u⃗ = 2λ − 4 = 0 → λ = 2, F(2 | 2 | 0)\nPF⃗ = (1 | −1 | 0), Abstand √2 ≈ 1,41"}]},

{t:"Schnittwinkel", s:`Kurzüberblick
Winkel im Raum berechnet man mit dem Skalarprodukt. Schnittwinkel liegen immer zwischen 0° und 90°, deshalb mit Betrag.

Formeln
• Winkel zwischen zwei Vektoren: cos φ = (a⃗ ∘ b⃗) / (|a⃗|·|b⃗|)
• Gerade – Gerade: cos α = |u⃗ ∘ v⃗| / (|u⃗|·|v⃗|)
• Ebene – Ebene: cos α = |n⃗₁ ∘ n⃗₂| / (|n⃗₁|·|n⃗₂|)
• Gerade – Ebene: sin α = |u⃗ ∘ n⃗| / (|u⃗|·|n⃗|)  (Achtung: Sinus!)

Orthogonalität
• a⃗ ⊥ b⃗ ⇔ a⃗ ∘ b⃗ = 0
• Rechter Winkel bei B im Dreieck ABC: BA⃗ ∘ BC⃗ = 0

Fallstricke
• Beim Winkel Gerade – Ebene Sinus statt Kosinus.
• Innenwinkel im Dreieck: ohne Betrag rechnen, sie können über 90° liegen.`, k:[
{q:"Berechne den Schnittwinkel zweier Geraden mit den Richtungsvektoren u⃗ = (1 | 0 | 0) und v⃗ = (1 | 1 | 0).", a:"cos α = |1| / (1·√2) = 1/√2 → α = 45°"},
{q:"Berechne den Winkel zwischen einer Geraden mit Richtungsvektor u⃗ = (0 | 0 | 1) und der Ebene E: x₁ + x₂ + x₃ = 1.", a:"n⃗ = (1 | 1 | 1)\nsin α = |1| / (1·√3) = 1/√3 → α ≈ 35,3°"},
{q:"Berechne den Schnittwinkel der Ebenen E: x₃ = 0 und F: x₁ + x₃ = 0.", a:"n⃗_E = (0 | 0 | 1), n⃗_F = (1 | 0 | 1)\ncos α = 1 / (1·√2) → α = 45°"},
{q:"Der Punkt T liegt auf der Strecke von A(0 | 0 | 0) nach C(2 | 2 | 0). Das Dreieck ABT mit B(2 | 0 | 0) hat bei T einen rechten Winkel. Bestimme T.", a:"T = (2s | 2s | 0) mit 0 ≤ s ≤ 1\nTA⃗ = (−2s | −2s | 0), TB⃗ = (2 − 2s | −2s | 0)\nTA⃗ ∘ TB⃗ = −2s(2 − 2s) + 4s² = −4s + 8s² = 0 → s = 0,5 (s = 0 ergäbe T = A)\nT(1 | 1 | 0)"}]},

{t:"Kugeln", s:`Kurzüberblick
Eine Kugel ist die Menge aller Punkte mit festem Abstand r von einem Mittelpunkt M.

Kugelgleichung
• (x₁ − m₁)² + (x₂ − m₂)² + (x₃ − m₃)² = r²
• Vektoriell: (X⃗ − M⃗)² = r²

Lage eines Punktes
• |MP⃗| < r → innen, = r → auf der Kugel, > r → außen

Kugel und Ebene
• Abstand d von M zur Ebene vergleichen:
  d < r → Schnittkreis mit Radius √(r² − d²), Mittelpunkt = Lotfußpunkt von M
  d = r → Tangentialebene (Berührpunkt)
  d > r → kein gemeinsamer Punkt

Tangentialebene im Kugelpunkt B
• Normalenvektor n⃗ = MB⃗, Ebene geht durch B

Kugel und Gerade
• Gerade einsetzen → quadratische Gleichung in λ: 2, 1 oder 0 Lösungen (Sekante, Tangente, Passante)`, k:[
{q:"Gegeben ist die Kugel K mit Mittelpunkt M(1 | 2 | 3) und Radius 3. Prüfe, ob P(3 | 3 | 5) auf K liegt.", a:"MP⃗ = (2 | 1 | 2), |MP⃗| = √(4 + 1 + 4) = 3 = r → P liegt auf K."},
{q:"Bestimme eine Gleichung der Tangentialebene an K aus Aufgabe 1 im Punkt P.", a:"n⃗ = MP⃗ = (2 | 1 | 2)\n2x₁ + x₂ + 2x₃ = 2·3 + 3 + 2·5 = 19"},
{q:"Untersuche, ob die Ebene x₃ = 1 die Kugel K aus Aufgabe 1 schneidet, und bestimme gegebenenfalls Mittelpunkt und Radius des Schnittkreises.", a:"Abstand von M zur Ebene: |3 − 1| = 2 < 3 → Schnittkreis\nRadius: √(9 − 4) = √5 ≈ 2,24\nMittelpunkt: (1 | 2 | 1)"}]}
]},

{ch:"IV Anwendungen der Differential- und Integralrechnung", items:[
{t:"Untersuchung verknüpfter Funktionen, Parameter", s:`Kurzüberblick
Im Abitur werden oft zusammengesetzte Funktionen untersucht, z.B. x·e⁻ˣ, (ln x)² oder Funktionenscharen mit einem Parameter k.

Ableitungsregeln
• Produktregel: (u·v)' = u'·v + u·v'
• Quotientenregel: (u/v)' = (u'·v − u·v') / v²
• Kettenregel: (f(g(x)))' = f'(g(x))·g'(x)
• Wichtig: (eˣ)' = eˣ, (ln x)' = 1/x, (e^(g(x)))' = g'(x)·e^(g(x))

Untersuchungsschritte
• Definitionsmenge (ln x nur für x > 0)
• Symmetrie: f(−x) = f(x) achsensymmetrisch; f(−x) = −f(x) punktsymmetrisch
• Nullstellen: Produkt ist null, wenn ein Faktor null ist (eˣ ist nie null!)
• Grenzverhalten: eˣ wächst schneller als jede Potenz, ln x langsamer
• Extrempunkte: f'(x) = 0 und Vorzeichenwechsel bzw. f''
• Wendepunkte: f''(x) = 0 mit Vorzeichenwechsel; Bedeutung: Krümmungswechsel

Funktionenscharen
• Parameter wie eine feste Zahl behandeln
• Ortskurve: Extrempunkte (x | y) bestimmen, x nach Parameter auflösen und in y einsetzen

Symmetrie verknüpfter Funktionen
• f achsensymmetrisch, g punktsymmetrisch → f·g punktsymmetrisch, g² achsensymmetrisch`, k:[
{q:"Untersuche f(x) = x·e^(−x) auf Extrempunkte und gib das Verhalten für x → ∞ an.", a:"f'(x) = e^(−x) − x·e^(−x) = (1 − x)·e^(−x) = 0 → x = 1\nf''(x) = (x − 2)·e^(−x), f''(1) = −1/e < 0 → Hochpunkt H(1 | 1/e)\nFür x → ∞: f(x) → 0, weil e^(−x) schneller gegen 0 geht als x wächst."},
{q:"Gegeben ist f(x) = (ln x)² für x > 0. Bestimme eine Gleichung der Tangente an den Graphen im Punkt P(e | 1).", a:"Kettenregel: f'(x) = 2·ln x · (1/x)\nf'(e) = 2·1/e = 2/e\nt: y = (2/e)(x − e) + 1 = (2/e)·x − 1"},
{q:"Gegeben ist die Schar fₖ(x) = x² − 2kx. Bestimme den Tiefpunkt in Abhängigkeit von k und die Ortskurve der Tiefpunkte.", a:"fₖ'(x) = 2x − 2k = 0 → x = k; fₖ''(x) = 2 > 0\nT(k | −k²)\nOrtskurve: x = k → y = −x²"},
{q:"f ist achsensymmetrisch zur y-Achse, g punktsymmetrisch zum Ursprung. Untersuche h(x) = f(x)·(g(x))² auf Symmetrie.", a:"h(−x) = f(−x)·(g(−x))² = f(x)·(−g(x))² = f(x)·(g(x))² = h(x)\nDer Graph von h ist achsensymmetrisch zur y-Achse."}]},

{t:"Funktionsbestimmungen", s:`Kurzüberblick
Bei Funktionsbestimmungen (Steckbriefaufgaben) sucht man einen Funktionsterm, der vorgegebene Eigenschaften erfüllt.

Vorgehen
1. Ansatz mit allgemeinem Term, z.B. ganzrational 3. Grades: f(x) = ax³ + bx² + cx + d
2. Eigenschaften in Gleichungen übersetzen
3. LGS lösen
4. Probe, insbesondere hinreichende Bedingung bei Extrem- und Wendepunkten

Übersetzungshilfe
• Punkt P(x₀ | y₀) auf dem Graphen: f(x₀) = y₀
• Extremstelle bei x₀: f'(x₀) = 0
• Wendestelle bei x₀: f''(x₀) = 0
• Steigung m bei x₀: f'(x₀) = m
• Berührt die x-Achse bei x₀: f(x₀) = 0 und f'(x₀) = 0

Symmetrie spart Arbeit
• Achsensymmetrisch zur y-Achse: nur gerade Exponenten (ax⁴ + bx² + c)
• Punktsymmetrisch zum Ursprung: nur ungerade Exponenten (ax³ + cx)

Fallstricke
• Pro Unbekannte braucht man eine Bedingung.
• Ein Extrempunkt liefert zwei Bedingungen (Funktionswert und Ableitung).`, k:[
{q:"Bestimme die Parabel durch die Punkte (0 | 1), (1 | 0) und (2 | 1).", a:"Ansatz f(x) = ax² + bx + c\nf(0) = 1 → c = 1\nf(1) = 0 → a + b + 1 = 0\nf(2) = 1 → 4a + 2b + 1 = 1 → b = −2a\n→ a − 2a + 1 = 0 → a = 1, b = −2\nf(x) = x² − 2x + 1 = (x − 1)²"},
{q:"Bestimme die ganzrationale Funktion 3. Grades, deren Graph punktsymmetrisch zum Ursprung ist und den Hochpunkt H(1 | 2) hat.", a:"Ansatz f(x) = ax³ + cx\nf(1) = 2: a + c = 2\nf'(1) = 0: 3a + c = 0\n→ 2a = −2 → a = −1, c = 3\nf(x) = −x³ + 3x\nProbe: f''(1) = −6 < 0 → Hochpunkt ✓"},
{q:"Gegeben ist f(x) = x⁴ − kx² mit k > 0. Die beiden Tiefpunkte des Graphen haben die y-Koordinate −4. Ermittle k.", a:"f'(x) = 4x³ − 2kx = 2x(2x² − k) = 0 → x = 0 oder x² = k/2\nTiefpunkte bei x² = k/2: f = (k/2)² − k·(k/2) = k²/4 − k²/2 = −k²/4\n−k²/4 = −4 → k² = 16 → k = 4 (da k > 0)"}]},

{t:"Extremwertprobleme", s:`Kurzüberblick
Bei Extremwertproblemen wird eine Größe (Fläche, Volumen, Kosten, Abstand) maximiert oder minimiert.

Vorgehen
1. Skizze und Variablen festlegen
2. Hauptbedingung: Zielgröße als Formel
3. Nebenbedingung: Zusammenhang der Variablen, damit nur eine Variable übrig bleibt
4. Zielfunktion aufstellen und Definitionsbereich angeben
5. Ableitung null setzen
6. Art des Extremums prüfen und Randwerte vergleichen
7. Antwortsatz mit allen gesuchten Größen

Typische Situationen
• Rechteck unter einem Graphen
• Dose mit minimaler Oberfläche
• Punkt auf einem Graphen mit kleinstem Abstand zu einem anderen Punkt
  Tipp: Statt d das Quadrat d² minimieren, die Wurzel fällt weg.

Fallstricke
• Randwerte vergessen: Das globale Extremum kann am Rand liegen.
• Definitionsbereich aus dem Sachzusammenhang (Längen > 0) beachten.`, k:[
{q:"Ein Rechteck hat den Umfang 20 cm. Für welche Seitenlängen ist sein Flächeninhalt maximal?", a:"2x + 2y = 20 → y = 10 − x\nA(x) = x(10 − x) = 10x − x², 0 < x < 10\nA'(x) = 10 − 2x = 0 → x = 5; A''(x) = −2 < 0 → Maximum\nQuadrat mit 5 cm Seitenlänge, A = 25 cm²"},
{q:"Einem Flächenstück zwischen dem Graphen von f(x) = 4 − x² und der x-Achse wird ein zur y-Achse symmetrisches Rechteck einbeschrieben. Zwei Ecken liegen auf der x-Achse, zwei auf dem Graphen. Bestimme den maximalen Flächeninhalt.", a:"Ecke bei (u | f(u)), 0 < u < 2\nA(u) = 2u·(4 − u²) = 8u − 2u³\nA'(u) = 8 − 6u² = 0 → u = 2/√3 ≈ 1,15; A''(u) = −12u < 0 → Maximum\nA = 2·(2/√3)·(4 − 4/3) = 32/(3√3) ≈ 6,16 FE"},
{q:"Bestimme den Punkt auf dem Graphen von f(x) = √x, der vom Punkt Q(2 | 0) den kleinsten Abstand hat.", a:"d²(x) = (x − 2)² + (√x)² = x² − 3x + 4\n(d²)' = 2x − 3 = 0 → x = 1,5; zweite Ableitung 2 > 0 → Minimum\nP(1,5 | √1,5) ≈ (1,5 | 1,22), Abstand √1,75 ≈ 1,32"}]},

{t:"Differential- und Integralrechnung in Sachzusammenhängen", s:`Kurzüberblick
Im Abitur musst du mathematische Ergebnisse im Sachzusammenhang deuten. Entscheidend ist, was Funktion, Ableitung und Integral jeweils bedeuten.

Bedeutungen
• f(t): Bestand oder Größe zum Zeitpunkt t
• f'(t): momentane Änderungsrate (Geschwindigkeit, Wachstumsrate)
• Extremstelle von f: größter/kleinster Wert der Größe
• Wendestelle von f: stärkste Zu- oder Abnahme
• ∫[a;b] f'(t) dt: Gesamtänderung von a bis b
• 1/(b − a)·∫[a;b] f(t) dt: Mittelwert von f im Zeitraum

Wichtige Modelle
• Exponentielles Wachstum: f(t) = a·e^(kt), Verdopplungszeit ln 2 / k
• Exponentielle Abnahme: f(t) = a·e^(−kt), Halbwertszeit ln 2 / k

"Hypothesentest":{s:"Ein Verein gibt an, dass mindestens 70 % seiner Mitglieder ein neues Projekt unterstützen. Der Vorstand vermutet, dass der Anteil geringer ist, und befragt 100 zufällig ausgewählte Mitglieder. Die Nullhypothese „Der Anteil beträgt mindestens 70 %“ soll auf einem Signifikanzniveau von 5 % getestet werden.\nVerwenden Sie: für p = 0,7: P(X ≤ 61) = 0,0340; P(X ≤ 62) = 0,0530 — für p = 0,6: P(X ≥ 62) = 0,3822",p:[

 ["Berechnen Sie den Inhalt der Fläche, die die Graphen von f und g einschließen.",4,"Auf [0; √3] liegt g oberhalb: g − f = 3x − x³\n∫[0;√3] (3x − x³) dx = [1,5x² − x⁴/4]₀^√3 = 4,5 − 2,25 = 2,25\nSymmetrie → Gesamtfläche 4,5 FE"]]},
"Uneigentliche Integrale":{s:"Gegeben ist f(x) = 4/(x + 1)² für x ≥ 0.",p:[
 ["Zeigen Sie, dass die nach rechts unbegrenzte Fläche zwischen dem Graphen von f und der x-Achse für x ≥ 0 einen endlichen Inhalt hat, und berechnen Sie ihn.",3,"∫[0;z] 4/(x + 1)² dx = [−4/(x + 1)]₀ᶻ = 4 − 4/(z + 1) → 4 für z → ∞"],
 ["Zeigen Sie, dass dies für g(x) = 1/(x + 1) nicht gilt.",2,"∫[0;z] 1/(x + 1) dx = ln(z + 1) → ∞ für z → ∞"],
 ["Bestimmen Sie b so, dass ∫[0;b] f(x) dx = 3 gilt, und deuten Sie das Ergebnis.",3,"4 − 4/(b + 1) = 3 → b + 1 = 4 → b = 3\n75 % der unbegrenzten Fläche liegen über dem Intervall [0; 3]."]]},
"Das Integral als Gesamtänderung einer Größe":{s:"In einem Behälter befinden sich zu Beginn 50 Liter Wasser. Die Funktion r mit r(t) = 3t² − 18t + 24 beschreibt für 0 ≤ t ≤ 5 die momentane Zu- bzw. Abflussrate in Liter pro Minute (t in Minuten).",p:[
 ["Geben Sie an, in welchem Zeitraum die Wassermenge abnimmt.",2,"r(t) = 3(t − 2)(t − 4) < 0 für 2 < t < 4 → Abnahme zwischen der 2. und 4. Minute"],
 ["Berechnen Sie die Wassermenge nach 2 Minuten.",3,"∫[0;2] r(t) dt = [t³ − 9t² + 24t]₀² = 20 → 50 + 20 = 70 Liter"],
 ["Zeigen Sie, dass die Wassermenge im Zeitraum 0 ≤ t ≤ 5 zu zwei verschiedenen Zeitpunkten ihren größten Wert annimmt.",4,"Kandidaten: lokales Maximum bei t = 2 (r wechselt + nach −) und Rand t = 5\nW(2) = 70; W(5) = 50 + [t³ − 9t² + 24t]₀⁵ = 50 + 20 = 70\n(W(0) = 50, W(4) = 66) → Maximum 70 Liter bei t = 2 und t = 5"],
 ["Berechnen Sie die mittlere Änderungsrate der Wassermenge in den ersten 5 Minuten.",2,"20 Liter / 5 min = 4 Liter pro Minute"]]},
"Volumen von Rotationskörpern":{s:"Gegeben ist f(x) = 2·e^(−0,5x) für x ≥ 0.",p:[
 ["Der Graph von f rotiert im Bereich 0 ≤ x ≤ 4 um die x-Achse. Berechnen Sie das Volumen des entstehenden Körpers.",3,"V = π·∫[0;4] 4·e^(−x) dx = 4π·[−e^(−x)]₀⁴ = 4π(1 − e^(−4)) ≈ 12,34 VE"],
 ["Zeigen Sie, dass das Volumen auch bei Rotation des gesamten Graphen (x ≥ 0) endlich bleibt.",3,"V(z) = 4π(1 − e^(−z)) → 4π ≈ 12,57 VE für z → ∞"],
 ["Das Flächenstück zwischen dem Graphen von h(x) = x², der y-Achse und der Geraden y = 4 (x ≥ 0) rotiert um die y-Achse. Berechnen Sie das Volumen.",3,"x² = y → V = π·∫[0;4] y dy = π·8 = 8π ≈ 25,13 VE"]]},
"Diskrete und stetige Zufallsgrößen":{s:"Die Zufallsgröße X hat die Dichtefunktion f mit f(x) = k·x·(4 − x) für 0 ≤ x ≤ 4 und f(x) = 0 sonst.",p:[
 ["Bestimmen Sie den Wert von k.",3,"∫[0;4] kx(4 − x) dx = k·[2x² − x³/3]₀⁴ = k·32/3 = 1 → k = 3/32"],
 ["Berechnen Sie P(X ≤ 1).",2,"3/32·[2x² − x³/3]₀¹ = 3/32·5/3 = 5/32 ≈ 0,156"],
 ["Begründen Sie ohne Rechnung, dass E(X) = 2 gilt.",2,"Der Graph der Dichte ist eine Parabel, symmetrisch zur Geraden x = 2 → Erwartungswert 2"],
 ["Begründen Sie, dass P(X = 2) = 0 gilt, obwohl f(2) maximal ist.",1,"Bei stetigen Zufallsgrößen sind Wahrscheinlichkeiten Flächen; über einem einzelnen Punkt ist die Fläche 0."]]},
"Die Analysis der Gauß'schen Glockenfunktion":{s:"Gegeben ist g(x) = e^(−x²/8).",p:[
 ["Untersuchen Sie den Graphen von g auf Symmetrie und geben Sie den Hochpunkt an.",2,"g(−x) = g(x) → achsensymmetrisch; Hochpunkt H(0 | 1)"],
 ["Bestimmen Sie die Wendepunkte des Graphen von g.",4,"g'(x) = −(x/4)·e^(−x²/8)\ng''(x) = (x²/16 − ¼)·e^(−x²/8) = 0 → x = ±2 (mit Vorzeichenwechsel)\nW(±2 | e^(−½)) ≈ (±2 | 0,61)"],
 ["Für eine Konstante c ist c·g(x) die Dichtefunktion einer normalverteilten Zufallsgröße. Geben Sie μ, σ und c an.",3,"Vergleich mit e^(−(x−μ)²/(2σ²)): μ = 0, 2σ² = 8 → σ = 2\nc = 1/(σ√(2π)) = 1/(2√(2π)) ≈ 0,199"]]},
"Normalverteilung":{s:"Die Masse von Brötchen einer Bäckerei ist normalverteilt mit μ = 60 g und σ = 2,5 g.\nVerwenden Sie: Φ(1) = 0,8413; Φ(2) = 0,9772; Φ(2,33) ≈ 0,99",p:[
 ["Berechnen Sie die Wahrscheinlichkeit, dass ein Brötchen weniger als 55 g wiegt.",2,"z = (55 − 60)/2,5 = −2 → Φ(−2) = 1 − 0,9772 = 0,0228"],
 ["Berechnen Sie P(57,5 ≤ X ≤ 65).",3,"z-Werte: −1 und 2 → Φ(2) − Φ(−1) = 0,9772 − 0,1587 = 0,8185"],
 ["Höchstens 1 % der Brötchen sollen leichter als 55 g sein. Bestimmen Sie bei unverändertem σ den kleinsten passenden Erwartungswert.",4,"Φ((55 − μ)/2,5) ≤ 0,01 → (55 − μ)/2,5 ≤ −2,33\nμ ≥ 55 + 2,33·2,5 ≈ 60,8 g"]]},
"Die Sigma-Regeln":{s:"Eine Partei erhielt bei der letzten Wahl 40 % der Stimmen. In einer Umfrage werden 600 zufällig ausgewählte Wahlberechtigte befragt.",p:[
 ["Bestimmen Sie unter der Annahme p = 0,4 das zum Erwartungswert symmetrische Intervall, in dem die Anzahl der Parteiwähler mit etwa 95 % Wahrscheinlichkeit liegt.",3,"μ = 240; σ = √(600·0,4·0,6) = 12 (> 3)\n240 ± 1,96·12 → [216,5; 263,5] → 217 bis 263 Personen"],
 ["In der Umfrage geben nur 210 Personen an, die Partei zu wählen. Beurteilen Sie dieses Ergebnis.",2,"210 liegt deutlich unterhalb des 95 %-Intervalls. Das spricht dafür, dass der Stimmenanteil gesunken ist."],
 ["Bestimmen Sie, wie viele Personen mindestens befragt werden müssten, damit die halbe Breite des 95 %-Intervalls für den Anteil höchstens 3 Prozentpunkte beträgt.",4,"1,96·√(n·0,24)/n ≤ 0,03 → √n ≥ 1,96·√0,24/0,03 ≈ 32,0\nn ≥ 1024,4 → mindestens 1025 Personen"]]},
"Lineare Abhängigkeit und Unabhängigkeit":{s:"Gegeben sind a⃗ = (1 | 2 | −1), b⃗ = (2 | 0 | 1) und cₜ⃗ = (4 | t | −1) mit t ∈ ℝ.",p:[
 ["Zeigen Sie, dass a⃗ und b⃗ linear unabhängig sind.",1,"Ansatz b⃗ = r·a⃗: x₁ ergibt r = 2, x₂ ergibt 2r = 0, also r = 0 → Widerspruch, b⃗ ist kein Vielfaches von a⃗."],
 ["Bestimmen Sie t so, dass a⃗, b⃗ und cₜ⃗ linear abhängig sind.",3,"r·a⃗ + s·b⃗ = cₜ⃗: r + 2s = 4; 2r = t; −r + s = −1\nAus Zeile 1 und 3: 3s = 3 → s = 1, r = 2 → t = 4"],
 ["Deuten Sie das Ergebnis aus der vorherigen Teilaufgabe geometrisch.",1,"Für t = 4 liegen die drei Vektoren in einer Ebene (komplanar)."],
 ["Begründen Sie, dass sich für t = 0 jeder Vektor des Raums als Linearkombination von a⃗, b⃗ und c₀⃗ darstellen lässt.",2,"Für t ≠ 4 sind die drei Vektoren linear unabhängig und bilden damit eine Basis des Raums."]]},
"Parameterform von Geraden":{s:"Ein Heißluftballon bewegt sich geradlinig. Seine Position nach t Minuten wird beschrieben durch X⃗ = (2 | 1 | 0,5) + t·(1 | 2 | 0,2) (Angaben in km).",p:[
 ["Bestimmen Sie die Position des Ballons nach 5 Minuten.",2,"(2 + 5 | 1 + 10 | 0,5 + 1) = (7 | 11 | 1,5)"],
 ["Berechnen Sie, nach welcher Zeit der Ballon eine Höhe von 2 km erreicht.",2,"0,5 + 0,2t = 2 → t = 7,5 min"],
 ["Prüfen Sie, ob der Ballon die Spitze eines Funkmasts im Punkt K(12 | 21 | 2,5) trifft.",2,"x₁: 2 + t = 12 → t = 10; x₂: 1 + 20 = 21 ✓; x₃: 0,5 + 2 = 2,5 ✓ → ja, nach 10 Minuten"],
 ["Berechnen Sie die Strecke, die der Ballon in den ersten 10 Minuten zurücklegt.",2,"10·|(1 | 2 | 0,2)| = 10·√5,04 ≈ 22,4 km"]]},
"Gegenseitige Lage von Geraden":{s:"Gegeben sind g: X⃗ = (1 | 2 | 0) + λ·(2 | 1 | 1) und hₐ: X⃗ = (3 | 0 | a) + μ·(1 | −1 | 1) mit a ∈ ℝ.",p:[
 ["Zeigen Sie, dass g und hₐ für kein a parallel sind.",1,"(2 | 1 | 1) und (1 | −1 | 1) sind keine Vielfachen voneinander."],
 ["Bestimmen Sie a so, dass sich g und hₐ schneiden, und berechnen Sie den Schnittpunkt.",4,"1 + 2λ = 3 + μ; 2 + λ = −μ; λ = a + μ\nAus Zeile 2: μ = −2 − λ → in Zeile 1: 1 + 2λ = 1 − λ → λ = 0, μ = −2\nZeile 3: 0 = a − 2 → a = 2; S(1 | 2 | 0)"],
 ["Geben Sie die Lage von g und hₐ für a ≠ 2 an.",1,"Nicht parallel und ohne Schnittpunkt → windschief"],
 ["Geben Sie eine Gleichung einer Geraden an, die g im Punkt S senkrecht schneidet.",2,"Richtungsvektor senkrecht zu (2 | 1 | 1), z.B. (1 | −2 | 0)\nk: X⃗ = (1 | 2 | 0) + ν·(1 | −2 | 0)"]]},
"Parameterform von Ebenen":{s:"Eine rechteckige Dachfläche hat die Eckpunkte A(2 | 0 | 0), B(2 | 4 | 0), C(0 | 4 | 2) und D(0 | 0 | 2).",p:[
 ["Geben Sie eine Gleichung der Ebene E in Parameterform an, in der die Dachfläche liegt, und zeigen Sie, dass auch C in E liegt.",3,"E: X⃗ = (2 | 0 | 0) + λ·(0 | 4 | 0) + μ·(−2 | 0 | 2) (Spannvektoren AB⃗, AD⃗)\nC: λ = 1, μ = 1 → (0 | 4 | 2) ✓"],
 ["Prüfen Sie, ob der Punkt P(1 | 2 | 1) auf der Dachfläche liegt.",2,"x₂: 4λ = 2 → λ = 0,5; x₃: 2μ = 1 → μ = 0,5; x₁: 2 − 1 = 1 ✓\n0 ≤ λ, μ ≤ 1 → P liegt auf der Dachfläche (Mittelpunkt)"],
 ["Bestimmen Sie die Schnittgerade von E mit der x₁x₂-Ebene.",2,"x₃ = 2μ = 0 → μ = 0 → s: X⃗ = (2 | 0 | 0) + λ·(0 | 4 | 0)"],
 ["Berechnen Sie den Flächeninhalt der Dachfläche.",3,"AB⃗ ∘ AD⃗ = 0 → Rechteck\n|AB⃗| = 4, |AD⃗| = √8 → A = 4√8 = 8√2 ≈ 11,3 FE"]]},
"Normalen- und Koordinatenform von Ebenen":{s:"Die Ebene E enthält die Punkte A(4 | 0 | 0), B(0 | 4 | 0) und C(0 | 0 | 2).",p:[
 ["Bestimmen Sie eine Gleichung von E in Koordinatenform.",3,"Achsenabschnitte 4, 4, 2: x₁/4 + x₂/4 + x₃/2 = 1 → x₁ + x₂ + 2x₃ = 4"],
 ["Weisen Sie nach, dass n⃗ = (1 | 1 | 2) ein Normalenvektor von E ist.",2,"AB⃗ = (−4 | 4 | 0): n⃗ ∘ AB⃗ = 0 ✓; AC⃗ = (−4 | 0 | 2): n⃗ ∘ AC⃗ = −4 + 4 = 0 ✓"],
 ["Geben Sie eine Gleichung der zu E parallelen Ebene F durch P(1 | 1 | 3) an.",2,"1 + 1 + 6 = 8 → F: x₁ + x₂ + 2x₃ = 8"],
 ["Geben Sie eine Gleichung der Spurgeraden von E in der x₁x₂-Ebene an.",2,"x₃ = 0: x₁ + x₂ = 4, z.B. X⃗ = (4 | 0 | 0) + t·(−1 | 1 | 0)"]]},
"Gegenseitige Lage von Gerade und Ebene":{s:"Ein Raum wird modellhaft beschrieben: Der Boden liegt in der x₁x₂-Ebene, eine Wand in der Ebene x₂ = 6. Eine Lampe befindet sich im Punkt L(2 | 0 | 5).",p:[
 ["Die Spitze eines Gegenstands befindet sich in S(2 | 3 | 2). Bestimmen Sie den Schattenpunkt der Spitze auf dem Boden.",3,"Lichtstrahl: X⃗ = (2 | 0 | 5) + λ·(0 | 3 | −3)\nx₃ = 0 → λ = 5/3 → (2 | 5 | 0); x₂ = 5 ≤ 6 → liegt im Raum"],
 ["Die Spitze eines zweiten Gegenstands liegt in T(2 | 3 | 4). Untersuchen Sie rechnerisch, ob ihr Schatten auf den Boden oder auf die Wand fällt.",4,"Lichtstrahl: X⃗ = (2 | 0 | 5) + λ·(0 | 3 | −1)\nBoden: 5 − λ = 0 → λ = 5 → x₂ = 15 > 6, liegt hinter der Wand\nWand: 3λ = 6 → λ = 2 → (2 | 6 | 3), x₃ = 3 > 0 → Schatten auf der Wand"],
 ["Berechnen Sie den Winkel, unter dem der Lichtstrahl durch S auf den Boden trifft.",2,"u⃗ = (0 | 3 | −3), n⃗ = (0 | 0 | 1)\nsin α = 3/(√18·1) = 1/√2 → α = 45°"]]},
"Gegenseitige Lage von Ebenen":{s:"Gegeben sind E: x₁ + x₂ + x₃ = 6 und die Ebenenschar Fₐ: x₁ + a·x₂ − x₃ = 2 mit a ∈ ℝ.",p:[
 ["Zeigen Sie, dass E und Fₐ für kein a parallel sind.",2,"(1 | a | −1) müsste ein Vielfaches von (1 | 1 | 1) sein; wegen der x₁-Koordinate nur mit Faktor 1, dann wäre −1 = 1 → Widerspruch"],
 ["Bestimmen Sie für a = 1 eine Gleichung der Schnittgeraden von E und F₁.",4,"x₁ + x₂ + x₃ = 6 und x₁ + x₂ − x₃ = 2\nSubtraktion: 2x₃ = 4 → x₃ = 2; x₁ + x₂ = 4\ns: X⃗ = (4 | 0 | 2) + t·(−1 | 1 | 0)"],
 ["Bestimmen Sie a so, dass Fₐ senkrecht auf E steht.",2,"(1 | 1 | 1) ∘ (1 | a | −1) = 1 + a − 1 = a = 0 → a = 0"]]},
"Abstandsbestimmungen":{s:"Gegeben sind die Ebene E: 2x₁ + 2x₂ + x₃ = 12 und der Punkt P(4 | 4 | 5).",p:[
 ["Berechnen Sie den Abstand von P zu E.",2,"d = |8 + 8 + 5 − 12| / 3 = 9/3 = 3"],
 ["Bestimmen Sie den Lotfußpunkt F von P auf E.",3,"Lotgerade: X⃗ = (4 | 4 | 5) − t·(2 | 2 | 1)\n2(4 − 2t) + 2(4 − 2t) + (5 − t) = 12 → 21 − 9t = 12 → t = 1\nF(2 | 2 | 4)"],
 ["Bestimmen Sie den Spiegelpunkt P' von P an E.",2,"P'⃗ = 2F⃗ − P⃗ = (0 | 0 | 3)"],
 ["Die Gerade durch P verläuft parallel zur x₃-Achse. Bestimmen Sie die Punkte dieser Geraden, die von E den Abstand 1 haben.",3,"Q(4 | 4 | q): |8 + 8 + q − 12| / 3 = 1 → |4 + q| = 3\nq = −1 oder q = −7 → Q₁(4 | 4 | −1), Q₂(4 | 4 | −7)"]]},
"Schnittwinkel":{s:"Die beiden Dachflächen eines Satteldachs liegen in E₁: x₁ + x₃ = 6 und E₂: −x₁ + x₃ = 0.",p:[
 ["Zeigen Sie, dass die Dachflächen senkrecht zueinander stehen.",2,"(1 | 0 | 1) ∘ (−1 | 0 | 1) = 0 → 90°"],
 ["Berechnen Sie den Neigungswinkel von E₁ gegenüber dem Boden (x₁x₂-Ebene).",2,"cos α = |(1 | 0 | 1) ∘ (0 | 0 | 1)| / √2 = 1/√2 → α = 45°"],
 ["Bestimmen Sie eine Gleichung der Firstgeraden.",2,"Aus beiden Gleichungen: x₁ = 3, x₃ = 3 → X⃗ = (3 | 0 | 3) + t·(0 | 1 | 0)"],
 ["Berechnen Sie den Winkel zwischen der Geraden g: X⃗ = t·(1 | 1 | 1) und E₁.",2,"sin α = |1 + 0 + 1| / (√3·√2) = 2/√6 → α ≈ 54,7°"]]},
"Kugeln":{s:"Gegeben ist die Kugel K: (x₁ − 2)² + (x₂ − 1)² + (x₃ − 3)² = 9.",p:[
 ["Zeigen Sie, dass B(4 | 2 | 5) auf K liegt.",1,"(2)² + (1)² + (2)² = 9 ✓"],
 ["Bestimmen Sie eine Gleichung der Tangentialebene T an K im Punkt B.",3,"n⃗ = MB⃗ = (2 | 1 | 2)\nT: 2x₁ + x₂ + 2x₃ = 8 + 2 + 10 = 20"],
 ["Die Ebene E: 2x₁ + x₂ + 2x₃ = 19 schneidet K in einem Kreis. Berechnen Sie Radius und Mittelpunkt dieses Schnittkreises.",4,"d(M, E) = |4 + 1 + 6 − 19| / 3 = 8/3 < 3\nr' = √(9 − 64/9) = √17/3 ≈ 1,37\nLotgerade M + t·(2 | 1 | 2) in E: 11 + 9t = 19 → t = 8/9\nMittelpunkt (34/9 | 17/9 | 43/9)"]]},
"Untersuchung verknüpfter Funktionen, Parameter":{s:"Gegeben ist die Funktionenschar fₖ(x) = x·e^(−kx) mit k > 0.",p:[
 ["Bestimmen Sie Lage und Art des Extrempunkts des Graphen von fₖ.",4,"fₖ'(x) = (1 − kx)·e^(−kx) = 0 → x = 1/k\nVorzeichenwechsel von + nach − → Hochpunkt H(1/k | 1/(k·e))"],
 ["Zeigen Sie, dass alle Hochpunkte auf einer Ursprungsgeraden liegen, und geben Sie deren Gleichung an.",2,"x = 1/k → y = 1/(k·e) = x/e → y = x/e"],
 ["Zeigen Sie, dass alle Graphen der Schar im Ursprung dieselbe Tangente besitzen.",3,"fₖ(0) = 0 und fₖ'(0) = 1 für alle k → Tangente y = x"],
 ["Untersuchen Sie h(x) = f₁(x)·f₁(−x) auf Symmetrie.",2,"h(x) = x·e^(−x)·(−x)·eˣ = −x² → achsensymmetrisch zur y-Achse"]]},
"Funktionsbestimmungen":{s:"Der Graph einer ganzrationalen Funktion f dritten Grades verläuft durch den Ursprung, hat den Tiefpunkt T(2 | −4) und bei x = 1 eine Wendestelle.",p:[
 ["Bestimmen Sie einen Funktionsterm von f.",5,"f(x) = ax³ + bx² + cx (d = 0 wegen Ursprung)\nf''(1) = 6a + 2b = 0 → b = −3a\nf'(2) = 12a + 4b + c = 0 → c = 0\nf(2) = 8a + 4b + 2c = −4 → −4a = −4 → a = 1, b = −3\nf(x) = x³ − 3x²"],
 ["Weisen Sie nach, dass T tatsächlich ein Tiefpunkt ist.",1,"f''(2) = 6·2 − 6 = 6 > 0 ✓"],
 ["Bestimmen Sie eine Gleichung der Wendetangente.",2,"W(1 | −2), f'(1) = 3 − 6 = −3 → y = −3(x − 1) − 2 = −3x + 1"]]},
"Extremwertprobleme":{s:"",p:[
 ["Gegeben ist f(x) = 6 − x². Der Punkt P(u | f(u)) mit 0 < u < √6, der Ursprung O und der Punkt Q(u | 0) bilden ein Dreieck. Bestimmen Sie u so, dass der Flächeninhalt maximal wird, und geben Sie diesen an.",5,"A(u) = ½·u·(6 − u²) = 3u − u³/2\nA'(u) = 3 − 1,5u² = 0 → u = √2\nA''(u) = −3u < 0 → Maximum\nA(√2) = 3√2 − √2 = 2√2 ≈ 2,83 FE (an den Rändern geht A gegen 0)"],
 ["Aus einem quadratischen Karton mit 30 cm Seitenlänge wird eine oben offene Schachtel gefaltet, indem an den Ecken Quadrate der Seitenlänge x ausgeschnitten werden. Bestimmen Sie das maximale Volumen.",5,"V(x) = x·(30 − 2x)², 0 < x < 15\nV'(x) = (30 − 2x)² − 4x(30 − 2x) = (30 − 2x)(30 − 6x) = 0 → x = 5 (x = 15 entfällt)\nV(5) = 5·20² = 2 000 cm³ (Randwerte liefern 0 → Maximum)"]]},
"Differential- und Integralrechnung in Sachzusammenhängen":{s:"Die Konzentration eines Medikaments im Blut wird durch c(t) = 10t·e^(−0,5t) beschrieben (t in Stunden nach der Einnahme, c in mg/l).",p:[
 ["Bestimmen Sie den Zeitpunkt der maximalen Konzentration und deren Wert.",3,"c'(t) = 10·e^(−0,5t)·(1 − 0,5t) = 0 → t = 2\nc(2) = 20/e ≈ 7,36 mg/l (Vorzeichenwechsel + nach −)"],
 ["Bestimmen Sie den Zeitpunkt, zu dem die Konzentration am stärksten abnimmt, und die Abnahmerate zu diesem Zeitpunkt.",4,"c''(t) = 10·e^(−0,5t)·(0,25t − 1) = 0 → t = 4 (Vorzeichenwechsel)\nc'(4) = 10·e^(−2)·(−1) ≈ −1,35 mg/l pro Stunde"],
 ["Das Medikament wirkt, solange die Konzentration mindestens 2 mg/l beträgt. Bestimmen Sie näherungsweise, wie lange es nach dem Maximum noch wirkt.",2,"10t·e^(−0,5t) = 2 für t > 2 → t ≈ 7,15 (Taschenrechner bzw. Probieren)\nNoch etwa 5,2 Stunden nach dem Maximum"],
 ["Zeigen Sie, dass C(t) = −(20t + 40)·e^(−0,5t) eine Stammfunktion von c ist, und berechnen Sie die mittlere Konzentration in den ersten 6 Stunden.",3,"C'(t) = −20·e^(−0,5t) + (10t + 20)·e^(−0,5t) = 10t·e^(−0,5t) ✓\n⅙·(C(6) − C(0)) = ⅙·(40 − 160·e^(−3)) ≈ 5,34 mg/l"]]}
};

const INTRO = {
"Kurvendiskussion":["Stell dir den Graphen einer Funktion wie eine Achterbahnstrecke vor: Es gibt Stellen, an denen sie die Bodenlinie kreuzt, Gipfel, Täler und Stellen, an denen sie von einer Links- in eine Rechtskurve wechselt. Bei einer Kurvendiskussion findest du all diese besonderen Stellen durch Rechnen – ganz ohne den Graphen vorher zu sehen.","So kannst du jeden Funktionsgraphen genau beschreiben und skizzieren. Das ist das Grundwerkzeug der Analysis, fast jede Abi-Aufgabe baut darauf auf. Unten gehst du die Untersuchung Schritt für Schritt durch."],
"Exponential- und Logarithmusfunktion":["Manche Dinge wachsen nicht gleichmäßig, sondern immer schneller – zum Beispiel Bakterien, die sich ständig verdoppeln, oder Geld mit Zinseszins. Solches Wachstum beschreibt die e-Funktion eˣ. Ihr Gegenstück ist der Logarithmus ln x: Er beantwortet Fragen wie „Wie lange dauert es, bis sich etwas verdoppelt hat?“.","Diese beiden Funktionen tauchen im Abi ständig auf, oft kombiniert mit anderen Termen. Unten lernst du ihre Eigenschaften, Rechenregeln und wie man sie ableitet."],
"Kombinatorik":["Wie viele verschiedene Outfits kannst du aus 3 Hosen und 4 Shirts zusammenstellen? Wie viele Codes hat ein Zahlenschloss? Kombinatorik ist die Kunst, solche Möglichkeiten geschickt zu zählen, ohne alle einzeln aufschreiben zu müssen.","Wenn du weißt, wie viele Möglichkeiten es gibt, kannst du Wahrscheinlichkeiten berechnen. Unten lernst du die wichtigsten Zählregeln."],
"Binomialverteilung":["Du wirfst zehnmal eine Münze oder würfelst zwanzigmal – jedes Mal gibt es nur „Treffer“ oder „kein Treffer“. Die Binomialverteilung sagt dir, wie wahrscheinlich es ist, zum Beispiel genau 3, höchstens 5 oder mindestens einen Treffer zu bekommen.","Sie ist das wichtigste Werkzeug der Stochastik im Abi, etwa bei Qualitätskontrollen oder Umfragen, und die Grundlage für Hypothesentests. Unten erfährst du, wann man sie benutzen darf und wie man damit rechnet."],
"Hypothesentest":["Ein Hersteller behauptet: „Höchstens 5 % unserer Geräte sind kaputt.“ Du kannst nicht alle Geräte prüfen, nur eine Stichprobe. Ein Hypothesentest ist eine faire Spielregel, die vorher festlegt, ab wie vielen kaputten Geräten du der Behauptung nicht mehr glaubst.","So triffst du begründete Entscheidungen trotz Zufall – und weißt sogar, wie oft du dich dabei irren kannst. Unten lernst du, wie man so eine Entscheidungsregel aufstellt."],
"Vektoren: Grundlagen":["Ein Vektor ist im Grunde ein Pfeil, der eine Verschiebung beschreibt: „3 Schritte nach vorne, 2 nach rechts, 1 nach oben“. Mit Vektoren beschreibst du Punkte im dreidimensionalen Raum und wie man von einem Punkt zum anderen kommt.","Sie sind die Grundsprache der ganzen Geometrie im Abi. Unten lernst du, wie man mit Vektoren rechnet, Längen bestimmt und besondere Punkte findet."],
"Skalarprodukt und Vektorprodukt":["Mit zwei Pfeilen kann man mehr anstellen, als sie aneinanderzuhängen. Das Skalarprodukt verrät dir, ob zwei Pfeile senkrecht aufeinander stehen und welchen Winkel sie bilden. Das Vektorprodukt liefert einen neuen Pfeil, der genau senkrecht auf beiden steht.","Damit berechnest du Winkel, Flächen von Dreiecken und Volumen von Pyramiden. Unten siehst du, wie beide Produkte funktionieren."],
"Das bestimmte Integral":["Wie groß ist die Fläche unter einer Kurve? Bei einem Rechteck ist das leicht, bei einer Kurve nicht. Die Idee: Man füllt die Fläche mit immer schmaleren Rechtecken auf, bis sie die Kurve perfekt nachbilden. Das Ergebnis heißt Integral.","Mit Integralen berechnest du Flächen, aber auch zurückgelegte Wege oder zugeflossene Wassermengen. Unten lernst du, was ein Integral ist und welche Regeln gelten."],
"Integral als Flächenbilanz und Integralfunktion":["Beim Integral zählen Flächen über der x-Achse positiv und Flächen darunter negativ – wie Einnahmen und Ausgaben auf einem Konto. Am Ende steht eine Bilanz. Lässt man die rechte Grenze „wandern“, entsteht die Integralfunktion: Sie zeigt den Kontostand an jeder Stelle.","So verstehst du, warum ein Integral auch 0 oder negativ sein kann. Im Abi musst du oft aus einem Graphen ablesen, wie sich dieser „Kontostand“ verhält. Unten erfährst du, wie das geht."],
"Hauptsatz der Differential- und Integralrechnung":["Flächen mit vielen kleinen Rechtecken zu berechnen ist mühsam. Der Hauptsatz zeigt eine Abkürzung: Integrieren ist das Gegenteil von Ableiten. Findest du eine Funktion F, deren Ableitung f ist, rechnest du die Fläche einfach mit F(b) − F(a) aus.","Erst damit werden Integrale im Abi schnell lösbar. Unten lernst du den Satz und wie man ihn anwendet."],
"Stammfunktionen und Integrale":["Beim Ableiten machst du aus x² die Funktion 2x. Jetzt gehst du den Weg rückwärts: Welche Funktion ergibt abgeleitet 2x? Genau das ist eine Stammfunktion – wie ein Rätsel, bei dem du die Ausgangsfunktion suchst.","Ohne Stammfunktion kannst du kein Integral berechnen. Unten findest du die wichtigsten Stammfunktionen und Regeln zum Nachschlagen."],
"Flächeninhaltsberechnungen mit dem Integral":["Jetzt wird es praktisch: Du berechnest echte Flächeninhalte, etwa die Fläche, die eine Kurve mit der x-Achse oder mit einer anderen Kurve einschließt. Wichtig ist, dass sich Flächen über und unter der Achse dabei nicht gegenseitig wegheben.","Flächenberechnungen sind ein Klassiker im Abi. Unten lernst du ein sicheres Vorgehen für beide Fälle."],
