"Uneigentliche Integrale":["Kann eine Fläche, die unendlich lang ist, trotzdem einen endlichen Inhalt haben? Erstaunlicherweise ja – wenn die Kurve schnell genug gegen null geht. Uneigentliche Integrale untersuchen genau solche Flächen.","Das trainiert den Umgang mit Grenzwerten und kommt im Abi bei unbegrenzten Flächen vor. Unten siehst du, wie man sie berechnet."],
"Das Integral als Gesamtänderung einer Größe":["Ein Tacho zeigt dir die Geschwindigkeit, aber nicht, wie weit du schon gefahren bist. Kennst du die Geschwindigkeit über die ganze Zeit, liefert das Integral die gesamte Strecke. Genauso wird aus einer Zuflussrate die Wassermenge in einem Becken.","Solche Sachaufgaben sind im Abi sehr häufig. Unten lernst du, wie man aus einer Änderungsrate einen Bestand berechnet."],
"Volumen von Rotationskörpern":["Stell dir vor, du drehst eine Fläche wie auf einer Töpferscheibe um eine Achse – dabei entsteht ein Körper, zum Beispiel eine Vase oder ein Kegel. Mit einem Integral kannst du das Volumen dieses Körpers berechnen.","So lassen sich Volumen von Gefäßen und Bauteilen bestimmen. Unten lernst du die Formeln für Drehungen um die x- und die y-Achse."],
"Diskrete und stetige Zufallsgrößen":["Eine Zufallsgröße ordnet jedem Ergebnis eines Zufallsexperiments eine Zahl zu, etwa die Augenzahl beim Würfeln oder den Gewinn beim Glücksrad. Manche nehmen nur einzelne Werte an (diskret), andere jeden Wert in einem Bereich, wie die Körpergröße (stetig).","Mit dem Erwartungswert weißt du, was „im Mittel“ herauskommt. Unten lernst du beide Arten und ihre Kennzahlen kennen."],
"Die Analysis der Gauß'schen Glockenfunktion":["Misst man die Körpergröße vieler Menschen, liegen die meisten nah am Durchschnitt, sehr große und sehr kleine Menschen sind selten. Trägt man das auf, entsteht eine glockenförmige Kurve – die Gauß'sche Glockenkurve.","Mit den Mitteln der Analysis untersuchst du ihre Form, zum Beispiel wo sie am höchsten ist. Im Abi liest du daraus wichtige Kennzahlen ab. Unten erfährst du, wie."],
"Normalverteilung":["Viele Messwerte im Alltag – Körpergrößen, Füllmengen von Flaschen, Messfehler – verteilen sich glockenförmig um einen Mittelwert. Die Normalverteilung beschreibt das mathematisch: Wahrscheinlichkeiten sind Flächen unter der Glockenkurve.","Damit kannst du zum Beispiel berechnen, wie viele Flaschen zu wenig Inhalt haben. Unten lernst du, wie man solche Wahrscheinlichkeiten bestimmt."],
"Die Sigma-Regeln":["Bei der Glockenkurve gibt es feste Faustregeln: Rund zwei Drittel aller Werte liegen nah am Mittelwert, nämlich innerhalb einer „Standardabweichung“ σ. Fast alle Werte liegen innerhalb von drei Standardabweichungen.","Mit diesen Regeln schätzt du Wahrscheinlichkeiten schnell ab, ohne lange zu rechnen. Unten findest du die wichtigsten Werte."],
"Lineare Abhängigkeit und Unabhängigkeit":["Zeigen zwei Pfeile in dieselbe Richtung, sind sie im Grunde „gleich“ – nur verschieden lang. Liegen drei Pfeile flach in einer Ebene, kann man einen aus den anderen beiden zusammensetzen. Genau das bedeutet „linear abhängig“.","Damit prüfst du später, ob Geraden parallel sind oder ob drei Punkte eine Ebene bilden. Unten lernst du, wie man das nachrechnet."],
"Parameterform von Geraden":["Eine Gerade im Raum beschreibst du wie eine Wegbeschreibung: „Starte an Punkt A und gehe immer in Richtung u⃗ – beliebig weit vor oder zurück.“ So erfasst du jede gerade Linie im Raum.","Geraden beschreiben im Abi zum Beispiel Flugbahnen oder Lichtstrahlen. Unten lernst du, wie man Geraden aufstellt und prüft, ob ein Punkt darauf liegt."],
"Gegenseitige Lage von Geraden":["Zwei Straßen auf einer Karte können sich kreuzen oder parallel laufen. Im Raum gibt es eine dritte Möglichkeit: Sie laufen aneinander vorbei, wie eine Brücke über einer Straße. Solche Geraden heißen windschief.","Im Abi lautet die Frage oft: Begegnen sich zwei Flugbahnen? Unten lernst du ein festes Vorgehen, um das zu entscheiden."],
"Parameterform von Ebenen":["Eine Ebene ist eine unendlich große, flache Platte im Raum, zum Beispiel eine Dachfläche oder eine Wand. Du beschreibst sie durch einen Startpunkt und zwei Richtungen, in die du dich auf der Fläche bewegen kannst.","Ebenen brauchst du für Abstände, Schnittpunkte und Winkel. Unten lernst du, wie man eine Ebene aufstellt."],
"Normalen- und Koordinatenform von Ebenen":["Statt eine Ebene durch zwei Richtungen zu beschreiben, kannst du auch einen Pfeil nehmen, der senkrecht auf ihr steht – wie ein Fahnenmast auf einem Platz. Daraus ergibt sich eine einfache Gleichung, die Koordinatenform.","Mit dieser Form werden Abstands- und Winkelberechnungen viel einfacher. Unten lernst du, wie man sie aufstellt."],
"Gegenseitige Lage von Gerade und Ebene":["Ein Lichtstrahl trifft auf eine Wand, ein Stab steckt im Boden – hier treffen eine Gerade und eine Ebene aufeinander. Entweder durchstößt die Gerade die Ebene, sie läuft parallel daran vorbei, oder sie liegt ganz in ihr.","Damit berechnest du im Abi zum Beispiel, wo der Schatten eines Gegenstands landet. Unten erfährst du, wie das geht."],
"Gegenseitige Lage von Ebenen":["Zwei Wände eines Zimmers treffen sich in einer Kante, zwei Stockwerke liegen parallel übereinander. Genauso können zwei Ebenen sich in einer Geraden schneiden oder parallel sein.","Damit bestimmst du zum Beispiel die Firstlinie eines Dachs. Unten lernst du, wie man die Lage zweier Ebenen untersucht."],
"Abstandsbestimmungen":["Wie weit ist ein Punkt von einer Wand entfernt? Gemeint ist immer der kürzeste Weg – also senkrecht auf die Wand zu. Im Raum berechnest du solche kürzesten Entfernungen zwischen Punkten, Geraden und Ebenen.","Abstände gehören zu den häufigsten Fragen in der Abi-Geometrie. Unten lernst du die passenden Formeln und Wege."],
"Schnittwinkel":["Wie steil ist ein Dach? Unter welchem Winkel trifft ein Lichtstrahl auf den Boden? Solche Winkel zwischen Geraden und Ebenen berechnest du mit dem Skalarprodukt.","Winkelfragen sind typisch für Anwendungsaufgaben im Abi. Unten findest du die Formeln für alle Fälle."],
"Kugeln":["Eine Kugel besteht aus allen Punkten, die vom Mittelpunkt gleich weit entfernt sind – wie die Oberfläche eines Balls. Mit einer Gleichung kannst du prüfen, ob ein Punkt auf, in oder außerhalb der Kugel liegt.","Kugelaufgaben verbinden viele Themen der Geometrie, etwa Abstände und Ebenen. Unten lernst du die wichtigsten Fragestellungen."],
"Untersuchung verknüpfter Funktionen, Parameter":["Viele Funktionen im Abi sind wie aus Bausteinen zusammengesetzt, zum Beispiel x·e⁻ˣ – ein Produkt aus x und einer e-Funktion. Manchmal steckt zusätzlich ein Parameter wie k darin, der eine ganze Familie von Graphen erzeugt.","Um solche Funktionen zu untersuchen, brauchst du die passenden Ableitungsregeln. Unten lernst du sie und wie man mit Parametern umgeht."],
"Funktionsbestimmungen":["Normalerweise hast du eine Funktion und untersuchst ihren Graphen. Hier ist es umgekehrt: Du kennst nur Eigenschaften, etwa „geht durch diesen Punkt und hat dort einen Hochpunkt“, und suchst die passende Funktion – wie bei einem Steckbrief.","So kann man zum Beispiel eine Brücke oder eine Rampe mathematisch beschreiben. Unten lernst du, wie man Bedingungen in Gleichungen übersetzt."],
"Extremwertprobleme":["Welche Form muss eine Dose haben, damit möglichst wenig Blech verbraucht wird? Wie groß kann ein Rechteck unter einer Kurve höchstens werden? Solche Optimierungsfragen löst du mit der Ableitung.","Extremwertprobleme sind klassische Anwendungsaufgaben im Abi. Unten lernst du ein Schritt-für-Schritt-Vorgehen."],
"Differential- und Integralrechnung in Sachzusammenhängen":["Hinter vielen Abi-Aufgaben steckt eine echte Situation: eine Medikamentenkonzentration im Blut, ein Wasserstand oder ein Wachstum. Funktion, Ableitung und Integral bekommen dann eine konkrete Bedeutung, etwa „Menge“, „wie schnell sich etwas ändert“ oder „gesamter Zuwachs“.","Im Abi musst du deine Ergebnisse immer im Zusammenhang erklären. Unten lernst du, was welche Rechnung bedeutet."]
};

const DE_LEKT = {ch:"Pflichtlektüren", items:[
{t:"Jenny Erpenbeck: Heimsuchung", s:`Einordnung
• Roman, erschienen 2008; Gegenwartsliteratur
• Schauplatz: ein Grundstück mit Sommerhaus an einem märkischen See in Brandenburg
• Autobiografischer Bezug: Das Haus gehörte zeitweise zur Familie der Autorin
• Die eigentliche Hauptfigur ist der Ort – erzählt werden rund 100 Jahre deutscher Geschichte

Aufbau
• Rahmen: Prolog (Entstehung der Landschaft in der Eiszeit) und Epilog (Abriss des Hauses)
• Dazwischen Kapitel über einzelne Bewohner und Besucher, betitelt nach ihrer Rolle (z.B. Der Architekt, Das Mädchen, Die Schriftstellerin)
• Zwischen den Kapiteln immer wieder der Gärtner: eine schweigsame, fast zeitlose Figur, die das Grundstück pflegt – Gegenpol zur Unruhe der Geschichte
• Nicht streng chronologisch, aber insgesamt von der Kaiserzeit bis nach der Wende

Inhalt und Zeitschichten
• Weimarer Republik: Das Grundstück wird verkauft, ein Berliner Architekt baut das Sommerhaus
• NS-Zeit: Die jüdische Nachbarsfamilie wird verfolgt; der Architekt erwirbt günstig ihr Seegrundstück. Ein Mädchen der Familie wird im Holocaust ermordet
• Kriegsende 1945: Rotarmisten kommen ins Haus, Gewalt und Angst prägen die Zeit
• DDR: Der Architekt flieht in den Westen; eine aus dem sowjetischen Exil zurückgekehrte Schriftstellerin lebt mit ihrer Familie im Haus; Enteignung und Bodenreform
• Nach 1990: Rückübertragungsansprüche; die bisherige Bewohnerin muss das Haus verlassen, es wird abgerissen

Erzähltechnik und Sprache
• Wechselnde Perspektiven, meist personales Erzählen aus Sicht der jeweiligen Figur
• Wiederholungen und Leitmotive (z.B. der Gärtner, der See, der Wandschrank) verbinden die Kapitel
• Rhythmische, oft fast lyrische Sprache; Gegenwart und Vergangenheit verschwimmen
• Zyklische Zeitstruktur: Natur und Gärtner überdauern, Menschen kommen und gehen

Themen und Motive
• Heimat und Besitz: Wem gehört ein Ort? Kaufen, Enteignen, Zurückgeben
• Vergänglichkeit und Zeit
• Deutsche Geschichte als Kette von Brüchen (NS, Krieg, DDR, Wende)
• Schuld und Verdrängung; Opfer und Nutznießer
• Das Haus als Symbol für Zuflucht – und für Verlust

Fallstricke
• Den Gärtner nicht als normale Figur behandeln: Er steht für Dauer, Natur und das Unveränderliche
• Kapitel nicht isoliert interpretieren – die Bedeutung entsteht durch die Verbindung der Schichten`, k:[
{q:"Erkläre die Funktion des Gärtners für den Aufbau des Romans.", a:"Der Gärtner tritt zwischen den Kapiteln immer wieder auf, ohne an den historischen Ereignissen teilzunehmen. Er verbindet die Episoden, steht für Kontinuität, Natur und den Kreislauf der Jahreszeiten und bildet so einen Kontrast zur Unruhe der Geschichte, die die Bewohner erleben."},
{q:"Erläutere am Beispiel des Grundstücks das Thema Besitz im Roman.", a:"Das Grundstück wird mehrfach verkauft, unter Druck veräußert (jüdische Nachbarn), enteignet (DDR) und nach 1990 zurückgefordert. So zeigt der Roman, dass Besitz von politischen Systemen abhängt und dass die Frage, wem ein Ort gehört, immer mit Geschichte, Unrecht und Verlust verbunden ist."},
{q:"Begründe, warum man den Ort als heimliche Hauptfigur bezeichnen kann.", a:"Nur der Ort bleibt über alle Kapitel hinweg bestehen; die Figuren wechseln. Prolog und Epilog erzählen sogar seine Entstehung und das Verschwinden des Hauses. Damit wird der Ort zum Bezugspunkt, an dem sich die Geschichte des 20. Jahrhunderts ablagert."}]},

{t:"Goethe: Iphigenie auf Tauris", s:`Einordnung
• Schauspiel in fünf Akten; Prosafassung 1779, Versfassung 1787
• Weimarer Klassik; Hauptwerk zum Thema Humanität
• Vers: Blankvers (fünfhebiger Jambus ohne Reim); geschlossene Form, wenige Figuren, Einheit von Ort, Zeit und Handlung

Vorgeschichte
• Iphigenie gehört zum Geschlecht des Tantalus, auf dem ein Fluch liegt (Mord und Rache über Generationen)
• Ihr Vater Agamemnon wollte sie opfern; die Göttin Diana entrückte sie nach Tauris
• Ihr Bruder Orest hat die Mutter Klytämnestra getötet und wird von den Furien (Rachegöttinnen) verfolgt

Inhalt
• 1. Akt: Iphigenie, Priesterin der Diana auf Tauris, sehnt sich nach Griechenland. König Thoas wirbt um sie; sie lehnt ab. Er führt daraufhin die alten Menschenopfer wieder ein
• 2.–3. Akt: Orest und Pylades landen und sollen geopfert werden. Ein Orakel hatte Orest befohlen, die „Schwester“ nach Griechenland zu bringen – sie glauben, gemeint sei das Bild der Diana. Iphigenie erkennt ihren Bruder; Orest wird von seinem Wahn geheilt
• 4. Akt: Pylades plant eine List (Flucht mit dem Götterbild). Iphigenie gerät in einen Konflikt: Lüge zur Rettung oder Wahrheit gegenüber Thoas
• 5. Akt: Iphigenie entscheidet sich für die Wahrheit und vertraut auf Thoas’ Menschlichkeit. Orest deutet das Orakel neu: gemeint ist Iphigenie selbst. Thoas lässt die Geschwister ziehen

Figuren
• Iphigenie: autonom handelnde Frau, Verkörperung von Wahrhaftigkeit und Humanität
• Thoas: „Barbar“, der sich als menschlich erweist
• Orest: schuldbeladen, wird durch die Schwester geheilt
• Pylades: pragmatisch, Vertreter der List
• Arkas: Vertrauter des Königs, vermittelt

Themen und Motive
• Humanität: Konflikte werden durch Wahrheit, Vertrauen und Menschlichkeit gelöst, nicht durch Gewalt
• Autonomie: Iphigenie entscheidet selbst und befreit sich vom Fluch
• Götterbild: Die Götter erscheinen als gütig; die Menschen handeln selbst verantwortlich
• Parzenlied (4. Akt): zeigt das alte, grausame Götterbild als Gegenbild
• Frauenbild und Kritik an der Unfreiheit der Frau

Fallstricke
• Iphigenie ist keine passive Heldin – ihr Mut zur Wahrheit ist die eigentliche Handlung
• „Barbaren“ vs. Griechen: Das Stück stellt diese Einteilung gerade in Frage`, k:[
{q:"Erkläre, worin Iphigenies Konflikt im 4. Akt besteht.", a:"Pylades’ Plan erfordert eine Lüge gegenüber Thoas, die die Geschwister retten würde. Iphigenie müsste dafür ihre Wahrhaftigkeit aufgeben und Thoas’ Vertrauen missbrauchen. Sie steht zwischen Pflicht gegenüber ihrer Familie und ihrem moralischen Anspruch."},
{q:"Erläutere, inwiefern das Stück ein Beispiel für das Humanitätsideal der Klassik ist.", a:"Der Konflikt wird nicht durch Gewalt oder göttliches Eingreifen gelöst, sondern durch Iphigenies Wahrhaftigkeit und Thoas’ Einsicht. Der Mensch erscheint als fähig, aus freier Entscheidung moralisch zu handeln – das entspricht dem klassischen Ideal der Humanität."},
{q:"Erkläre die Bedeutung der Neudeutung des Orakels im 5. Akt.", a:"Statt das Götterbild zu rauben, erkennt Orest, dass mit der „Schwester“ Iphigenie gemeint ist. Damit wird der Raub überflüssig; die Lösung beruht auf richtiger Deutung und Vertrauen statt auf List und Gewalt."}]},

{t:"E.T.A. Hoffmann: Der Sandmann", s:`Einordnung
• Erzählung, 1816 in der Sammlung „Nachtstücke“ erschienen
• Schwarze Romantik: das Unheimliche, Wahnsinn, Nachtseiten der Seele
• Grundlage für Freuds Aufsatz „Das Unheimliche“ (1919)

Aufbau
• Drei Briefe am Anfang: Nathanael an Lothar, Clara an Nathanael, Nathanael an Lothar
• Danach meldet sich ein Erzähler zu Wort, der über den Anfang seiner Geschichte nachdenkt und den Rest erzählt
• Wechsel der Perspektive: Erst sehen wir Nathanaels subjektive Sicht, dann eine distanziertere

Inhalt
• Kindheit: Die Amme erzählt vom Sandmann, der Kindern die Augen raubt. Nathanael verbindet ihn mit dem Advokaten Coppelius, der nachts mit dem Vater alchemistische Experimente macht. Der Vater stirbt bei einer Explosion
• Studienzeit: Nathanael glaubt, im Wetterglashändler Coppola Coppelius wiederzuerkennen, und kauft ihm ein Perspektiv (Fernrohr) ab
• Durch das Fernrohr verliebt er sich in Olimpia, die Tochter von Professor Spalanzani – sie ist ein Automat. Als sie zerstört wird, verfällt er dem Wahnsinn
• Scheinbare Heilung und Verlobung mit Clara. Auf dem Rathausturm blickt er durch das Fernrohr auf Clara, gerät in Raserei und will sie hinabstoßen. Lothar rettet sie. Nathanael sieht Coppelius in der Menge und stürzt sich in den Tod

Figuren
• Nathanael: Student, Dichter, empfindsam, von Kindheitsangst geprägt
• Clara: vernünftig, klar, „kalt“ in Nathanaels Augen – Vertreterin der Aufklärung
• Lothar: Claras Bruder, Nathanaels Freund
• Coppelius/Coppola: unheimliche Doppelfigur
• Olimpia: Automat – Spiegel von Nathanaels Selbstverliebtheit

Motive
• Augen und Sehen: Wahrnehmung ist unsicher und verzerrt
• Perspektiv/Fernrohr: verfälschter Blick auf die Welt
• Automat: Mensch und Maschine, Leblosigkeit
• Feuer und Kreis: Wiederkehr des Traumas, Wahnsinn

Deutung
• Zentrale Ambivalenz: Ist Coppelius eine reale dämonische Macht oder ist alles Nathanaels Einbildung? Der Text lässt beides offen
• Romantik vs. Aufklärung: Nathanaels Fantasie gegen Claras Vernunft
• Psychologische Lesart: Kindheitstrauma, Wiederholungszwang

Fallstricke
• Nicht entscheiden, ob es den Sandmann „wirklich gibt“ – die Unentscheidbarkeit ist der Kern
• Clara nicht nur als „kalt“ sehen: Das ist Nathanaels Sicht`, k:[
{q:"Erkläre die Bedeutung des Augenmotivs.", a:"Augen stehen für Wahrnehmung. Der Sandmann raubt Augen, Coppola verkauft „Augen“ (Gläser), Olimpia hat falsche Augen. Das Motiv zeigt, dass Nathanaels Blick auf die Welt verzerrt ist und dass Wahrnehmung unzuverlässig sein kann."},
{q:"Erläutere die Funktion der Briefe am Anfang.", a:"Die Briefe zeigen die Ereignisse aus subjektiver Sicht, zuerst Nathanaels, dann Claras. Der Leser erlebt Nathanaels Angst unmittelbar und erhält mit Claras Brief eine rationale Gegendeutung. So entsteht von Beginn an die Unsicherheit, was wirklich ist."},
{q:"Inwiefern ist Olimpia ein Spiegel Nathanaels?", a:"Olimpia sagt kaum mehr als „Ach, ach“ und hört Nathanael scheinbar endlos zu. Er liebt in ihr nur sein eigenes Bild, weil sie ihm nicht widerspricht – anders als Clara, die seine Dichtungen kritisiert. Olimpia zeigt seine Selbstbezogenheit."}]},

{t:"Kleist: Der zerbrochne Krug", s:`Einordnung
• Lustspiel in einem Akt mit 13 Auftritten; Uraufführung 1808 in Weimar unter Goethe (Misserfolg), Druck 1811
• Blankvers, aber sehr lebendige, oft stockende Sprache
• Analytisches Drama: Die Tat liegt vor Beginn und wird im Gerichtsverfahren aufgedeckt

Inhalt
• Ort: Dorf Huisum in den Niederlanden; Gerichtstag beim Dorfrichter Adam
• Adam ist verletzt und hat seine Perücke verloren. Überraschend kommt Gerichtsrat Walter zur Inspektion
• Frau Marthe Rull klagt: In der Nacht wurde in der Kammer ihrer Tochter Eve ein wertvoller Krug zerbrochen. Sie beschuldigt Eves Verlobten Ruprecht
• Ruprecht sagt, ein anderer Mann sei bei Eve gewesen und durchs Fenster geflohen. Eve schweigt lange
• Adam leitet das Verfahren und versucht, die Wahrheit zu vertuschen – denn er selbst war der Täter
• Indizien: Frau Brigitte findet seine Perücke und eine Spur, die zu Adam führt (Klumpfuß – mit Anspielung auf den Teufel)
• Eve enthüllt: Adam hatte sie mit einem angeblichen Attest unter Druck gesetzt, das Ruprecht vor dem Kriegsdienst in Ostindien bewahren sollte
• Adam flieht; Walter will die Sache möglichst ohne großes Aufsehen regeln

Figuren
• Adam: Richter und Täter zugleich – korrupt, lügt und verwickelt sich
• Walter: Vertreter der Obrigkeit, will Ordnung, aber auch den Schein wahren
• Licht: Schreiber, will selbst Richter werden
• Eve: zwischen Schweigen und Wahrheit; prüft Ruprechts Vertrauen
• Ruprecht: eifersüchtig, misstrauisch
• Marthe Rull: will Genugtuung für den Krug (ihre lange Beschreibung des Krugs ist berühmt)

Themen und Motive
• Justiz und Macht: Der Richter missbraucht sein Amt
• Wahrheit und Sprache: Lügen, Ausflüchte, Missverständnisse
• Vertrauen: Ruprecht soll Eve glauben, ohne Beweis
• Biblische Anspielungen: Adam und Eva, Sündenfall
• Ödipus-Bezug: Wie bei Sophokles ist der Ermittelnde selbst der Schuldige

Fallstricke
• Es geht nicht um den Krug selbst: Er steht für Ehre, Unschuld und eine zerbrochene Ordnung
• Komik und Ernst gehören zusammen – das Lustspiel zeigt ernste Machtkritik`, k:[
{q:"Erkläre, warum man das Stück als analytisches Drama bezeichnet.", a:"Die entscheidende Tat – das Zerbrechen des Krugs in der Nacht – liegt vor Beginn der Handlung. Im Verlauf wird sie im Gerichtsverfahren Schritt für Schritt aufgedeckt. Die Spannung entsteht aus der Frage, wann und wie der Täter entlarvt wird."},
{q:"Erläutere die Komik der Situation, in der Adam Gericht hält.", a:"Adam muss einen Fall untersuchen, in dem er selbst der Täter ist. Er versucht ständig, die Wahrheitsfindung zu verhindern, verstrickt sich aber immer mehr. Die Zuschauer wissen früh mehr als die Figuren, daraus entsteht Situationskomik."},
{q:"Deute die biblischen Namen Adam und Eve.", a:"Die Namen spielen auf den Sündenfall an. Adam verkörpert die verführbare, schuldige Seite des Menschen; Eve steht für Unschuld und auf die Probe gestelltes Vertrauen. Zusammen mit dem Klumpfuß (Teufel) entsteht eine ironische Anspielung auf die Schöpfungsgeschichte."}]},

{t:"Goethe: Faust. Der Tragödie erster Teil", s:`Einordnung
• Tragödie, erschienen 1808; Vorstufe „Urfaust“ aus der Sturm-und-Drang-Zeit
• Verbindet Elemente von Sturm und Drang und Klassik
• Vielfalt der Versformen: v.a. Knittelvers, außerdem Madrigalvers, Blankvers und Lieder

Aufbau
• Zueignung, Vorspiel auf dem Theater, Prolog im Himmel (Rahmen)
• Gelehrtentragödie: Fausts Verzweiflung am Wissen, Pakt mit Mephisto
• Gretchentragödie: Liebe zu Margarete (Gretchen) und ihr Untergang

Inhalt
• Prolog im Himmel: Mephisto wettet mit dem Herrn, er könne Faust vom rechten Weg abbringen. Der Herr erlaubt es: Der Mensch irrt, solange er strebt
• Nacht: Faust ist enttäuscht, dass alles Wissen ihn nicht zur Erkenntnis führt, „was die Welt im Innersten zusammenhält“. Er beschwört den Erdgeist und denkt an Selbstmord; die Osterglocken halten ihn ab
• Osterspaziergang, Pudel (Mephisto), Studierzimmer: Faust schließt eine Wette mit Mephisto. Wenn Faust je zufrieden zum Augenblick sagt „Verweile doch! du bist so schön!“, gehört seine Seele Mephisto
• Hexenküche: Faust wird verjüngt
• Gretchentragödie: Faust begehrt Gretchen. Mephisto hilft mit Schmuck und Intrigen. Gretchen fragt nach Fausts Glauben („Gretchenfrage“)
• Folgen: Gretchens Mutter stirbt an einem Schlaftrunk, ihr Bruder Valentin wird von Faust getötet, Gretchen tötet ihr Kind und wird zum Tode verurteilt
• Walpurgisnacht: Ablenkung Fausts
• Kerker: Faust will Gretchen retten, sie lehnt ab und vertraut sich Gott an. Mephisto: „Sie ist gerichtet!“ – Stimme von oben: „Ist gerettet!“

Figuren
• Faust: Gelehrter, maßlos strebend, zerrissen („Zwei Seelen wohnen, ach! in meiner Brust“)
• Mephisto: „Geist, der stets verneint“, ironisch, verführerisch
• Gretchen: jung, gläubig, schlicht – wird Opfer von Fausts Begierde und der Moral ihrer Zeit
• Wagner: Fausts Famulus, trockener Bücherwissenschaftler

Themen
• Erkenntnisdrang und die Grenzen der Wissenschaft
• Streben, Schuld und Erlösung
• Gut und Böse
• Liebe, Sexualität und gesellschaftliche Moral (Kindsmord)
• Religion und Glauben

Fallstricke
• Pakt und Wette unterscheiden: Die Wette mit Mephisto knüpft die Seele an den zufriedenen Augenblick
• Gretchen nicht nur als naives Opfer sehen: Am Ende trifft sie eine eigene Entscheidung`, k:[
{q:"Erkläre die Bedingung der Wette zwischen Faust und Mephisto.", a:"Mephisto dient Faust im Diesseits. Sollte Faust jemals so zufrieden sein, dass er zum Augenblick sagt „Verweile doch! du bist so schön!“, also aufhört zu streben, verfällt seine Seele Mephisto."},
{q:"Erläutere den Schluss der Kerkerszene.", a:"Gretchen lehnt die Flucht mit Faust ab und unterwirft sich dem göttlichen Gericht. Mephisto erklärt sie für verurteilt, eine Stimme von oben verkündet ihre Rettung. Gretchen wird also trotz ihrer Schuld erlöst, weil sie Reue zeigt und sich Gott anvertraut."},
{q:"Inwiefern spiegelt Fausts Zerrissenheit Grundzüge des Sturm und Drang und der Klassik?", a:"Sein maßloses Streben, die Gefühlsausbrüche und die Rebellion gegen Grenzen entsprechen dem Sturm und Drang. Die Frage nach dem Menschen zwischen Irrtum und Erlösung und der Rahmen aus Prolog und göttlicher Ordnung verweisen auf das klassische Menschenbild."}]},

{t:"Fontane: Irrungen, Wirrungen", s:`Einordnung
• Roman, 1887 als Vorabdruck, 1888 als Buch
• Poetischer (bürgerlicher) Realismus; spielt in Berlin in den 1870er-Jahren
• Gesellschaftsroman mit vielen Gesprächen

Inhalt
• Lene Nimptsch, eine junge Frau aus einfachen Verhältnissen, lebt bei ihrer Pflegemutter Frau Nimptsch auf dem Gelände der Gärtnerei Dörr
• Sie verliebt sich in Baron Botho von Rienäcker, einen adligen Offizier. Beide wissen, dass die Beziehung keine Zukunft hat
• Höhepunkt und Wendepunkt: Ausflug nach Hankels Ablage. Bothos Kameraden mit ihren Begleiterinnen stören die Zweisamkeit
• Aus finanziellen Gründen und auf Druck der Familie heiratet Botho seine reiche Cousine Käthe von Sellenthin
• Lene heiratet später Gideon Franke, einen ernsten, ehrlichen Mann
• Botho verbrennt Lenes Briefe; am Ende sagt er über den Namen Gideon: „Gideon ist besser als Botho.“

Figuren
• Lene: ehrlich, selbstbewusst, realistisch, akzeptiert die Trennung mit Würde
• Botho: liebt Lene, ordnet sich aber den Standeskonventionen unter
• Käthe: oberflächlich, heiter, plaudernd – Gegenbild zu Lene
• Frau Dörr und Frau Nimptsch: einfache, herzliche Welt
• Gideon Franke: Fabrikmeister, steht für Wahrhaftigkeit und Ordnung

Erzählweise und Symbole
• Viele Dialoge, Figuren charakterisieren sich durch ihre Sprache
• Symbole: Blumen (z.B. Immortellen, Strohblumen) als Zeichen für Erinnerung und Vergänglichkeit, das Verbrennen der Briefe als Abschied
• Orte: Gärtnerei (Natur, Einfachheit) vs. städtische Gesellschaft

Themen
• Standesgrenzen zwischen Adel und Kleinbürgertum
• Pflicht und Neigung, Ordnung und Liebe
• Resignation und Anpassung
• Kritik an gesellschaftlichen Konventionen – aber ohne offene Anklage

Fallstricke
• Botho nicht einfach als Schurken sehen: Er leidet an der Ordnung, der er sich beugt
• Der Roman verklärt die Wirklichkeit leicht (poetischer Realismus), statt sie hart zu zeigen wie der Naturalismus`, k:[
{q:"Erkläre, warum Botho Lene nicht heiratet.", a:"Botho gehört dem Adel an, Lene dem Kleinbürgertum. Eine Heirat würde gegen die Standesordnung verstoßen. Zudem ist seine Familie verschuldet und erwartet eine reiche Heirat. Botho ordnet seine Gefühle diesen Zwängen unter."},
{q:"Deute den Schlusssatz „Gideon ist besser als Botho“.", a:"Botho erkennt indirekt an, dass Gideon, der einfache, ehrliche Mann, zu seiner Liebe steht, während er selbst sich den Konventionen gebeugt hat. Der Satz enthält Selbsterkenntnis und Resignation."},
{q:"Erkläre die Bedeutung von Hankels Ablage.", a:"Der Ausflug ist Höhepunkt der Liebe, aber auch ihr Wendepunkt: Die Ankunft der Kameraden zeigt, dass die Gesellschaft auch in die private Idylle eindringt. Danach ist klar, dass die Beziehung nicht bestehen kann."}]},

{t:"Hauptmann: Bahnwärter Thiel", s:`Einordnung
• „Novellistische Studie“, 1888 erschienen
• Frühes Werk des Naturalismus, mit symbolistischen und impressionistischen Zügen
• Schauplatz: Kiefernwald in der Mark Brandenburg an einer Bahnstrecke

Inhalt
• Thiel ist Bahnwärter, pflichtbewusst und fromm. Seine erste Frau Minna, zart und vergeistigt, stirbt bei der Geburt des Sohnes Tobias
• Damit das Kind versorgt ist, heiratet Thiel Lene, eine kräftige, herrschsüchtige, sinnliche Frau. Er gerät in ihre Abhängigkeit
• Lene bekommt ein eigenes Kind und misshandelt Tobias. Thiel sieht es, greift aber nicht ein
• Im Wärterhäuschen pflegt Thiel einen fast religiösen Erinnerungskult um Minna – er trennt diese Welt strikt von Lene
• Lene bewirtschaftet einen Acker an der Strecke. Während sie arbeitet, wird Tobias von einem Zug erfasst und stirbt
• Thiel verfällt dem Wahnsinn, tötet Lene und das Baby und wird in eine psychiatrische Anstalt gebracht

Figuren
• Thiel: zwischen Pflicht, Schuld, Trieb und Verdrängung
• Minna: geistig-seelische Liebe, Idealisierung
• Lene: körperlich, triebhaft, dominierend
• Tobias: schwach, Opfer der Verhältnisse

Naturalistische Merkmale
• Determinismus: Der Mensch ist von Milieu, Vererbung und Trieben bestimmt
• Darstellung des einfachen Lebens und von Gewalt
• Genaue, teils fast protokollarische Beschreibungen

Symbolik
• Zug: bedrohliche, dämonische Macht der Technik
• Bahngleise: Ordnung und Linie, die das Leben durchschneidet
• Farben, besonders Rot, deuten Gewalt und Unheil voraus
• Natur: spiegelt Thiels Innenleben

Fallstricke
• Nicht als reine Kriminalgeschichte lesen: Im Zentrum steht der psychische Zusammenbruch
• Thiels Schuld und seine Determination gehören zusammen`, k:[
{q:"Erkläre die Bedeutung der Zugdarstellung.", a:"Der Zug wird wie ein Ungeheuer geschildert, mit Licht, Lärm und Gewalt. Er steht für die übermächtige, bedrohliche Technik der Moderne und für das Schicksal, das in Thiels Leben einbricht – er tötet schließlich Tobias."},
{q:"Erläutere, welche Rolle die Trennung der zwei Welten im Leben Thiels spielt.", a:"Im Wärterhäuschen pflegt Thiel die Erinnerung an Minna, zu Hause lebt er unter Lenes Herrschaft. Diese Trennung ist eine Form der Verdrängung. Als Lene auch in den Bereich an der Strecke eindringt, bricht die Ordnung zusammen und die Katastrophe folgt."},
{q:"Zeige zwei naturalistische Merkmale am Text.", a:"Determinismus: Thiel ist von seinen Trieben und von Lenes Macht abhängig und kann sich nicht befreien. Milieu und Genauigkeit: Das ärmliche Leben an der Bahnstrecke und Lenes Gewalt werden ungeschönt und detailliert geschildert."}]},

{t:"Büchner: Woyzeck", s:`Einordnung
• Dramenfragment, entstanden 1836/37; Büchner starb 1837, Erstdruck 1879, Uraufführung 1913
• Vormärz; Vorläufer des Naturalismus und Expressionismus
• Historisches Vorbild: Johann Christian Woyzeck, 1824 in Leipzig wegen Mordes hingerichtet

Form
• Offene Form: lose verbundene Szenen, keine feste Reihenfolge (mehrere Handschriften)
• Sprache: Alltagssprache, Dialekt, kurze Sätze, Ausrufe, Brüche – zeigt die Sprachlosigkeit der Figuren

Inhalt
• Woyzeck ist ein armer Soldat. Um Marie und ihr gemeinsames uneheliches Kind zu versorgen, rasiert er den Hauptmann und lässt sich vom Doktor für Experimente benutzen (er darf nur Erbsen essen)
• Er hat Visionen und hört Stimmen
• Marie beginnt eine Affäre mit dem Tambourmajor; Woyzeck wird gedemütigt und vom Tambourmajor verprügelt
• Woyzeck kauft ein Messer und ersticht Marie am Teich

Figuren
• Woyzeck: ausgebeutet, getrieben, verzweifelt
• Marie: zwischen Liebe, Schuldgefühl und Wunsch nach einem besseren Leben
• Hauptmann: predigt Moral und verachtet Woyzeck („Er hat keine Moral“)
• Doktor: behandelt Woyzeck wie ein Versuchsobjekt
• Tambourmajor: kraftstrotzend, Gegenbild zu Woyzeck
• Andres: Freund und Kamerad

Themen
• Soziale Frage: Armut bestimmt das Handeln („Wir arme Leut“)
• Ausbeutung und Entmenschlichung durch Militär und Wissenschaft
• Wahnsinn und Verantwortung: Ist Woyzeck schuldfähig?
• Eifersucht und Gewalt
• Sinnlosigkeit: Das Märchen der Großmutter erzählt von einer leeren, toten Welt (Antimärchen)

Fallstricke
• Woyzeck nicht nur als Mörder sehen: Das Stück zeigt, wie Gesellschaft ihn zerstört
• Wegen der offenen Form vorsichtig mit „Anfang“ und „Ende“ argumentieren`, k:[
{q:"Erkläre, wie Hauptmann und Doktor Woyzeck behandeln.", a:"Der Hauptmann belehrt Woyzeck über Moral und verspottet ihn, obwohl Woyzeck von seinem Dienst abhängig ist. Der Doktor nutzt ihn für ein Ernährungsexperiment und sieht in ihm nur ein Versuchsobjekt. Beide zeigen die Entmenschlichung des Armen durch Höhergestellte."},
{q:"Erläutere die Funktion des Großmutter-Märchens.", a:"Es erzählt von einem Kind, das allein in einer toten Welt zurückbleibt – ein Antimärchen ohne glückliches Ende. Es spiegelt die Hoffnungslosigkeit und Verlassenheit der Figuren und die Sinnleere ihrer Welt."},
{q:"Erkläre, warum man von einer offenen Form spricht.", a:"Das Drama besteht aus kurzen, lose verbundenen Szenen ohne festen Spannungsbogen, und die Reihenfolge ist wegen des Fragments nicht eindeutig. Es gibt keine geschlossene Handlung nach klassischem Muster."}]}
]};

const DE_EPO = {ch:"Literaturepochen", items:[
{t:"Barock (ca. 1600–1720)", s:`Hintergrund
• Dreißigjähriger Krieg (1618–1648), Pest, Hungersnöte
• Absolutismus und Hofkultur; starke Rolle der Religion

Weltbild und Motive
• Vanitas: Alles Irdische ist vergänglich und nichtig
• Memento mori: Bedenke, dass du sterben musst
• Carpe diem: Nutze den Tag
• Gegensätze: Diesseits und Jenseits, Lebenslust und Todesangst

Formen und Sprache
• Sonett (zwei Quartette, zwei Terzette) mit Alexandriner (sechshebiger Jambus mit Zäsur in der Mitte)
• Antithesen, Häufungen, Metaphern, Emblematik
• Strenge Regeln (Opitz, Buch von der Deutschen Poeterey, 1624)

Autoren und Werke
• Andreas Gryphius: Es ist alles eitel, Tränen des Vaterlandes
• Hofmann von Hofmannswaldau, Martin Opitz, Paul Fleming
• Grimmelshausen: Der abenteuerliche Simplicissimus (Schelmenroman)

Fallstricke
• Die Zäsur im Alexandriner unterstützt oft die Antithese – das solltest du in Analysen ansprechen`, k:[
{q:"Erkläre die drei Leitmotive Vanitas, Memento mori und Carpe diem.", a:"Vanitas: Alles Irdische ist vergänglich. Memento mori: Der Mensch soll an seinen Tod denken. Carpe diem: Das kurze Leben soll genutzt werden. Alle drei entstehen aus der Erfahrung von Krieg, Pest und Tod."},
{q:"Beschreibe Aufbau und Versmaß eines Barocksonetts.", a:"Ein Sonett besteht aus zwei Quartetten und zwei Terzetten (14 Verse). Typisch ist der Alexandriner: sechshebiger Jambus mit einer Zäsur nach der dritten Hebung, die Gegensätze betont."}]},

{t:"Aufklärung (ca. 1720–1800)", s:`Hintergrund
• Vernunft statt Autorität und Aberglaube
• Kant (1784): Aufklärung ist der Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit; Wahlspruch „Sapere aude“ – Habe Mut, dich deines eigenen Verstandes zu bedienen
• Aufstieg des Bürgertums

Ideen
• Vernunft, Toleranz, Erziehung, Kritik an Adel und Kirche
• Literatur soll belehren und unterhalten („prodesse et delectare“)

Gattungen
• Fabel und Lehrgedicht
• Bürgerliches Trauerspiel: Bürger als tragische Helden (statt nur Adlige)
• Ideendrama

Autoren und Werke
• Gotthold Ephraim Lessing: Nathan der Weise (Ringparabel, Toleranz), Emilia Galotti, Miss Sara Sampson
• Christian Fürchtegott Gellert (Fabeln), Immanuel Kant (Philosophie)

Fallstricke
• Die Empfindsamkeit läuft parallel zur Aufklärung – Gefühl und Vernunft schließen sich nicht aus`, k:[
{q:"Erkläre Kants Definition der Aufklärung in eigenen Worten.", a:"Der Mensch soll lernen, selbst zu denken, statt sich von Autoritäten bevormunden zu lassen. Unmündig ist er nicht aus Mangel an Verstand, sondern aus fehlendem Mut, ihn zu benutzen."},
{q:"Was ist ein bürgerliches Trauerspiel?", a:"Eine Tragödie, in der Bürger statt Adlige die Hauptfiguren sind. Konflikte entstehen oft zwischen bürgerlicher Moral und adliger Willkür, z.B. in Lessings Emilia Galotti."}]},

{t:"Sturm und Drang (ca. 1765–1785)", s:`Hintergrund
• Junge Autoren rebellieren gegen die einseitige Vernunft der Aufklärung und gegen Fürstenwillkür
• Vorläufer: Empfindsamkeit (Gefühl, Innerlichkeit)

Ideen
• Genie: Der schöpferische Mensch folgt eigenen Regeln
• Gefühl, Leidenschaft, Natur, Freiheit
• Rebellion gegen Autoritäten und Standesschranken

Sprache und Form
• Ausrufe, Ellipsen, Gedankenstriche, Kraftausdrücke
• Freie Rhythmen in der Lyrik, offene Dramenform

Autoren und Werke
• Goethe: Die Leiden des jungen Werthers (Briefroman), Prometheus, Willkommen und Abschied
• Schiller: Die Räuber, Kabale und Liebe
• Johann Gottfried Herder (Volkslied, Sprache)

Fallstricke
• Sturm und Drang ist keine Gegenbewegung zur Aufklärung insgesamt, sondern eine Erweiterung um Gefühl und Individualität`, k:[
{q:"Erkläre den Geniebegriff des Sturm und Drang.", a:"Das Genie schafft aus eigener Kraft und Eingebung, nicht nach überlieferten Regeln. Es ist ein schöpferischer, freier Mensch – im Gedicht Prometheus etwa stellt sich der Mensch selbstbewusst gegen die Götter."},
{q:"Nenne zwei sprachliche Merkmale und ihre Wirkung.", a:"Ausrufe und Ellipsen: Sie wirken leidenschaftlich und spontan und zeigen starke Gefühle. Freie Rhythmen: Die Befreiung von festen Versmaßen spiegelt die Forderung nach Freiheit."}]},

{t:"Weimarer Klassik (1786–1805)", s:`Hintergrund
• Goethes Italienreise (1786) als Beginn, Schillers Tod (1805) als Ende
• Reaktion auf die Gewalt der Französischen Revolution: Veränderung durch Bildung statt Umsturz

Ideen
• Humanität: der gute, harmonische Mensch
• Harmonie von Gefühl und Vernunft, Pflicht und Neigung
• Vorbild Antike; Kunst als Weg zur Bildung des Menschen (Schiller: ästhetische Erziehung)

Form und Sprache
• Geschlossene Form, Maß und Ordnung
• Blankvers im Drama, Balladen (Balladenjahr 1797)

Autoren und Werke
• Goethe: Iphigenie auf Tauris, Torquato Tasso, Faust I (teilweise)
• Schiller: Wallenstein, Maria Stuart, Wilhelm Tell, Balladen (Die Bürgschaft)

Fallstricke
• Klassik zeigt Ideale, keine realistische Wirklichkeit`, k:[
{q:"Erkläre das Humanitätsideal der Klassik.", a:"Der Mensch soll sich zu einer harmonischen, sittlichen Persönlichkeit bilden, in der Gefühl und Vernunft im Einklang stehen. Konflikte werden durch Einsicht und Menschlichkeit gelöst – wie in Goethes Iphigenie."},
{q:"Warum lehnten die Klassiker eine Revolution wie in Frankreich ab?", a:"Sie erlebten, dass die Revolution in Gewalt (Terror) umschlug. Sie setzten deshalb auf die langsame Bildung des Einzelnen durch Kunst und Erziehung als Weg zu einer besseren Gesellschaft."}]},

{t:"Romantik (ca. 1795–1835)", s:`Phasen
• Frühromantik (Jena): Novalis, Friedrich und August Wilhelm Schlegel, Tieck
• Hochromantik (Heidelberg/Berlin): Brentano, Arnim, Brüder Grimm
• Spätromantik: Eichendorff, E.T.A. Hoffmann

Ideen
• Sehnsucht nach dem Unendlichen, Flucht aus der nüchternen Wirklichkeit
• „Blaue Blume“ (Novalis) als Symbol der Sehnsucht
• Universalpoesie (Schlegel): alle Gattungen und Lebensbereiche verbinden
• Natur als beseelt, Nacht, Traum, das Unbewusste
• Verklärung des Mittelalters, Volkslied, Märchen
• Romantische Ironie

Schwarze Romantik
• Das Unheimliche, Wahnsinn, Doppelgänger (z.B. E.T.A. Hoffmann: Der Sandmann)

Autoren und Werke
• Eichendorff: Mondnacht, Aus dem Leben eines Taugenichts
• Novalis: Heinrich von Ofterdingen, Hymnen an die Nacht
• Brentano/Arnim: Des Knaben Wunderhorn; Brüder Grimm: Kinder- und Hausmärchen

Fallstricke
• Romantik ist nicht nur „schön und kitschig“ – sie hat eine dunkle, psychologische Seite`, k:[
{q:"Erkläre das Motiv der Sehnsucht in der Romantik.", a:"Die Romantiker empfanden die Wirklichkeit als begrenzt und nüchtern. Sie sehnten sich nach dem Unendlichen, nach Ferne, Vergangenheit oder einer höheren Welt. Die blaue Blume bei Novalis ist das Symbol dafür."},
{q:"Was ist die Schwarze Romantik? Nenne ein Beispiel.", a:"Eine Richtung, die das Unheimliche, Grausame und Wahnsinnige zeigt. Beispiel: E.T.A. Hoffmanns Der Sandmann mit Trauma, Automaten und Wahnsinn."}]},

{t:"Biedermeier und Vormärz (1815–1848)", s:`Hintergrund
• Nach dem Wiener Kongress 1815: Restauration, Zensur (Karlsbader Beschlüsse 1819)
• Endet mit der Märzrevolution 1848

Biedermeier
• Rückzug ins Private, Familie, Idylle, Natur
• Bescheidenheit, Ordnung, Resignation
• Autoren: Eduard Mörike, Annette von Droste-Hülshoff (Die Judenbuche), Adalbert Stifter

Vormärz / Junges Deutschland
• Politisch engagierte Literatur: Kritik an Zensur, Unterdrückung und sozialer Not
• Ziel: Freiheit, Demokratie, nationale Einheit
• Ironie, Satire, Flugschriften
• Autoren: Heinrich Heine (Deutschland. Ein Wintermärchen), Georg Büchner (Der Hessische Landbote, Woyzeck), Georg Herwegh

Fallstricke
• Beide Strömungen existieren gleichzeitig: Rückzug (Biedermeier) und Protest (Vormärz) sind zwei Antworten auf dieselbe politische Lage`, k:[
{q:"Vergleiche Biedermeier und Vormärz.", a:"Beide reagieren auf Restauration und Zensur. Das Biedermeier zieht sich ins Private und Idyllische zurück, der Vormärz kritisiert die politischen Verhältnisse offen und fordert Veränderung."},
{q:"Ordne Büchners Woyzeck einer Strömung zu und begründe.", a:"Vormärz: Das Stück zeigt soziale Not und Ausbeutung der Armen und kritisiert die herrschenden Verhältnisse, wie Büchner es auch im Hessischen Landboten tat."}]},

{t:"Realismus (1848–1890)", s:`Hintergrund
• Nach der gescheiterten Revolution 1848: Industrialisierung, Aufstieg des Bürgertums, Reichsgründung 1871

Ideen
• Poetischer oder bürgerlicher Realismus: Wirklichkeit wird dargestellt, aber künstlerisch geordnet und verklärt
• Humor als versöhnende Haltung
• Hässliches und Elend werden eher ausgespart

Gattungen
• Novelle (z.B. mit Dingsymbol und Rahmen), Gesellschaftsroman

Autoren und Werke
• Theodor Fontane: Effi Briest, Irrungen, Wirrungen
• Theodor Storm: Der Schimmelreiter
• Gottfried Keller: Kleider machen Leute; Wilhelm Raabe

Fallstricke
• Realismus ist nicht dasselbe wie Naturalismus: Der Naturalismus zeigt die Wirklichkeit schonungslos und ohne Verklärung`, k:[
{q:"Was bedeutet „poetischer Realismus“?", a:"Die Wirklichkeit wird realistisch dargestellt, aber durch Auswahl, Ordnung und Humor künstlerisch gestaltet. Krasse Not und Hässliches treten in den Hintergrund."},
{q:"Grenze Realismus und Naturalismus voneinander ab.", a:"Der Realismus verklärt die Wirklichkeit und zeigt v.a. das Bürgertum. Der Naturalismus will sie möglichst genau und ungeschönt abbilden, zeigt Elend, Krankheit und das Proletariat und betont den Determinismus."}]},

{t:"Naturalismus (ca. 1880–1900)", s:`Hintergrund
• Industrialisierung, Verstädterung, Massenelend, soziale Frage
• Naturwissenschaftliches Weltbild: Darwin, Positivismus

Ideen
• Determinismus (nach Hippolyte Taine): Der Mensch wird durch Vererbung, Milieu und Zeitumstände bestimmt
• Kunst soll die Wirklichkeit möglichst genau abbilden – Arno Holz: „Kunst = Natur – x“
• Themen: Armut, Krankheit, Alkohol, Gewalt, Arbeiterschaft

Sprache und Technik
• Dialekt, Umgangssprache
• Sekundenstil: Zeit wird fast in Echtzeit erzählt
• Genaue Beschreibungen und Regieanweisungen

Autoren und Werke
• Gerhart Hauptmann: Die Weber, Vor Sonnenaufgang, Bahnwärter Thiel
• Arno Holz und Johannes Schlaf: Papa Hamlet

Fallstricke
• Die Formel „x“ steht für die Mittel des Künstlers – je kleiner x, desto näher kommt die Kunst der Natur`, k:[
{q:"Erkläre den Determinismus des Naturalismus.", a:"Der Mensch ist nicht frei, sondern durch Vererbung, Milieu und seine Zeit bestimmt. Seine Handlungen sind Folgen dieser Umstände – die Literatur zeigt deshalb, wie Verhältnisse Menschen formen und zerstören."},
{q:"Was ist der Sekundenstil?", a:"Eine Erzähltechnik, bei der Erzählzeit und erzählte Zeit fast gleich sind. Jedes Geräusch, jede Bewegung wird minutiös festgehalten, um die Wirklichkeit möglichst genau wiederzugeben."}]},

{t:"Jahrhundertwende und Moderne (ca. 1890–1920)", s:`Hintergrund
• Gegenbewegungen zum Naturalismus; Fortschrittsskepsis, Nervosität, Krisengefühl („Fin de Siècle“)
• Psychoanalyse (Freud), Großstadt, neue Wahrnehmung

Strömungen
• Impressionismus: flüchtige Sinneseindrücke und Stimmungen
• Symbolismus: Kunst als eigene, symbolische Welt („l’art pour l’art“)
• Décadence: Verfall, Müdigkeit, Ästhetizismus
• Wiener Moderne: Seelenleben, innerer Monolog

Sprachkrise
• Hugo von Hofmannsthal, Ein Brief (Chandos-Brief, 1902): Zweifel daran, dass Sprache die Wirklichkeit erfassen kann

Autoren und Werke
• Rainer Maria Rilke: Dinggedichte (Der Panther)
• Arthur Schnitzler: Lieutenant Gustl (innerer Monolog), Traumnovelle
• Stefan George, Thomas Mann: Buddenbrooks, Tonio Kröger

Fallstricke
• „Moderne“ ist ein Sammelbegriff – nenne in Analysen möglichst die konkrete Strömung`, k:[
{q:"Erkläre den Begriff Sprachkrise.", a:"Das Gefühl, dass Wörter die Wirklichkeit und das innere Erleben nicht mehr angemessen ausdrücken können. Hofmannsthals Chandos-Brief beschreibt einen Dichter, dem die Begriffe „wie modrige Pilze“ im Mund zerfallen."},
{q:"Was ist ein Dinggedicht? Nenne ein Beispiel.", a:"Ein Gedicht, das einen Gegenstand oder ein Lebewesen möglichst genau und objektiv beschreibt und dadurch sein Wesen sichtbar macht, z.B. Rilkes Der Panther."}]},

{t:"Expressionismus (ca. 1910–1925)", s:`Hintergrund
• Großstadterfahrung, Industrialisierung, Erster Weltkrieg
• Generationenkonflikt, Aufbruch, aber auch Weltuntergangsangst

Themen
• Großstadt: Anonymität, Hektik, Vereinzelung
• Ich-Zerfall, Wahnsinn, Krankheit, Tod
• Krieg, Weltende, Apokalypse
• Hoffnung auf einen „neuen Menschen“

Sprache und Form
• Reihungsstil / Simultanstil: unverbundene Bilder nebeneinander
• Starke, oft hässliche Bilder, grelle Farben, Neologismen
• Teilweise Sonettform als Kontrast zum chaotischen Inhalt

Autoren und Werke
• Jakob van Hoddis: Weltende
• Georg Heym: Der Gott der Stadt
• Georg Trakl: Grodek
• Gottfried Benn: Morgue
• Else Lasker-Schüler, Alfred Lichtenstein

Fallstricke
• Die strenge Form (z.B. Sonett) und der zerrissene Inhalt bilden oft einen bewussten Kontrast`, k:[
{q:"Erkläre den Reihungsstil und seine Wirkung.", a:"Viele kurze, oft unverbundene Bilder werden aneinandergereiht. Das wirkt hektisch und zersplittert und spiegelt die chaotische Wahrnehmung in Großstadt und Krieg."},
{q:"Nenne drei typische Themen expressionistischer Lyrik.", a:"Großstadt mit Anonymität und Hektik, Weltuntergang und Krieg, Zerfall des Ichs und Krankheit."}]},

{t:"Literatur der Weimarer Republik (1918–1933)", s:`Hintergrund
• Nach dem Ersten Weltkrieg: Demokratie, Inflation, Weltwirtschaftskrise
• Großstadt Berlin, Massenmedien

Neue Sachlichkeit
• Nüchterne, sachliche, distanzierte Darstellung
• Alltag, Arbeit, Angestelltenwelt, Großstadt
• Gebrauchslyrik: verständlich, für den Alltag
• Zeitroman, Reportage

Episches Theater
• Bertolt Brecht: Der Zuschauer soll nicht mitfühlen, sondern kritisch nachdenken (Verfremdungseffekt)

Autoren und Werke
• Erich Kästner: Fabian, Gedichte
• Alfred Döblin: Berlin Alexanderplatz (Montagetechnik)
• Irmgard Keun: Das kunstseidene Mädchen
• Bertolt Brecht: Die Dreigroschenoper

Fallstricke
• Brechts episches Theater nicht mit dem Begriff „Epik“ verwechseln – es ist eine Form des Dramas`, k:[
{q:"Was kennzeichnet die Neue Sachlichkeit?", a:"Eine nüchterne, distanzierte Darstellung der Wirklichkeit, besonders der Großstadt und der Angestelltenwelt, in klarer, alltagsnaher Sprache – ohne Pathos."},
{q:"Erkläre den Verfremdungseffekt bei Brecht.", a:"Vertrautes wird fremd gemacht, z.B. durch Songs, Kommentare oder Spruchbänder. Die Zuschauer sollen sich nicht einfühlen, sondern kritisch über gesellschaftliche Verhältnisse nachdenken."}]},

{t:"Exilliteratur (1933–1945)", s:`Hintergrund
• Machtübernahme der Nationalsozialisten 1933, Bücherverbrennung am 10. Mai 1933
• Viele Autoren fliehen ins Ausland (Exil), andere bleiben (innere Emigration)

Themen
• Heimatverlust, Fremdheit, Sprache als einzige Heimat
• Widerstand gegen den Nationalsozialismus, Aufklärung über die Diktatur
• Erinnerung an das „andere Deutschland“

Autoren und Werke
• Bertolt Brecht: Svendborger Gedichte, Leben des Galilei
• Anna Seghers: Das siebte Kreuz, Transit
• Thomas Mann, Klaus Mann (Mephisto), Lion Feuchtwanger
• Mascha Kaléko, Else Lasker-Schüler

Fallstricke
• Innere Emigration (Autoren im Land, die sich zurückziehen) von Exil unterscheiden`, k:[
{q:"Nenne zwei zentrale Themen der Exilliteratur.", a:"Heimatverlust und Fremdheit im Exil sowie Widerstand gegen den Nationalsozialismus und Aufklärung über die Diktatur."},
{q:"Was bedeutet „innere Emigration“?", a:"Autoren, die in Deutschland blieben, sich aber geistig vom Nationalsozialismus distanzierten und sich in unpolitische oder verschlüsselte Themen zurückzogen."}]},

{t:"Nachkriegsliteratur (1945–1960er)", s:`Hintergrund
• Zerstörung, Schuld, Heimkehrer, Neubeginn („Stunde Null“)
• Teilung Deutschlands (1949)

Merkmale
• Trümmerliteratur und Kahlschlag: einfache, nüchterne Sprache ohne Pathos, weil die Sprache durch NS-Propaganda belastet war
• Kurzgeschichte: unvermittelter Anfang, offenes Ende, Alltagssituation, Wendepunkt
• Gruppe 47: wichtige Autorengruppe

Autoren und Werke
• Wolfgang Borchert: Draußen vor der Tür, Das Brot
• Heinrich Böll: Wanderer, kommst du nach Spa…
• Günter Eich: Inventur
• Paul Celan: Todesfuge (Holocaust)
• Günter Grass: Die Blechtrommel (1959)

Fallstricke
• Bei Kurzgeschichten immer die typischen Merkmale am Text nachweisen`, k:[
{q:"Warum wird die Literatur nach 1945 auch Kahlschlagliteratur genannt?", a:"Die Autoren wollten eine neue, unbelastete Sprache finden, weil die Nationalsozialisten die Sprache missbraucht hatten. Sie schrieben deshalb nüchtern, schlicht und ohne Pathos – Eichs Inventur ist ein Beispiel."},
{q:"Nenne vier Merkmale einer Kurzgeschichte.", a:"Unvermittelter Anfang, offenes Ende, Alltagssituation mit Alltagsfiguren, Wendepunkt sowie knappe, oft verdichtete Sprache."}]},

{t:"DDR-, BRD- und Gegenwartsliteratur (1960–heute)", s:`DDR
• Sozialistischer Realismus, Bitterfelder Weg (Arbeiter sollen schreiben, Autoren in die Betriebe)
• Später kritische Stimmen: Christa Wolf (Der geteilte Himmel), Ulrich Plenzdorf, Wolf Biermann (Ausbürgerung 1976)

BRD
• Politisierung um 1968, dokumentarische Literatur
• Neue Subjektivität in den 1970ern: persönliche Erfahrungen

Nach 1990
• Wende- und Nachwendeliteratur: Wiedervereinigung, Identität, Ost-West-Erfahrungen
• Erinnerungsliteratur: Familie, Nationalsozialismus, DDR
• Popliteratur, Migrationsliteratur, Gegenwartsromane

Autoren und Werke
• Jenny Erpenbeck: Heimsuchung
• Christa Wolf, Thomas Brussig, Uwe Tellkamp (Der Turm), Juli Zeh, Daniel Kehlmann

Fallstricke
• Erpenbecks Heimsuchung lässt sich als Erinnerungs- und Nachwendeliteratur einordnen`, k:[
{q:"Was war der Bitterfelder Weg?", a:"Ein Programm der DDR ab 1959: Schriftsteller sollten in Betriebe gehen und Arbeiter selbst schreiben, um eine sozialistische Literatur nah am Arbeitsleben zu schaffen."},
{q:"Ordne Erpenbecks Heimsuchung in die Gegenwartsliteratur ein.", a:"Der Roman erzählt deutsche Geschichte über ein Jahrhundert an einem Ort und verarbeitet NS-Zeit, DDR und Wende. Er gehört damit zur Erinnerungs- und Nachwendeliteratur."}]}
]};

const DE_SCHREIB = {ch:"Schreibformen und Gliederungen", items:[
{t:"Interpretation epischer Texte", s:`Gliederung
1. Einleitung: Autor, Titel, Textsorte, Erscheinungsjahr, Epoche, Thema in einem Satz
2. Inhaltsangabe bzw. kurze Einordnung des Auszugs in die Handlung (Präsens, sachlich)
3. Hauptteil: Analyse und Deutung
4. Schluss: Ergebnis zusammenfassen, Deutungshypothese bestätigen, ggf. Bezug zur Epoche oder Wertung

Hauptteil – worauf du achtest
• Erzählinstanz: Ich- oder Er-Erzähler, auktorial, personal, neutral
• Erzählperspektive und Fokalisierung: Wessen Sicht sehen wir?
• Darbietungsformen: Erzählerbericht, Dialog, innerer Monolog, erlebte Rede
• Zeitgestaltung: zeitdeckend, raffend, dehnend; Rückblenden, Vorausdeutungen
• Figuren: Charakterisierung, Beziehungen, Entwicklung
• Raum und Atmosphäre, Symbole und Leitmotive
• Sprache: Satzbau, Wortwahl, Stilmittel – immer mit Wirkung

Arbeitsweise
• Vorne eine Deutungshypothese aufstellen und im Hauptteil belegen
• Jede Beobachtung: Merkmal – Zitat mit Zeilenangabe – Funktion/Wirkung
• Präsens als Tempus

Beispiel
• Einleitungssatz: In E.T.A. Hoffmanns Erzählung „Der Sandmann“ (1816), einem Werk der Schwarzen Romantik, wird gezeigt, wie ein traumatisches Kindheitserlebnis einen jungen Mann in den Wahnsinn treibt.

Fallstricke
• Keine reine Nacherzählung im Hauptteil
• Stilmittel nie nur benennen, sondern immer die Wirkung erklären`, k:[
{q:"Formuliere einen Einleitungssatz zu Fontanes „Irrungen, Wirrungen“.", a:"Beispiel: Theodor Fontanes Roman „Irrungen, Wirrungen“ (1888), ein Werk des poetischen Realismus, erzählt von der Liebe zwischen der Kleinbürgerin Lene und dem Adligen Botho, die an den Standesgrenzen der Gesellschaft scheitert."},
{q:"Erkläre den Unterschied zwischen innerem Monolog und erlebter Rede.", a:"Innerer Monolog: Gedanken werden direkt in der 1. Person und im Präsens wiedergegeben. Erlebte Rede: Gedanken stehen in der 3. Person und im Präteritum, aber aus Sicht der Figur, ohne Redeeinleitung."}]},

{t:"Gedichtinterpretation und Gedichtvergleich", s:`Gliederung
1. Einleitung: Autor, Titel, Erscheinungsjahr, Epoche, Thema, Deutungshypothese
2. Formaler Aufbau: Strophen, Verse, Reimschema, Metrum, Kadenzen
3. Inhaltlich-sprachliche Analyse: Strophe für Strophe oder nach Aspekten
4. Schluss: Ergebnis, Bezug zur Epoche, Bewertung

Was du analysierst
• Lyrisches Ich bzw. Sprecher und seine Situation
• Thema und Motive
• Bildlichkeit: Metaphern, Vergleiche, Personifikationen, Symbole
• Klang und Rhythmus: Alliteration, Assonanz, Enjambement, Zäsur
• Zusammenspiel von Form und Inhalt (z.B. Brüche im Metrum an wichtigen Stellen)

Gedichtvergleich
• Einleitung: beide Gedichte vorstellen und gemeinsames Thema benennen
• Erstes Gedicht interpretieren, dann zweites – mit Blick auf die Vergleichsaspekte
• Oder aspektorientiert: Thema, Form, Sprache, Sprecherhaltung jeweils vergleichend
• Gemeinsamkeiten und Unterschiede am Ende bündeln und mit den Epochen erklären

Beispiel
• Deutungshypothese: Das Gedicht zeigt die romantische Sehnsucht nach Einheit von Himmel und Erde, die im Bild der Seele, die „nach Haus“ fliegt, ihren Höhepunkt findet.

Fallstricke
• Formanalyse nicht isoliert abarbeiten – immer fragen: Was bewirkt die Form?
• Lyrisches Ich nicht mit dem Autor gleichsetzen`, k:[
{q:"Warum darf man das lyrische Ich nicht mit dem Autor gleichsetzen?", a:"Das lyrische Ich ist eine Sprecherinstanz im Gedicht, die der Autor gestaltet. Es kann Gefühle oder Haltungen ausdrücken, die nicht die des Autors sein müssen."},
{q:"Nenne zwei Möglichkeiten, einen Gedichtvergleich aufzubauen.", a:"Linear: erst Gedicht A, dann Gedicht B interpretieren und anschließend vergleichen. Aspektorientiert: nach Vergleichsaspekten wie Thema, Form und Sprache gliedern und beide Gedichte jeweils gegenüberstellen."}]},

{t:"Dramenszenenanalyse", s:`Gliederung
1. Einleitung: Autor, Titel, Gattung, Erscheinungs- oder Uraufführungsjahr, Epoche, Thema
2. Einordnung der Szene in den Handlungsverlauf (was davor geschah, was folgt)
3. Kurze Inhaltsangabe der Szene
4. Analyse: Gesprächsverlauf, Figuren, Sprache, Funktion
5. Schluss: Bedeutung der Szene für das ganze Drama

Analyseaspekte
• Gesprächsverlauf: Wer führt, wer reagiert? Wendepunkte, Machtverhältnisse
• Redeanteile, Gesprächsstrategien (überzeugen, drohen, ausweichen)
• Figurenkonstellation und Charakterisierung
• Sprache: Vers oder Prosa, Satzbau, rhetorische Mittel, Unterbrechungen
• Regieanweisungen, Monolog, Dialog, Beiseitesprechen
• Funktion im Aufbau: Exposition, steigende Handlung, Höhepunkt/Peripetie, retardierendes Moment, Katastrophe

Dramenformen
• Geschlossenes Drama (z.B. Iphigenie): fünf Akte, Einheit von Ort, Zeit, Handlung, wenige Figuren, gehobene Sprache
• Offenes Drama (z.B. Woyzeck): lose Szenen, viele Orte, Alltagssprache

Fallstricke
• Die Einordnung in den Gesamtzusammenhang ist Pflicht – ohne sie fehlt die Deutung`, k:[
{q:"Nenne die fünf Phasen des klassischen Dramenaufbaus nach Freytag.", a:"Exposition, steigende Handlung, Höhepunkt mit Peripetie, fallende Handlung mit retardierendem Moment, Katastrophe (bzw. Lösung)."},
{q:"Vergleiche geschlossene und offene Dramenform an Iphigenie und Woyzeck.", a:"Iphigenie: fünf Akte, ein Ort, kurze Zeitspanne, Blankvers, wenige Figuren – geschlossen. Woyzeck: lose, kurze Szenen an vielen Orten, Alltagssprache und Dialekt, kein klarer Spannungsbogen – offen."}]},

{t:"Analyse pragmatischer Texte (Sachtextanalyse)", s:`Gliederung
1. Einleitung: Autor, Titel, Textsorte (Kommentar, Rede, Essay …), Quelle, Datum, Thema, Kernaussage
2. Hauptteil: Aufbau und Argumentation, sprachliche Gestaltung, Intention und Adressaten
3. Schluss: Zusammenfassung, ggf. Bewertung der Wirkung

Argumentation untersuchen
• These, Argumente, Belege und Beispiele unterscheiden
• Argumenttypen: Faktenargument, Autoritätsargument, normatives Argument, Analogie, Erfahrung
• Gegenargumente: Werden sie genannt und entkräftet?
• Gedankengang: Wie baut der Autor seine Position auf?

Sprache und Wirkung
• Wortwahl (wertend, sachlich), Satzbau, rhetorische Fragen, Ironie, Appelle
• Wirkung auf den Leser und Absicht (informieren, überzeugen, appellieren)

Formulierungshilfen
• Der Autor stellt die These auf, dass …
• Er stützt seine Aussage mit … / Er relativiert …
• Durch die rhetorische Frage … wird der Leser zum Nachdenken angeregt.

Fallstricke
• Indirekte Rede verwenden (Konjunktiv I), wenn du die Position des Autors wiedergibst
• Analyse ist keine Erörterung: Deine Meinung gehört nur in einen ausdrücklich verlangten Teil`, k:[
{q:"Unterscheide These, Argument und Beleg.", a:"These: die Behauptung, die bewiesen werden soll. Argument: die Begründung der These. Beleg: ein Beispiel, eine Zahl oder ein Zitat, das das Argument stützt."},
{q:"Gib im Konjunktiv I wieder: „Soziale Medien machen Jugendliche einsam.“", a:"Der Autor behauptet, soziale Medien machten Jugendliche einsam. (Da „machen“ im Konjunktiv I mit dem Indikativ übereinstimmt, wird hier der Konjunktiv II „machten“ als Ersatz verwendet.)"}]},

{t:"Erörterung", s:`Formen
• Textgebundene Erörterung: Auseinandersetzung mit der Position eines Sachtextes
• Literarische Erörterung: Frage zu einem literarischen Werk (z.B. „Ist Woyzeck schuldig?“)
• Freie Erörterung: zu einem allgemeinen Thema

Gliederung
1. Einleitung: Hinführung zum Thema (aktueller Anlass, Zitat, Definition), Fragestellung
2. Hauptteil
   • Linear (steigernd): Argumente für eine Position, vom schwächsten zum stärksten
   • Dialektisch (Pro und Contra): Gegenposition zuerst, eigene Position danach, stärkstes Argument zum Schluss
3. Schluss: Abwägung, eigenes begründetes Urteil, ggf. Ausblick

Aufbau eines Arguments
• Behauptung – Begründung – Beispiel (Beleg) – Rückbezug auf die Frage
• Merkhilfe: These, Argument, Beispiel, Schlussfolgerung

Beispiel
• Literarische Erörterung: Woyzeck ist zwar Täter, doch das Stück zeigt, wie Armut, Ausbeutung durch Hauptmann und Doktor sowie seine psychische Zerrüttung ihn zu dieser Tat treiben. Deshalb trägt auch die Gesellschaft Verantwortung.

Fallstricke
• Beispiele allein ersetzen keine Begründung
• Bei literarischen Erörterungen immer mit Textstellen argumentieren`, k:[
{q:"Erkläre den Aufbau einer dialektischen Erörterung.", a:"Nach der Einleitung folgen zunächst die Argumente der Gegenposition, dann die der eigenen Position, jeweils steigernd. Im Schluss wägt man ab und formuliert ein begründetes Urteil."},
{q:"Formuliere ein vollständiges Argument zur Frage „Sollte Handynutzung im Unterricht erlaubt sein?“.", a:"Beispiel: Handys sollten im Unterricht gezielt erlaubt sein (Behauptung), weil sie schnellen Zugang zu Informationen ermöglichen (Begründung). So können Schüler etwa Fachbegriffe sofort recherchieren (Beispiel). Damit fördern sie selbstständiges Lernen (Rückbezug)."}]},

{t:"Materialgestütztes Verfassen informierender Texte", s:`Aufgabe
• Aus mehreren Materialien (Texte, Grafiken, Tabellen) einen eigenen informierenden Text schreiben, z.B. einen Lexikonartikel, Fachartikel oder Beitrag für eine Broschüre
• Ein bestimmter Adressat und eine Schreibsituation sind vorgegeben

Vorgehen
1. Aufgabe genau lesen: Textsorte, Adressat, Umfang, Schwerpunkte
2. Materialien auswerten: Kernaussagen markieren, Zahlen aus Grafiken entnehmen
3. Stoff ordnen: Gliederung nach Unterthemen, nicht nach Materialien
4. Text schreiben: sachlich, verständlich, adressatengerecht
5. Überarbeiten

Aufbau des Textes
• Überschrift (ggf. Zwischenüberschriften)
• Einleitung mit Hinführung und Überblick
• Hauptteil: Informationen thematisch gegliedert, Zusammenhänge erklärt
• Schluss: Zusammenfassung oder Ausblick

Sprache
• Sachlich, neutral, präzise; Fachbegriffe erklären
• Materialien sinngemäß nutzen, nicht abschreiben; bei Zitaten Quelle angeben

Fallstricke
• Keine eigene Meinung einbauen – das ist ein informierender Text
• Nicht Material für Material zusammenfassen, sondern Informationen verknüpfen`, k:[
{q:"Warum solltest du nicht Material für Material zusammenfassen?", a:"Ein informierender Text soll ein Thema verständlich erklären. Dafür müssen Informationen aus verschiedenen Materialien nach Unterthemen geordnet und verknüpft werden. Eine Aneinanderreihung von Zusammenfassungen wirkt unzusammenhängend."},
{q:"Wie berücksichtigst du den Adressaten?", a:"Wortwahl, Fachbegriffe und Erklärtiefe an das Vorwissen des Adressaten anpassen, z.B. Fachbegriffe für jüngere Leser erklären und Beispiele aus deren Lebenswelt wählen."}]},

{t:"Materialgestütztes Verfassen argumentierender Texte", s:`Aufgabe
• Mit Hilfe von Materialien einen eigenen argumentierenden Text verfassen, z.B. Kommentar, Leserbrief, Rede, Essay
• Ziel: begründet Stellung nehmen und den Adressaten überzeugen

Vorgehen
1. Aufgabe klären: Textsorte, Adressat, Anlass, Position
2. Materialien auswerten: Pro- und Contra-Argumente, Zahlen, Beispiele herausarbeiten
3. Eigene Position festlegen und Argumente gewichten
4. Gliedern und schreiben, Materialien als Belege einbauen
5. Überarbeiten

Aufbau
• Einstieg: aktueller Anlass, Problem, ggf. provokante These oder Frage
• Hauptteil: Argumente steigernd anordnen; Gegenargumente aufgreifen und entkräften
• Schluss: Fazit, Appell oder Forderung

Sprache und Textsorte
• Kommentar: pointiert, wertend, oft mit Ironie
• Rede: direkte Anrede, rhetorische Fragen, Wiederholungen
• Leserbrief: Bezug auf einen Artikel, klare persönliche Position

Fallstricke
• Materialien als Belege nutzen, aber mit eigenen Worten und Quellenhinweis
• Die Textsorte bestimmt Ton und Form – das wird bewertet`, k:[
{q:"Wie baust du ein Gegenargument wirkungsvoll in einen Kommentar ein?", a:"Gegenargument fair nennen, dann entkräften oder relativieren, z.B.: Zwar wird oft behauptet, …, doch zeigen aktuelle Zahlen, dass … Damit wirkt die eigene Position durchdachter und überzeugender."},
{q:"Nenne drei sprachliche Mittel einer Rede und ihre Wirkung.", a:"Direkte Anrede (bindet das Publikum ein), rhetorische Frage (regt zum Nachdenken an und lenkt die Antwort), Wiederholung bzw. Anapher (verstärkt die Kernbotschaft und bleibt im Gedächtnis)."}]},

{t:"Werkzeugkasten: Erzähltechnik", s:`Erzählinstanz und Erzählverhalten
• Ich-Erzähler: erzählende Figur ist Teil der Handlung
• Er-/Sie-Erzähler: außerhalb der Handlung
• Auktorial: allwissend, kommentiert, kennt Gedanken mehrerer Figuren
• Personal: Sicht einer Figur, nur deren Wissen
• Neutral: wie eine Kamera, ohne Innensicht

Darbietungsformen
• Erzählerbericht, direkte Rede, indirekte Rede
• Erlebte Rede: 3. Person, Präteritum, Sicht der Figur
• Innerer Monolog: 1. Person, Präsens, direkter Gedankenstrom
• Bewusstseinsstrom: assoziativ, ungeordnet

Zeitgestaltung
• Erzählzeit (Lesezeit) und erzählte Zeit (Dauer der Handlung)
• Zeitraffend, zeitdeckend, zeitdehnend
• Rückblende, Vorausdeutung

Weitere Begriffe
• Leitmotiv: wiederkehrendes Element mit Bedeutung
• Dingsymbol: Gegenstand mit symbolischer Bedeutung (z.B. in Novellen)
• Rahmenerzählung: Binnengeschichte in einer äußeren Erzählung

Fallstricke
• Erzähler nicht mit Autor verwechseln`, k:[
{q:"Bestimme das Erzählverhalten: „Er wusste nicht, dass seine Schwester im Nebenzimmer längst alles gehört hatte.“", a:"Auktorial: Der Erzähler weiß mehr als die Figur (er kennt das Wissen der Schwester)."},
{q:"Erkläre den Unterschied zwischen Erzählzeit und erzählter Zeit.", a:"Erzählzeit ist die Zeit, die man zum Lesen braucht; erzählte Zeit ist die Zeitspanne, über die sich die Handlung erstreckt. Ihr Verhältnis zeigt, ob gerafft, gedehnt oder zeitdeckend erzählt wird."}]},

{t:"Werkzeugkasten: Lyrik und Stilmittel", s:`Metrum
• Jambus (x X), Trochäus (X x), Daktylus (X x x), Anapäst (x x X)
• Alexandriner: sechshebiger Jambus mit Zäsur; Blankvers: fünfhebiger Jambus ohne Reim
• Freie Rhythmen: ohne festes Versmaß

Reim und Strophe
• Paarreim (aabb), Kreuzreim (abab), umarmender Reim (abba), Schweifreim (aabccb)
• Kadenz: männlich (betont) oder weiblich (unbetont) endend
• Enjambement: Satz geht über das Versende hinaus
• Sonett: zwei Quartette, zwei Terzette

Bildliche Mittel
• Metapher, Vergleich, Personifikation, Symbol, Allegorie
• Synästhesie: Verbindung mehrerer Sinne

Rhetorische Mittel
• Anapher: Wiederholung am Versanfang
• Alliteration: gleicher Anlaut
• Antithese: Gegensatz
• Parallelismus, Chiasmus (Überkreuzstellung)
• Hyperbel (Übertreibung), Ironie, Klimax (Steigerung)
• Ellipse (Auslassung), rhetorische Frage

Beispiel
• Analysesatz: Durch die Anapher „Ich sah …“ in den Versen 3 bis 5 wird die Fülle der Eindrücke betont, die auf das lyrische Ich einstürmen.

Fallstricke
• Nie nur benennen – immer Funktion und Wirkung im Kontext erklären`, k:[
{q:"Bestimme das Metrum: „Es schlug mein Herz, geschwind zu Pferde!“", a:"Jambus (x X): es SCHLUG mein HERZ, ge-SCHWIND zu PFER-de – vierhebiger Jambus mit weiblicher Kadenz."},
{q:"Erkläre den Unterschied zwischen Metapher und Vergleich.", a:"Ein Vergleich verbindet zwei Bereiche mit „wie“ oder „als“ (stark wie ein Löwe). Eine Metapher überträgt die Bedeutung direkt ohne Vergleichswort (Er ist ein Löwe)."}]}
]};

Object.assign(INTRO, {
"Jenny Erpenbeck: Heimsuchung":["Stell dir ein Haus an einem See vor, in dem über hundert Jahre lang immer andere Menschen wohnen – Bauern, ein Architekt, Verfolgte, Soldaten, Heimkehrer. Genau davon erzählt dieser Roman: Jedes Kapitel gehört zu einem anderen Bewohner, und so zieht die deutsche Geschichte des 20. Jahrhunderts an einem einzigen Ort vorbei.","Der Roman ist Pflichtlektüre und eignet sich ideal, um Erzähltechnik, Zeitgestaltung und Geschichte zu verbinden. Unten findest du Aufbau, Inhalt, Erzählweise und die wichtigsten Themen."],
"Goethe: Iphigenie auf Tauris":["Eine junge Frau lebt fern ihrer Heimat auf einer Insel und dient dort als Priesterin. Als ihr Bruder auftaucht, könnte sie mit einer Lüge fliehen – doch sie entscheidet sich, ehrlich zu sein, obwohl das ihr Leben gefährdet. Das ist der Kern dieses klassischen Dramas.","Es ist das Paradebeispiel für das Menschenbild der Weimarer Klassik. Unten lernst du Vorgeschichte, Handlung, Figuren und Themen kennen."],
"E.T.A. Hoffmann: Der Sandmann":["Kennst du das Märchen vom Sandmann, der Kindern Sand in die Augen streut? In dieser Erzählung wird daraus eine unheimliche Figur, die einem Jungen ein Leben lang Angst macht – bis er nicht mehr unterscheiden kann, was echt ist und was Einbildung.","Die Erzählung ist ein Klassiker der Schwarzen Romantik und spielt mit Wahrnehmung und Wahnsinn. Unten findest du Aufbau, Inhalt, Motive und Deutungen."],
"Kleist: Der zerbrochne Krug":["Ein Dorfrichter soll herausfinden, wer nachts einen wertvollen Krug zerbrochen hat. Das Problem: Er war es selbst. Die ganze Komödie lebt davon, wie er immer verzweifelter versucht, die Wahrheit zu vertuschen.","Das Lustspiel zeigt mit viel Witz, wie Macht missbraucht wird. Unten lernst du Handlung, Figuren, Aufbau und Themen kennen."],
"Goethe: Faust. Der Tragödie erster Teil":["Ein Gelehrter weiß unglaublich viel und ist trotzdem unglücklich, weil er nicht versteht, was die Welt im Innersten zusammenhält. Er lässt sich auf eine Wette mit dem Teufel ein – und zieht dabei eine junge Frau, Gretchen, ins Unglück.","Faust ist eines der bekanntesten Werke der deutschen Literatur. Unten findest du Aufbau, die beiden Teile der Handlung, Figuren und Themen."],
"Fontane: Irrungen, Wirrungen":["Zwei Menschen lieben sich – aber sie ist eine einfache junge Frau, er ein Adliger. Im Berlin des 19. Jahrhunderts ist klar, dass sie nicht heiraten können. Der Roman erzählt still und ohne Drama, wie beide sich der Gesellschaft fügen.","Er zeigt typisch für den Realismus, wie Standesgrenzen das Leben bestimmen. Unten lernst du Inhalt, Figuren, Symbole und Themen kennen."],
"Hauptmann: Bahnwärter Thiel":["Ein stiller Bahnwärter lebt zwischen der Erinnerung an seine verstorbene erste Frau und seiner neuen, dominanten Frau. Als sein Sohn bei einem Zugunglück stirbt, bricht seine mühsam aufrechterhaltene Ordnung zusammen.","Die Novelle zeigt, wie der Naturalismus den Menschen als Produkt seiner Umstände sieht. Unten findest du Inhalt, Figuren, naturalistische Merkmale und Symbole."],
"Büchner: Woyzeck":["Ein armer Soldat schuftet für jeden Groschen, wird von seinen Vorgesetzten gedemütigt und für Experimente missbraucht – und am Ende ersticht er die Frau, die er liebt. Büchner fragt: Wer ist eigentlich schuld?","Das Fragment ist ein Schlüsselwerk zur sozialen Frage und zur offenen Dramenform. Unten lernst du Form, Inhalt, Figuren und Themen kennen."],
"Barock (ca. 1600–1720)":["Stell dir eine Zeit vor, in der Krieg, Pest und Hunger allgegenwärtig sind. Die Menschen des Barock spürten ständig, wie schnell das Leben vorbei sein kann – und das prägt ihre Gedichte.","Barocklyrik, vor allem Sonette, kommt im Abi häufig vor. Unten findest du Hintergrund, Motive, Formen und Autoren."],
"Aufklärung (ca. 1720–1800)":["Statt einfach zu glauben, was Kirche oder Herrscher sagen, sollen Menschen selbst nachdenken – das ist die Grundidee der Aufklärung. Literatur wird dabei zum Werkzeug, um zu erziehen und zu überzeugen.","Viele Werte unserer Gesellschaft wie Toleranz stammen aus dieser Zeit. Unten lernst du Ideen, Gattungen und Autoren kennen."],
"Sturm und Drang (ca. 1765–1785)":["Junge Autoren hatten genug von Regeln und reiner Vernunft. Sie wollten Gefühl, Leidenschaft und Freiheit – ein bisschen wie eine rebellische Jugendbewegung in der Literatur.","Werke wie Goethes Werther oder Schillers Räuber stammen aus dieser Zeit. Unten findest du Ideen, Sprache und Werke."],
"Weimarer Klassik (1786–1805)":["Nach dem Gefühlssturm wollten Goethe und Schiller zeigen, wie ein Mensch im Einklang mit sich selbst leben kann – ausgeglichen, gut und vernünftig. Vorbild war die Kunst der Antike.","Die Klassik prägt bis heute unser Bild von Bildung und Humanität. Unten lernst du Hintergrund, Ideen und Werke kennen."],
"Romantik (ca. 1795–1835)":["Die Romantiker fanden die Wirklichkeit zu nüchtern. Sie träumten von der Ferne, von Nacht, Märchen und dem Unendlichen – manchmal sehnsüchtig, manchmal unheimlich.","Romantische Gedichte und Erzählungen wie Der Sandmann sind im Abi sehr beliebt. Unten findest du Phasen, Ideen und Autoren."],
"Biedermeier und Vormärz (1815–1848)":["Nach Napoleon herrschten Zensur und Unterdrückung. Manche Menschen zogen sich in ihr gemütliches Zuhause zurück, andere wollten mit spitzer Feder die Verhältnisse ändern.","Diese zwei Reaktionen auf dieselbe Zeit helfen dir, Texte wie Büchners Woyzeck einzuordnen. Unten lernst du beide Strömungen kennen."],
"Realismus (1848–1890)":["Nach der gescheiterten Revolution wollten Autoren die Wirklichkeit zeigen, wie sie ist – aber nicht zu hart, sondern mit Humor und künstlerisch geordnet.","Fontanes Irrungen, Wirrungen gehört zu dieser Epoche. Unten findest du Ideen, Gattungen und Autoren."],
"Naturalismus (ca. 1880–1900)":["Fabriken, Elendsviertel, Armut: Die Naturalisten wollten die Wirklichkeit so genau abbilden wie eine Kamera – auch das Hässliche. Sie glaubten, dass Herkunft und Umgebung bestimmen, was aus einem Menschen wird.","Hauptmanns Bahnwärter Thiel ist ein Beispiel. Unten lernst du die Ideen und Techniken der Epoche."],
"Jahrhundertwende und Moderne (ca. 1890–1920)":["Um 1900 wird die Welt schneller, Freud erforscht das Unbewusste, und viele Dichter zweifeln, ob Sprache überhaupt noch ausdrücken kann, was sie fühlen. Daraus entstehen ganz verschiedene neue Stile.","Begriffe wie Sprachkrise oder Dinggedicht tauchen oft in Abi-Aufgaben auf. Unten findest du die Strömungen im Überblick."],
"Expressionismus (ca. 1910–1925)":["Lärmende Großstädte, der Erste Weltkrieg, das Gefühl, dass die Welt untergeht: Die Expressionisten schrieben laut, grell und zerrissen, um diese Erfahrungen auszudrücken.","Expressionistische Großstadt- und Kriegsgedichte sind Abi-Klassiker. Unten lernst du Themen, Stil und Autoren kennen."],
"Literatur der Weimarer Republik (1918–1933)":["Nach dem Krieg wird es nüchtern: Autoren beschreiben Großstadtleben, Arbeitslosigkeit und Alltag sachlich und ohne Pathos. Gleichzeitig entwickelt Brecht ein Theater, das zum Nachdenken zwingen soll.","Neue Sachlichkeit und episches Theater sind wichtige Begriffe fürs Abi. Unten findest du Hintergrund und Werke."],
"Exilliteratur (1933–1945)":["Als die Nationalsozialisten an die Macht kamen, wurden Bücher verbrannt und viele Schriftsteller mussten fliehen. Im Exil schrieben sie über Heimweh, Fremdheit und gegen die Diktatur.","Diese Literatur verbindet Geschichte und Dichtung besonders eng. Unten lernst du Themen und Autoren kennen."],
"Nachkriegsliteratur (1945–1960er)":["Nach dem Zweiten Weltkrieg lag nicht nur Deutschland in Trümmern, auch die Sprache war durch Propaganda beschädigt. Autoren suchten deshalb nach einfachen, ehrlichen Worten.","Kurzgeschichten aus dieser Zeit sind im Unterricht und im Abi sehr verbreitet. Unten findest du Merkmale und Werke."],
"DDR-, BRD- und Gegenwartsliteratur (1960–heute)":["Zwei deutsche Staaten, zwei Arten von Literatur – und nach 1990 die Frage, wie man die getrennte Geschichte erzählt. Bis heute beschäftigen sich Autoren mit Erinnerung, Identität und Wandel.","Hier ordnest du zum Beispiel Erpenbecks Heimsuchung ein. Unten lernst du die wichtigsten Entwicklungen kennen."],
"Interpretation epischer Texte":["Im Abi bekommst du oft einen Auszug aus einem Roman oder einer Erzählung und sollst zeigen, wie er gemacht ist und was er bedeutet. Das klingt groß, folgt aber einem festen Bauplan.","Mit einer guten Gliederung und den richtigen Fachbegriffen sammelst du sicher Punkte. Unten findest du Aufbau, Analyseaspekte und ein Beispiel."],
"Gedichtinterpretation und Gedichtvergleich":["Gedichte wirken oft rätselhaft. Bei der Interpretation entschlüsselst du Schritt für Schritt, wie Form, Klang und Bilder zusammen eine Aussage erzeugen – manchmal auch im Vergleich zweier Gedichte.","Lyrik ist eine der häufigsten Aufgabenarten im Abi. Unten lernst du einen klaren Aufbau und worauf du achten musst."],
"Dramenszenenanalyse":["Eine Theaterszene ist wie ein Gespräch unter Druck: Wer setzt sich durch, wer gibt nach, was steht auf dem Spiel? Bei der Analyse untersuchst du genau das.","Die Dramenanalyse kommt im Abi zu Werken wie Iphigenie, Faust oder Woyzeck vor. Unten findest du Gliederung und Analyseaspekte."],
"Analyse pragmatischer Texte (Sachtextanalyse)":["Kommentare, Reden oder Essays wollen dich informieren oder überzeugen. Bei der Analyse findest du heraus, mit welchen Argumenten und sprachlichen Tricks das geschieht.","Diese Fähigkeit brauchst du nicht nur im Abi, sondern überall, wo du Texte kritisch lesen willst. Unten lernst du Aufbau und Vorgehen."],
"Erörterung":["Bei einer Erörterung denkst du gründlich über eine Frage nach, wägst Pro und Contra ab und kommst zu einem begründeten Urteil – wie bei einer guten Diskussion, nur schriftlich.","Erörterungen gibt es zu Sachtexten, zu Literatur und zu freien Themen. Unten findest du Formen, Gliederungen und den Aufbau eines Arguments."],
"Materialgestütztes Verfassen informierender Texte":["Du bekommst mehrere Materialien wie Texte, Grafiken oder Tabellen und schreibst daraus einen eigenen, verständlichen Sachtext, zum Beispiel einen Lexikonartikel.","Diese Aufgabenart ist im Abi neu und gut planbar. Unten lernst du, wie du vorgehst und deinen Text aufbaust."],
"Materialgestütztes Verfassen argumentierender Texte":["Hier nutzt du Materialien, um selbst Stellung zu beziehen – zum Beispiel in einem Kommentar, einem Leserbrief oder einer Rede. Ziel ist, andere zu überzeugen.","Diese Aufgabenart verbindet Lesen, Argumentieren und Schreiben. Unten findest du Vorgehen, Aufbau und Hinweise zur Textsorte."],
"Werkzeugkasten: Erzähltechnik":["Wer erzählt eigentlich eine Geschichte, und aus welcher Sicht? Wie wird mit Zeit umgegangen? Diese Fragen beantworten die Fachbegriffe der Erzähltechnik.","Du brauchst sie bei jeder Analyse eines Romans oder einer Erzählung. Unten findest du alle wichtigen Begriffe zum Nachschlagen."],
"Werkzeugkasten: Lyrik und Stilmittel":["Gedichte haben ihre eigenen Bausteine: Versmaß, Reim, Bilder und rhetorische Figuren. Wenn du sie erkennst, kannst du erklären, warum ein Gedicht so wirkt, wie es wirkt.","Diese Begriffe brauchst du in jeder Lyrik- und Sachtextanalyse. Unten findest du die wichtigsten zum Nachschlagen."]
});

const GEO = [
{ch:"12.1 Klima und Klimawandel", items:[
{t:"Erdsphären", i:["Die Erde besteht aus mehreren „Hüllen“, die ineinandergreifen: Luft, Wasser, Gestein, Boden und Lebewesen. Was in einer Sphäre passiert – etwa mehr CO₂ in der Luft – wirkt sich auf alle anderen aus.","Dieses Denken in Zusammenhängen ist die Grundlage der ganzen Geographie. Unten lernst du die Sphären und ihre Wechselwirkungen kennen."], s:`Die Sphären
• Atmosphäre: Lufthülle
• Hydrosphäre: Wasser (Ozeane, Flüsse, Grundwasser, Eis)
• Lithosphäre: Gesteinshülle; Pedosphäre: Boden
• Biosphäre: alle Lebewesen
• Anthroposphäre: vom Menschen gestalteter Raum

Aufbau der Atmosphäre
• Troposphäre (bis ca. 8 km an den Polen, ca. 17 km am Äquator): Wettergeschehen, Temperatur nimmt um ca. 0,65 K pro 100 m ab
• Stratosphäre: Ozonschicht, filtert UV-Strahlung
• Mesosphäre und Thermosphäre darüber
• Zusammensetzung: ca. 78 % Stickstoff, 21 % Sauerstoff, knapp 1 % Argon, CO₂ ca. 0,04 %

Wechselwirkungen
• Geoökosystem: Die Sphären sind durch Stoff- und Energieflüsse verbunden
• Kreisläufe: Wasserkreislauf (Verdunstung, Kondensation, Niederschlag, Abfluss), Kohlenstoffkreislauf (Speicher: Ozeane, Biomasse, Gestein, Atmosphäre)
• Beispiel: Abholzung (Anthroposphäre) verändert Boden, Wasserhaushalt und Klima

Fallstricke
• Immer die Verknüpfung zwischen den Sphären erklären, nicht nur aufzählen`, k:[
{q:"Erkläre am Beispiel der Rodung eines Regenwaldes, wie mehrere Erdsphären zusammenwirken.", a:"Der Mensch (Anthroposphäre) entfernt die Vegetation (Biosphäre). Dadurch wird der Boden (Pedosphäre) erodiert, weniger Wasser verdunstet (Hydrosphäre), und es gelangt mehr CO₂ in die Atmosphäre. Das kann das regionale und globale Klima verändern."},
{q:"Nenne die Stockwerke der Atmosphäre und das Besondere der Troposphäre.", a:"Troposphäre, Stratosphäre, Mesosphäre, Thermosphäre. In der Troposphäre findet das Wetter statt, und die Temperatur nimmt mit der Höhe ab (ca. 0,65 K pro 100 m)."}]},

{t:"Strahlungshaushalt der Erde", i:["Die Sonne liefert fast die ganze Energie auf der Erde. Ein Teil wird zurückgestrahlt, ein Teil erwärmt Boden und Luft, und Treibhausgase halten Wärme zurück – wie eine Decke um die Erde.","Wer den Strahlungshaushalt versteht, versteht Klimazonen, Winde und den Klimawandel. Unten lernst du die wichtigsten Vorgänge."], s:`Ein- und Ausstrahlung
• Die Sonne sendet kurzwellige Strahlung
• Albedo: Anteil der Strahlung, der reflektiert wird (z.B. Neuschnee und Eis sehr hoch, Wald und Ozean niedrig)
• Absorbierte Strahlung erwärmt die Oberfläche, die langwellige Wärmestrahlung abgibt

Treibhauseffekt
• Natürlicher Treibhauseffekt: Wasserdampf, CO₂, Methan und Lachgas halten Wärmestrahlung zurück
• Ohne ihn läge die Durchschnittstemperatur bei etwa −18 °C, mit ihm bei etwa +15 °C
• Anthropogener Treibhauseffekt: Zusätzliche Treibhausgase durch den Menschen verstärken ihn

Räumliche Unterschiede
• Einfallswinkel: In den Tropen steht die Sonne steil, Energie konzentriert sich auf kleine Fläche; an den Polen flach
• Strahlungsüberschuss in niederen Breiten, Strahlungsdefizit in hohen Breiten
• Ausgleich durch atmosphärische Zirkulation und Meeresströmungen

Jahreszeiten
• Ursache: Neigung der Erdachse (ca. 23,5°) beim Umlauf um die Sonne – nicht der Abstand zur Sonne

Fallstricke
• Kurzwellige Einstrahlung und langwellige Ausstrahlung nicht verwechseln`, k:[
